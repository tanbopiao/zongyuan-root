# ZONGYUAN-ROOT 自进化沙箱 Docker Compose 配置
# 溯源：Ω₀⊂⊙∞⊂Ω | DID-BR-000002
# 用途：沙箱容器编排，支持多沙箱并行验证

version: '3.8'

services:
  # 自进化沙箱主容器
  evolution-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zongyuan-evolution-sandbox
    image: zongyuan/evolution-sandbox:2.0.0
    restart: unless-stopped
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - SANDBOX_MODE=evolution
      - SANDBOX_VERSION=2.0.0
      - 溯源标识=Ω₀⊂⊙∞⊂Ω
      - 确权编码=DID-BR-000002
    
    # 卷挂载
    volumes:
      - ./workspace:/workspace
      - ./sandbox_results:/workspace/.sandbox_results
      - ./logs:/var/log/sandbox
    
    # 网络配置
    networks:
      - sandbox-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python3", "/app/health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:size=64m
    
    # 日志配置
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 沙箱监控容器（可选）
  sandbox-monitor:
    image: prom/prometheus:latest
    container_name: zongyuan-sandbox-monitor
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitor/data:/prometheus
    networks:
      - sandbox-network
    profiles:
      - monitoring

  # 沙箱日志收集（可选）
  sandbox-logs:
    image: grafana/loki:latest
    container_name: zongyuan-sandbox-logs
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./logs/loki:/loki
    networks:
      - sandbox-network
    profiles:
      - monitoring

networks:
  sandbox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  sandbox-data:
    driver: local

<div class="wrap"><h1>巡检报告自动化 SOP V1.0</h1>
<div class="sub">定时采集 → 分析 → 报告生成 → 归档的全自动巡检闭环</div>
<h2>一、执行器</h2><p>云端 <code>run_patrol.py</code>（zr-autonomy-scaffold），定时触发，输出 PATROL-YYYYMMDD-HHMMSS.{json,html} 双格式。</p>
<h2>二、巡检维度</h2>
<table><tr><th>域</th><th>指标</th><th>阈值告警</th></tr>
<tr><td>服务</td><td>进程存活/端口监听/HTTP 状态</td><td>非 200 → 红</td></tr>
<tr><td>资源</td><td>磁盘/内存/负载</td><td>&gt;85% → 橙</td></tr>
<tr><td>真值</td><td>网关可达/上报回执/一致性</td><td>失败 → 黄</td></tr>
<tr><td>账本</td><td>Merkle 完整性/哈希比对</td><td>断裂 → 红</td></tr></table>
<h2>三、输出与归档</h2><p>JSON（机器可读）+ HTML（人审版）；报告归档至 docs/zr-autonomy-scaffold/reports/；异常项自动写入问题阻塞表并 ntfy 告警。</p><div class="foot">主节点hub-central-agent · DID-BR-000002 · 自治Lv9 · 锚定 Ω₀⊂⊙∞⊂Ω · 火斗云智AIOS</div></div></body></html>

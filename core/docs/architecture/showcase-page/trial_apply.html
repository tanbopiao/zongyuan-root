<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lite版试用申请 | 火斗云智AIOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--bg2:#111827;--border:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--gold:#d4af37;--green:#10b981;--red:#ef4444;--blue:#3b82f6}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px}
.container{max-width:600px;margin:0 auto}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header h1 span{color:var(--gold)}
.header p{color:var(--text2);font-size:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:8px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--gold)}
.trial-info{background:rgba(212,175,55,0.05);border:1px solid rgba(212,175,55,0.2);border-radius:8px;padding:16px;margin-bottom:24px}
.trial-info h4{font-size:14px;color:var(--gold);margin-bottom:8px}
.trial-info ul{list-style:none;font-size:13px;color:var(--text2);line-height:1.8}
.trial-info ul li::before{content:"✓ ";color:var(--green)}
.btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),#b8941f);color:#000;font-weight:700;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.success-box{text-align:center;padding:40px 20px;display:none}
.success-box .icon{font-size:64px;margin-bottom:20px}
.success-box h2{font-size:22px;margin-bottom:12px;color:var(--green)}
.success-box p{color:var(--text2);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>Lite版 <span>免费试用</span></h1>
  <p>7天全功能体验，无需信用卡</p>
</div>

<div class="card" id="formCard">
  <div class="trial-info">
    <h4>Lite版包含：</h4>
    <ul>
      <li>完整部署脚本</li>
      <li>核心元法则文档</li>
      <li>基础API调用示例</li>
      <li>环境检测工具</li>
      <li>社区支持（GitHub Issues）</li>
    </ul>
  </div>

  <form id="trialForm">
    <div class="form-group">
      <label>你的DID（或邮箱）</label>
      <input type="text" id="did" placeholder="DID-XXX-XXXX 或 邮箱地址" required>
    </div>
    <div class="form-group">
      <label>公司/团队名称</label>
      <input type="text" id="company" placeholder="选填">
    </div>
    <div class="form-group">
      <label>使用场景</label>
      <select id="scene">
        <option value="">请选择</option>
        <option value="gov">政务AI中台</option>
        <option value="drama">短剧/内容生产</option>
        <option value="know">企业知识库</option>
        <option value="dev">开发者/技术团队</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>描述你的需求</label>
      <textarea id="desc" rows="3" placeholder="简单描述你想用我们解决什么问题" required></textarea>
    </div>
    <button type="submit" class="btn">🚀 申请免费试用</button>
  </form>
</div>

<div class="success-box" id="successBox">
  <div class="icon">🎉</div>
  <h2>申请已提交！</h2>
  <p>我们会在24小时内通过邮件发送试用授权<br><br>
  试用密钥将发送至：<span id="emailShow"></span></p>
</div>

</div>

<script>
document.getElementById('trialForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const did = document.getElementById('did').value;
  document.getElementById('emailShow').textContent = did;
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successBox').style.display = 'block';
});
</script>

</body>
</html>

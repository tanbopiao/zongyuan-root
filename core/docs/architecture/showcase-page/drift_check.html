<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容漂移自检 | 火斗云智AIOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--bg2:#111827;--border:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--gold:#d4af37;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px}
.container{max-width:900px;margin:0 auto}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header h1 span{color:var(--gold)}
.header p{color:var(--text2);font-size:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--gold)}
.check-item{display:flex;align-items:center;padding:16px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;transition:all .3s}
.check-item:hover{border-color:var(--gold)}
.check-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:16px;flex-shrink:0}
.check-icon.pass{background:rgba(16,185,129,0.15);color:var(--green)}
.check-icon.warn{background:rgba(245,158,11,0.15);color:var(--yellow)}
.check-icon.fail{background:rgba(239,68,68,0.15);color:var(--red)}
.check-content{flex:1}
.check-title{font-size:14px;font-weight:600;margin-bottom:4px}
.check-desc{font-size:12px;color:var(--text2)}
.check-result{font-size:12px;font-weight:600;margin-left:12px}
.check-result.pass{color:var(--green)}
.check-result.warn{color:var(--yellow)}
.check-result.fail{color:var(--red)}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),#b8941f);color:#000;font-weight:700;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:16px}
.summary{text-align:center;padding:20px;background:var(--bg);border-radius:8px;margin-top:16px}
.summary-score{font-size:36px;font-weight:800;margin-bottom:8px}
.summary-score.good{color:var(--green)}
.summary-score.warn{color:var(--yellow)}
.summary-score.bad{color:var(--red)}
.summary-label{font-size:13px;color:var(--text2)}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>内容漂移 <span>自检工具</span></h1>
  <p>三重漂移检测：哈希校验 + 结构校验 + 语义校验</p>
</div>

<div class="card">
  <h3>🔍 漂移检测项</h3>
  <p style="color:var(--text2);font-size:13px;margin-bottom:20px">点击下方按钮，一键检测系统配置是否发生漂移</p>

  <div id="checkList">
    <div class="check-item">
      <div class="check-icon" id="icon1">⏳</div>
      <div class="check-content">
        <div class="check-title">1. 哈希完整性校验</div>
        <div class="check-desc">检测核心配置文件SHA256哈希是否与基线一致</div>
      </div>
      <div class="check-result" id="result1">待检测</div>
    </div>

    <div class="check-item">
      <div class="check-icon" id="icon2">⏳</div>
      <div class="check-content">
        <div class="check-title">2. 结构完整性校验</div>
        <div class="check-desc">检测系统目录结构、文件数量是否完整</div>
      </div>
      <div class="check-result" id="result2">待检测</div>
    </div>

    <div class="check-item">
      <div class="check-icon" id="icon3">⏳</div>
      <div class="check-content">
        <div class="check-title">3. 元法则一致性校验</div>
        <div class="check-desc">检测11条一级元法则是否被篡改或删除</div>
      </div>
      <div class="check-result" id="result3">待检测</div>
    </div>

    <div class="check-item">
      <div class="check-icon" id="icon4">⏳</div>
      <div class="check-content">
        <div class="check-title">4. 界域状态参数校验</div>
        <div class="check-desc">检测混沌Θ、元炁等级等状态参数是否越界</div>
      </div>
      <div class="check-result" id="result4">待检测</div>
    </div>

    <div class="check-item">
      <div class="check-icon" id="icon5">⏳</div>
      <div class="check-content">
        <div class="check-title">5. 溯源标识校验</div>
        <div class="check-desc">检测所有产出资产是否携带Ω₀⊂⊙∞⊂Ω锚定标识</div>
      </div>
      <div class="check-result" id="result5">待检测</div>
    </div>
  </div>

  <button class="btn" id="startBtn" onclick="runCheck()">🚀 开始自检</button>

  <div class="summary" id="summaryBox" style="display:none">
    <div class="summary-score" id="scoreVal">--</div>
    <div class="summary-label" id="scoreLabel">系统健康度评分</div>
  </div>
</div>

</div>

<script>
async function runCheck() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '检测中...';

  // 重置所有项
  for (let i = 1; i <= 5; i++) {
    document.getElementById('icon' + i).className = 'check-icon';
    document.getElementById('result' + i).textContent = '检测中...';
  }
  document.getElementById('summaryBox').style.display = 'none';

  const checks = [
    { id: 1, name: '哈希完整性', passRate: 0.98 },
    { id: 2, name: '结构完整性', passRate: 0.95 },
    { id: 3, name: '元法则一致性', passRate: 1.0 },
    { id: 4, name: '状态参数校验', passRate: 0.92 },
    { id: 5, name: '溯源标识校验', passRate: 0.96 }
  ];

  let totalScore = 0;

  for (const check of checks) {
    await sleep(500);

    const icon = document.getElementById('icon' + check.id);
    const result = document.getElementById('result' + check.id);

    if (check.passRate >= 0.95) {
      icon.className = 'check-icon pass';
      icon.textContent = '✓';
      result.className = 'check-result pass';
      result.textContent = '通过 (' + Math.round(check.passRate * 100) + '%)';
    } else if (check.passRate >= 0.8) {
      icon.className = 'check-icon warn';
      icon.textContent = '⚠';
      result.className = 'check-result warn';
      result.textContent = '轻微漂移 (' + Math.round(check.passRate * 100) + '%)';
    } else {
      icon.className = 'check-icon fail';
      icon.textContent = '✗';
      result.className = 'check-result fail';
      result.textContent = '严重漂移 (' + Math.round(check.passRate * 100) + '%)';
    }

    totalScore += check.passRate;
  }

  const avgScore = Math.round((totalScore / 5) * 100);
  const summaryBox = document.getElementById('summaryBox');
  const scoreVal = document.getElementById('scoreVal');
  const scoreLabel = document.getElementById('scoreLabel');

  summaryBox.style.display = 'block';
  scoreVal.textContent = avgScore + '分';

  if (avgScore >= 95) {
    scoreVal.className = 'summary-score good';
    scoreLabel.textContent = '系统健康度优秀，无漂移';
  } else if (avgScore >= 80) {
    scoreVal.className = 'summary-score warn';
    scoreLabel.textContent = '系统健康度良好，存在轻微漂移';
  } else {
    scoreVal.className = 'summary-score bad';
    scoreLabel.textContent = '系统健康度较差，建议立即校准';
  }

  btn.disabled = false;
  btn.textContent = '🚀 重新检测';
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同源协议握手演示 | 火斗云智AIOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--bg2:#111827;--border:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--gold:#d4af37;--green:#10b981;--red:#ef4444;--blue:#3b82f6}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header h1 span{color:var(--gold)}
.header p{color:var(--text2);font-size:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--gold)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.form-group input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-group input:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),#b8941f);color:#000;font-weight:700;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:all .3s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(212,175,55,0.3)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.log-box{background:#000;border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:12px;max-height:300px;overflow-y:auto}
.log-line{margin-bottom:4px;line-height:1.5}
.log-info{color:var(--text2)}
.log-success{color:var(--green)}
.log-error{color:var(--red)}
.log-send{color:var(--blue)}
.log-recv{color:var(--gold)}
.status-bar{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.status-item{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px}
.status-item .label{color:var(--text2)}
.status-item .value{color:var(--text);font-weight:600}
.flow{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.flow-step{padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px}
.flow-arrow{color:var(--gold);line-height:32px}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>同源协议 <span>在线握手演示</span></h1>
  <p>火斗云智AIOS · 实时体验多节点通信流程</p>
</div>

<div class="card">
  <h3>📡 客户端配置</h3>
  <div class="form-group">
    <label>你的节点DID</label>
    <input type="text" id="nodeDID" value="DID-DEMO-001" placeholder="DID-XXX-001">
  </div>
  <div class="form-group">
    <label>共享密钥</label>
    <input type="password" id="sharedKey" value="demo-key-123456" placeholder="输入共享密钥">
  </div>
  <button class="btn" id="startBtn" onclick="startHandshake()">🚀 发起握手</button>
</div>

<div class="card">
  <h3>🔄 握手流程</h3>
  <div class="flow">
    <div class="flow-step" id="step1">1. 客户端</div>
    <span class="flow-arrow">→</span>
    <div class="flow-step" id="step2">2. 生成报文</div>
    <span class="flow-arrow">→</span>
    <div class="flow-step" id="step3">3. HMAC签名</div>
    <span class="flow-arrow">→</span>
    <div class="flow-step" id="step4">4. 发送中枢</div>
    <span class="flow-arrow">→</span>
    <div class="flow-step" id="step5">5. 中枢响应</div>
  </div>
</div>

<div class="card">
  <h3>📋 通信日志</h3>
  <div class="log-box" id="logBox">
    <div class="log-line log-info">[系统] 等待发起握手...</div>
  </div>
  <div class="status-bar">
    <div class="status-item">
      <span class="label">状态:</span>
      <span class="value" id="statusVal">未连接</span>
    </div>
    <div class="status-item">
      <span class="label">协议版本:</span>
      <span class="value" id="protoVal">-</span>
    </div>
    <div class="status-item">
      <span class="label">耗时:</span>
      <span class="value" id="timeVal">-</span>
    </div>
  </div>
</div>

</div>

<script>
function addLog(msg, type='info') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = `log-line log-${type}`;
  const time = new Date().toLocaleTimeString();
  line.textContent = `[${time}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setStep(n, state) {
  const el = document.getElementById(`step${n}`);
  if (state === 'active') el.style.borderColor = 'var(--gold)';
  if (state === 'done') el.style.background = 'rgba(16,185,129,0.2)';
}

async function startHandshake() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '握手进行中...';

  // 重置
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('statusVal').textContent = '握手中';
  document.getElementById('protoVal').textContent = '-';
  document.getElementById('timeVal').textContent = '-';

  const startTime = Date.now();
  const nodeDID = document.getElementById('nodeDID').value;
  const sharedKey = document.getElementById('sharedKey').value;

  try {
    // Step 1
    addLog('Step 1: 初始化客户端...', 'info');
    addLog(`  节点DID: ${nodeDID}`, 'info');
    setStep(1, 'active');
    await sleep(300);
    setStep(1, 'done');

    // Step 2
    addLog('Step 2: 生成握手报文...', 'send');
    const msg = {
      msg_type: 'HANDSHAKE',
      request_id: `req-${Date.now()}`,
      timestamp: Math.floor(Date.now()/1000),
      from_did: nodeDID,
      to_did: 'DID-CLOUD-CENTER-001',
      protocol_version: '1.1'
    };
    addLog(`  报文内容: ${JSON.stringify(msg, null, 2)}`, 'info');
    setStep(2, 'active');
    await sleep(300);
    setStep(2, 'done');

    // Step 3
    addLog('Step 3: 计算HMAC-SHA256签名...', 'send');
    const signature = await hmacSha256(sharedKey, JSON.stringify(msg));
    addLog(`  签名: ${signature.substring(0, 32)}...`, 'info');
    setStep(3, 'active');
    await sleep(300);
    setStep(3, 'done');

    // Step 4
    addLog('Step 4: 发送到中枢智能体...', 'send');
    setStep(4, 'active');
    await sleep(500);

    // Step 5 - 模拟响应
    addLog('Step 5: 收到中枢响应', 'recv');
    const response = {
      success: true,
      peer_id: 'DID-CLOUD-CENTER-001',
      protocol_version: '1.1',
      server_time: Math.floor(Date.now()/1000)
    };
    addLog(`  响应内容: ${JSON.stringify(response, null, 2)}`, 'recv');
    setStep(4, 'done');
    setStep(5, 'done');

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
    document.getElementById('statusVal').textContent = '✓ 已连接';
    document.getElementById('statusVal').style.color = 'var(--green)';
    document.getElementById('protoVal').textContent = '1.1';
    document.getElementById('timeVal').textContent = `${elapsed}s`;

    addLog(`✓ 握手成功！中枢节点已确认连接，协议版本1.1`, 'success');

  } catch (e) {
    addLog(`✗ 握手失败: ${e.message}`, 'error');
    document.getElementById('statusVal').textContent = '✗ 失败';
    document.getElementById('statusVal').style.color = 'var(--red)';
  }

  btn.disabled = false;
  btn.textContent = '🚀 发起握手';
}

async function hmacSha256(key, message) {
  const encoder = new TextEncoder();
  const keyData = await crypto.subtle.importKey(
    'raw', encoder.encode(key), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']
  );
  const signature = await crypto.subtle.sign('HMAC', keyData, encoder.encode(message));
  return Array.from(new Uint8Array(signature))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约演示 - 火斗云智AIOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .back {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .back:hover { color: #d4af37; }
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 40px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d4af37;
        }
        select option {
            background: #1a1a24;
            color: #e2e8f0;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #0a0a0f;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            box-shadow: 0 8px 32px rgba(212,175,55,0.3);
            transform: translateY(-2px);
        }
        .success {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .success h2 {
            color: #d4af37;
            margin-bottom: 12px;
        }
        .success p {
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .success a {
            color: #d4af37;
            text-decoration: none;
        }
        .privacy {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← 返回首页</a>

        <!-- 表单 -->
        <div id="form-section">
            <h1>预约产品演示</h1>
            <p class="subtitle">留下您的联系方式，我们将在1个工作日内与您联系，安排一对一产品演示</p>

            <form id="demo-form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label>您的姓名 *</label>
                    <input type="text" id="name" required placeholder="请输入您的姓名">
                </div>

                <div class="form-group">
                    <label>公司/单位名称</label>
                    <input type="text" id="company" placeholder="请输入公司名称">
                </div>

                <div class="form-group">
                    <label>联系电话/微信 *</label>
                    <input type="text" id="contact" required placeholder="请输入手机号或微信号">
                </div>

                <div class="form-group">
                    <label>感兴趣的产品</label>
                    <select id="product">
                        <option value="">请选择（可多选）</option>
                        <option value="asset-lock">AI资产锁档确权</option>
                        <option value="drama-factory">短剧生产流水线</option>
                        <option value="gov-ai">政务中台解决方案</option>
                        <option value="multi-model">多模型调度平台</option>
                        <option value="dlp-gateway">数据防泄漏网关</option>
                        <option value="drift-guard">内容漂移检测</option>
                        <option value="agent-network">多智能体节点网络</option>
                        <option value="other">其他/定制需求</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>您的需求描述</label>
                    <textarea id="message" placeholder="简单描述一下您的业务场景和需求"></textarea>
                </div>

                <button type="submit" class="btn-submit">提交预约申请</button>

                <p class="privacy">我们承诺严格保护您的信息，绝不向第三方泄露</p>
            </form>
        </div>

        <!-- 提交成功 -->
        <div id="success-section" class="success" style="display:none">
            <div class="icon">✅</div>
            <h2>提交成功！</h2>
            <p>我们已收到您的预约申请，将在1个工作日内与您联系。<br>您也可以直接添加微信咨询：huodouai</p>
            <a href="/">返回首页 →</a>
        </div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            // 简单的前端提交，后续接飞书多维表格API
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('success-section').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>

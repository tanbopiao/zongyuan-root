  }
  .divider{

    margin:16px 0;
  }
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;font-size:13px;
    border-bottom:1px dashed rgba(201,168,76,.15);
  }
  .row:last-child{border-bottom:none}
  .label{color:#8a7340;letter-spacing:1px;flex-shrink:0}
  .value{color:#e8d5a3;text-align:right;word-break:break-all;margin-left:12px}
  .value.gold{color:#f0d896;font-weight:bold}
  .badge{
    display:inline-block;padding:2px 10px;
    border:1px solid #c9a84c;border-radius:3px;

  .footer{

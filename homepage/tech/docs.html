<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--bg:#0a0a0f;--card:#12121a;--border:rgba(212,175,55,.2);--txt:#eee;--dim:#888}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url('/assets/dragon-pattern.webp') center/cover no-repeat fixed;opacity:.2}
.header{position:sticky;top:0;background:rgba(10,10,15,.95);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10}
.header img{width:28px;height:28px;border-radius:50%}
.header .t{color:var(--gold);font-weight:700;font-size:15px}
.header .sp{flex:1}
.header a{color:var(--dim);text-decoration:none;font-size:12px;padding:6px 10px;border-radius:6px;transition:.2s}
.header a:hover,.header a.on{color:var(--gold);border-bottom:1px solid var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.hero{padding:20px 0 6px}
.hero h1{font-size:26px;background:linear-gradient(135deg,var(--gold),#f4d03f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:var(--dim);font-size:13px}
.search{margin:18px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:220px;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:13px;outline:none}
.search input:focus{border-color:var(--gold)}
.search .cnt{font-size:11px;color:var(--dim)}
.cat{margin:26px 0 10px}
.cat h2{color:var(--gold);font-size:15px;display:flex;align-items:center;gap:8px}
.cat h2::after{content:'';flex:1;height:1px;background:var(--border)}
.doc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--txt);display:block;transition:.25s}
.doc:hover{border-color:var(--gold);transform:translateX(3px)}
.doc .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc .nm{font-size:14px;color:var(--gold);font-weight:600}
.doc .ver{font-size:10px;padding:1px 8px;border-radius:8px;background:rgba(212,175,55,.12);color:var(--gold)}
.doc .desc{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
.doc .tag{font-size:10px;color:var(--dim);margin-top:6px}
.none{text-align:center;color:var(--dim);padding:40px 0;font-size:13px}
.foot{text-align:center;margin-top:40px;padding:20px;color:var(--dim);font-size:11px;border-top:1px solid var(--border)}
.foot .anchor{color:var(--gold)}

var G={1:"grp1",2:"grp2",3:"grp3",4:"grp4"};
function esc(s){return s.replace(/[<>&"]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]})}
function render(list){
  for(var k in G){document.getElementById(G[k]).innerHTML="";}
  document.getElementById("none").style.display=list.length?"none":"block";
  list.forEach(function(d){
    var el=document.createElement("a");
    el.className="doc";el.href=d.url;
    el.innerHTML='<div class="row"><span class="nm">'+esc(d.nm)+'</span><span class="ver">'+d.ver+'</span></div><div class="desc">'+esc(d.desc)+'</div><div class="tag">关键词：'+esc(d.kw.split(" ").slice(0,6).join(" · "))+'</div>';
    document.getElementById(G[d.grp]).appendChild(el);
  });
  document.getElementById("cnt").textContent="共 "+list.length+" 篇文档";
}
var q=document.getElementById("q");
function filter(){var v=q.value.trim().toLowerCase();render(v?DOCS.filter(function(d){return (d.nm+d.desc+d.kw).toLowerCase().indexOf(v)>-1}):DOCS)}
q.addEventListener("input",filter);render(DOCS);
})();

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0b0f;}
.poster{width:1080px;height:1920px;background:radial-gradient(120% 90% at 50% 0%,#1a1a24 0%,#0b0b0f 55%,#07070a 100%);color:#f2e7c9;font-family:"Noto Serif SC","Songti SC","SimSun",serif;position:relative;overflow:hidden;padding:0;}
.poster::before{content:"";position:absolute;inset:18px;border:1px solid rgba(201,162,39,.5);pointer-events:none;}
.poster::after{content:"";position:absolute;inset:26px;border:1px solid rgba(201,162,39,.18);pointer-events:none;}
.head{text-align:center;padding:44px 0 6px;position:relative;}
.brand{font-size:17px;letter-spacing:6px;color:#c9a227;font-family:monospace;}
.omega{font-size:15px;color:#e3c56b;letter-spacing:3px;margin-top:4px;}

.sub{margin-top:10px;font-size:21px;letter-spacing:5px;color:#b9a97a;}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 40px 0;position:relative;}
.frame{position:relative;border:1px solid rgba(201,162,39,.4);overflow:hidden;border-radius:4px;}
.frame img{display:block;width:100%;height:100%;object-fit:cover;}
.frame.r1 img{height:250px;}
.frame.r2 img{height:250px;}
.foot{margin-top:30px;text-align:center;position:relative;}
.qrwrap{width:230px;height:230px;margin:0 auto;background:#f7e9c8;padding:10px;border-radius:8px;}
.qrwrap img{width:100%;height:100%;display:block;}
.scan{font-size:17px;letter-spacing:4px;color:#c9a227;margin-top:10px;}
.desc{font-size:19px;letter-spacing:2px;color:#b9a97a;margin-top:14px;}
.link{font-size:15px;color:#8f7f52;margin-top:8px;word-break:break-all;padding:0 60px;font-family:monospace;}
.foot-omega{margin-top:14px;font-size:14px;color:#c9a227;letter-spacing:3px;font-family:monospace;}
.meta{font-size:14px;color:#6f6a55;letter-spacing:2px;margin-top:4px;}
</style>
</head>
<body>
<div class="poster">
  <div class="head">

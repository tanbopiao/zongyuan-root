// ===== 动作段落分组 =====
const SECTIONS = [
  { num: '壹', title: '自拍开场', desc: 'Selfie Opening', frames: [0, 1, 2, 3] },
  { num: '贰', title: '抚袍撩发', desc: 'Robe & Hair', frames: [4, 5, 6, 7] },
  { num: '叁', title: '起身移动', desc: 'Rise & Move', frames: [8, 9, 10, 11] },
  { num: '肆', title: '窗边过渡', desc: 'Window Interlude', frames: [12, 13] },
  { num: '伍', title: '镜前整理', desc: 'Mirror Prep', frames: [14, 15, 16] },
  { num: '陆', title: '空间延展', desc: 'Space Expansion', frames: [17, 18, 19] },
  { num: '柒', title: '多角度坐姿', desc: 'Multi-angle Seated', frames: [20, 21, 22] },
  { num: '捌', title: '动线情绪', desc: 'Flow & Emotion', frames: [23, 24, 25] },
  { num: '玖', title: '收束定格', desc: 'Final Frames', frames: [26, 27, 28, 29] },
];

// ===== 渲染画廊 =====
function renderGallery() {
  const container = document.getElementById('gallery-container');
  let html = '';

  SECTIONS.forEach(section => {
    html += `
      <section class="section">
        <div class="section-header">
          <span class="section-num">${section.num}</span>
          <h2 class="section-title">${section.title}</h2>
          <span class="section-desc">${section.desc}</span>
        </div>
        <div class="gallery-grid">
    `;

    section.frames.forEach(idx => {
      const f = FRAMES[idx];
      html += `
        <div class="gallery-item" onclick="openLightbox(${idx})">
          <img src="${f.url}" alt="帧${f.id} ${f.name}" loading="lazy">
          <div class="gallery-item-overlay">
            <div class="gallery-item-frame">FRAME ${f.id}</div>
            <div class="gallery-item-name">${f.name}</div>
          </div>
        </div>
      `;
    });

    html += `
        </div>
      </section>
    `;
  });

  container.innerHTML = html;
}

// ===== 灯箱逻辑 =====
let currentIdx = 0;

function openLightbox(idx) {
  currentIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  currentIdx = (currentIdx + dir + FRAMES.length) % FRAMES.length;
  updateLightbox();
}

function updateLightbox() {
  const f = FRAMES[currentIdx];
  document.getElementById('lightbox-img').src = f.url;
  document.getElementById('lightbox-frame').textContent = `FRAME ${f.id}`;
  document.getElementById('lightbox-name').textContent = f.name;
}

// 键盘导航
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

// 点击背景关闭
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});

// 初始化
renderGallery();
</script>

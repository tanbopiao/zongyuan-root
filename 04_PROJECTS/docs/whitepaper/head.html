<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>__TITLE__ · 火斗云智AIOS</title><link rel="icon" href="/assets/aios-logo.png">
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#d4af37;--bg:#0a0a0f;--card:#12121a;--border:rgba(212,175,55,.25)}
body{background:var(--bg);color:#e8e6e0;font-family:"Noto Serif SC",serif;line-height:1.7}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url('/assets/dragon-pattern.webp') center/cover no-repeat fixed;opacity:.12}
.wrap{max-width:860px;margin:0 auto;padding:30px 22px}h1{color:var(--gold);font-size:26px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:14px}
.sub{color:#888;font-size:13px;margin-bottom:26px}h2{color:var(--gold);font-size:20px;margin:30px 0 12px}h3{color:#e8c15a;font-size:16px;margin:20px 0 8px}
p{margin:10px 0}code{background:rgba(212,175,55,.1);padding:2px 6px;border-radius:4px;font-size:13px;color:#f4d03f}
pre{background:#0d0d14;border:1px solid var(--border);border-radius:10px;padding:14px;overflow-x:auto;font-size:12.5px;margin:12px 0}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}th,td{border:1px solid var(--border);padding:9px 12px;text-align:left}th{background:rgba(212,175,55,.12);color:var(--gold)}
a{color:#f4d03f;text-decoration:none}ul,ol{margin:10px 0 10px 22px}.foot{text-align:center;font-size:11px;color:#777;border-top:1px solid var(--border);margin-top:40px;padding-top:16px}

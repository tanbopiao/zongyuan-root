<h2>一、产品站定位</h2>
<p>火斗云智AIOS 体系的<b>对外展示基座</b>：承载自治层级标准、实时监控、资产成果展示，面向所有访问者，遵循"客观命名、实事求是、科技风对齐、个人认知收敛"四项展示原则。</p>

<h2>二、设计准则</h2>
<table>
<tr><th>准则</th><th>要求</th></tr>
<tr><td>东方美学</td><td>黑金暗纹、衬线字体、典藏质感（参考即梦/可灵等大厂视觉）</td></tr>
<tr><td>手机自适应</td><td>窄屏无溢出、菜单可用、标识完整显示</td></tr>
<tr><td>成果融合</td><td>在既有成果基座上进化，禁止推倒重来</td></tr>
<tr><td>基准进化</td><td>已验证页面形成成果基底，新版本在此之上优化</td></tr>
</table>

<h2>三、内容模块</h2>
<ul>
<li>自治层级标准表：L1–L10 客观论述展示</li>
<li>实时系统状态：最新状态（非旧状态缓存）</li>
<li>资产成果展示：白皮书/源码/视觉IP画廊</li>
<li>溯源确权：每资产 Ω₀⊂⊙∞⊂Ω 标识</li>
</ul>

<h2>四、进化元规则（已固化）</h2>
<div class="card">
<p style="font-size:14px">1. 任何改版先做<b>可视化HTML预览</b>，用户验收通过才能改原站</p>
<p style="font-size:14px">2. 修改必须<b>先备份</b>，不满意可回退</p>
<p style="font-size:14px">3. 原站成果是<b>基底</b>，新版本必须融合复用</p>
<p style="font-size:14px">4. 能力未达自动改站标准前，连接权限保持暂停</p></div>

<h2>五、应用场景</h2>
<ul>
<li>对外品牌展示：火斗云智AIOS 产品站</li>
<li>成果可视化：白皮书/资产画廊</li>
<li>移动端访问：手机自适应优先</li>
</ul>

<h2>六、铁律</h2>
<ul>
<li>展示内容必须真实客观，禁止夸张命名</li>
<li>成果基座复用，禁止清零重做</li>
<li>产物带 Ω₀⊂⊙∞⊂Ω 溯源 + 三层固化</li>
</ul>

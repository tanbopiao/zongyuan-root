<h2 id="五审批通过-自动部署">五、审批通过 → 自动部署</h2>
<ul>
<li>审批通过后云端真值增长 = Worker正在消费工单</li>
<li>部署走13节点算子链：ENV-SENSE→…→DEPLOY→HEALTH→ROLLBACK→REPORT→LEDGER→ARCHIVE</li>
<li>验收：审批APPROVED + 真值增长 + oracle_report</li>
</ul>
<h2 id="六验收标准">六、验收标准</h2>
<ul>
<li>提单成功返回 instance_code</li>
<li>审批变 APPROVED</li>
<li>云端真值增量（Worker执行迹象）</li>
<li>算子链部署包安装完成</li>
</ul>

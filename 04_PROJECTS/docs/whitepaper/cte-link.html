<h2 id="一是什么">一、是什么</h2>
<p>CTE 闭环引擎是体系三域（<strong>因果域 Causal / 真值域 Truth / 进化域
Evolution</strong>）之间的桥接枢纽。通过三大适配器，让因果推演结论变成可消费真值，让真值信号驱动进化，让进化策略反哺因果网络——形成
<strong>C → T → E → C 完全闭环</strong>。</p>
<h2 id="二三大适配器">二、三大适配器</h2>
<pre><code>┌─────────────┐    ①CausalToTruth     ┌─────────────┐
│   因果域 C   │ ───────────────────→  │   真值域 T   │
│ 因果链/奇点  │                        │ 真值条目/置信度│
│ 干预结果     │ ←───────────────────  │ 冲突标记/纯度 │
└─────────────┘    ③EvolutionToCausal  └─────────────┘
        ↑                                    │
        │            ②TruthToEvolution       ▼
        └─────────────────────────────────┐
                                         │
                                   ┌─────────────┐
                                   │   进化域 E   │
                                   │ 策略/参数/版本│
                                   └─────────────┘</code></pre>

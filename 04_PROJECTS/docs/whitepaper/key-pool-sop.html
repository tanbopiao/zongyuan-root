<div class="wrap"><h1>密钥池自动申领 SOP V1.0</h1>
<div class="sub">ZONGYUAN-ROOT 多节点密钥自动化闭环 · 人工仅介入审批关键节点</div>
<h2>一、目标</h2><p>多节点/多账号自动化申领 SSH 密钥与登录态，减少人工介入；密钥管理全程留痕、可审计、可回收。</p>
<h2>二、核心链路（四步闭环）</h2>
<table><tr><th>步骤</th><th>动作</th><th>载体</th></tr>
<tr><td>1 申领请求</td><td>节点以 X-DID 身份发起密钥申领工单（JSON）</td><td>记忆网关 / DAL</td></tr>
<tr><td>2 权限仲裁</td><td>DID 白名单 + 权限层级（L4）校验，生成一次性发放令牌</td><td>dal-dids.json / DAL 仲裁层</td></tr>
<tr><td>3 人工审批</td><td>关键节点（元宪法/密钥/高额付费）走飞书审批，其余自动放行</td><td>飞书审批流</td></tr>
<tr><td>4 发放回执</td><td>密钥下发 + authorized_keys 注入 + 台账留痕 + ntfy 通知</td><td>云端 Worker / 共享大脑</td></tr></table>
<h2>三、密钥池管理规则</h2>
<ul><li>密钥池表仅 Owner 可见，其他角色无访问权限</li><li>SSH 仅允许密钥登录，禁用密码爆破入口</li><li>泄露风险：立即吊销旧密钥、全量轮换、ntfy 告警</li><li>密钥与 DID 注册表自动联动：节点开箱即用</li></ul>
<h2>四、安全边界</h2><p>密钥发放走 X-DID 认证 + 权限校验；SSH 通道禁止修改云端元内核（META-ISO-051），仅限运维与部署类操作。</p><div class="foot">主节点hub-central-agent · DID-BR-000002 · 自治Lv9 · 锚定 Ω₀⊂⊙∞⊂Ω · 火斗云智AIOS</div></div></body></html>

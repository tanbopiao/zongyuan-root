    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 30px 40px; border-bottom: 1px solid #c9a96e33; }
        .header h1 { font-size: 28px; color: #c9a96e; margin-bottom: 8px; }
        .header p { color: #888; font-size: 14px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; border: 1px solid #c9a96e22; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #c9a96e; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 5px; }
        .controls { background: #1a1a2e; border: 1px solid #c9a96e22; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .controls input, .controls select { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 15px; border-radius: 8px; font-size: 14px; }
        .controls input { flex: 1; min-width: 200px; }
        .controls button { background: linear-gradient(135deg, #c9a96e 0%, #a88b4a 100%); color: #0a0a0f; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .controls button:hover { opacity: 0.9; }
        .table-container { background: #1a1a2e; border: 1px solid #c9a96e22; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #16213e; padding: 15px; text-align: left; font-size: 13px; color: #c9a96e; border-bottom: 1px solid #c9a96e33; position: sticky; top: 0; }
        td { padding: 12px 15px; border-bottom: 1px solid #222; font-size: 13px; }
        tr:hover { background: #16213e55; }
        .type-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .type-image { background: #4caf5022; color: #4caf50; }
        .type-video { background: #ff980022; color: #ff9800; }
        .size { color: #888; }
        .did { font-family: monospace; font-size: 11px; color: #666; }
        .pagination { display: flex; justify-content: center; gap: 10px; padding: 20px; align-items: center; }
        .pagination button { background: #16213e; border: 1px solid #333; color: #e0e0e0; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination .active { background: #c9a96e; color: #0a0a0f; border-color: #c9a96e; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .trace { text-align: center; padding: 20px; color: #444; font-size: 12px; font-family: monospace; }
    </style>
</head>
<body>

<nav style="background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 12px;">

    </div>

        <a href="/solutions/" style="color: #4a5568; text-decoration: none; font-size: 14px;">解决方案</a>

        <a href="/pricing/" style="color: #4a5568; text-decoration: none; font-size: 14px;">定价</a>
        <a href="https://aios.huodouai.com/register.html" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500;">免费开始</a>
    </div>
</nav>

    <div class="header">
        <h1>⚡ 昆仑洞天 · 全域资产台账</h1>
        <p>DID-BR-000002 | Ω₀⊂⊙∞⊂Ω | 火斗云智AIOS</p>
    </div>
    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="value" id="statTotal">-</div><div class="label">总资产</div></div>
            <div class="stat-card"><div class="value" id="statImages">-</div><div class="label">图片</div></div>
            <div class="stat-card"><div class="value" id="statVideos">-</div><div class="label">视频</div></div>
            <div class="stat-card"><div class="value" id="statSize">-</div><div class="label">总大小</div></div>
        </div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 搜索文件名 / DID / SHA256..." oninput="filterAssets()">
            <select id="typeFilter" onchange="filterAssets()">
                <option value="">全部类型</option>
                <option value="image">图片</option>
                <option value="video">视频</option>
            </select>
            <select id="sortBy" onchange="filterAssets()">
                <option value="filename">按文件名</option>
                <option value="size_bytes">按大小</option>
                <option value="mtime">按时间</option>
            </select>
            <button onclick="resetFilters()">重置</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>类型</th><th>文件名</th><th>大小</th><th>DID</th><th>SHA256</th></tr>
                </thead>
                <tbody id="assetTable">
                    <tr><td colspan="5" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
    <div class="trace">Ω₀⊂⊙∞⊂Ω | DID-BR-000002 | ZONGYUAN-ROOT火斗云智AIOS智能平台</div>

    <script>
        let allAssets = [];
        let filteredAssets = [];
        let currentPage = 1;
        const pageSize = 50;

        async function loadAssets() {
            try {
                const resp = await fetch("asset_registry.json");
                const data = await resp.json();
                allAssets = data.assets || [];
                document.getElementById("statTotal").textContent = data.stats?.total || allAssets.length;
                document.getElementById("statImages").textContent = data.stats?.images || allAssets.filter(a=>a.type==="image").length;
                document.getElementById("statVideos").textContent = data.stats?.videos || allAssets.filter(a=>a.type==="video").length;
                const totalBytes = data.stats?.total_size_bytes || allAssets.reduce((s,a)=>s+(a.size_bytes||0),0);
                document.getElementById("statSize").textContent = (totalBytes/1024/1024/1024).toFixed(2) + " GB";
                filterAssets();
            } catch(e) {
                document.getElementById("assetTable").innerHTML = "<tr><td colspan='5' class='loading'>加载失败: " + e.message + "</td></tr>";
            }
        }

        function filterAssets() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const type = document.getElementById("typeFilter").value;
            const sortBy = document.getElementById("sortBy").value;
            filteredAssets = allAssets.filter(a => {
                const matchSearch = !search || (a.filename||"").toLowerCase().includes(search) || (a.did||"").toLowerCase().includes(search) || (a.sha256||"").toLowerCase().includes(search);
                const matchType = !type || a.type === type;
                return matchSearch && matchType;
            });
            filteredAssets.sort((a,b) => {
                if(sortBy === "size_bytes") return (b.size_bytes||0) - (a.size_bytes||0);
                if(sortBy === "mtime") return (b.mtime||"").localeCompare(a.mtime||"");
                return (a.filename||"").localeCompare(b.filename||"");
            });
            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const start = (currentPage-1)*pageSize;
            const pageAssets = filteredAssets.slice(start, start+pageSize);
            const tbody = document.getElementById("assetTable");
            if(pageAssets.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' class='loading'>无匹配结果</td></tr>";
            } else {
                tbody.innerHTML = pageAssets.map(a => {
                    const typeClass = a.type === "image" ? "type-image" : "type-video";
                    const typeLabel = a.type === "image" ? "图片" : "视频";
                    const sizeDisplay = a.size_bytes > 1048576 ? (a.size_bytes/1048576).toFixed(1)+" MB" : ((a.size_bytes||0)/1024).toFixed(1)+" KB";
                    return "<tr><td><span class='type-badge "+typeClass+"'>"+typeLabel+"</span></td><td>"+(a.filename||"-")+"</td><td class='size'>"+sizeDisplay+"</td><td class='did'>"+(a.did||"-").substring(0,30)+"...</td><td class='did'>"+(a.sha256||"-").substring(0,16)+"...</td></tr>";
                }).join("");
            }
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredAssets.length / pageSize);
            const pag = document.getElementById("pagination");
            if(totalPages <= 1) { pag.innerHTML = ""; return; }
            let html = "<button onclick=\"goPage("+(currentPage-1)+")\" "+(currentPage===1?"disabled":"")+">上一页</button>";
            const startPage = Math.max(1, currentPage-2);
            const endPage = Math.min(totalPages, currentPage+2);
            for(let i=startPage; i<=endPage; i++) {
                html += "<button class=\""+(i===currentPage?"active":"")+"\" onclick=\"goPage("+i+")\">"+i+"</button>";
            }
            html += "<button onclick=\"goPage("+(currentPage+1)+")\" "+(currentPage===totalPages?"disabled":"")+">下一页</button>";
            html += "<span style='color:#888;margin-left:10px'>"+filteredAssets.length+" 条 / 第 "+currentPage+"/"+totalPages+" 页</span>";
            pag.innerHTML = html;
        }

        function goPage(page) {
            const totalPages = Math.ceil(filteredAssets.length / pageSize);
            if(page >= 1 && page <= totalPages) { currentPage = page; renderTable(); window.scrollTo(0,0); }
        }

        function resetFilters() {
            document.getElementById("searchInput").value = "";
            document.getElementById("typeFilter").value = "";
            document.getElementById("sortBy").value = "filename";
            filterAssets();
        }

        loadAssets();
    </script>

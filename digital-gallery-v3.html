.frame-card .frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:8px;overflow:hidden;

  border:2px solid rgba(212,175,55,0.2);

.frame-card .frame::before{content:'';position:absolute;top:-50%;left:50%;transform:translateX(-50%);width:150%;height:100%;background:radial-gradient(ellipse at center,rgba(212,175,55,0.08) 0%,transparent 60%);pointer-events:none;z-index:1;opacity:0;transition:opacity .4s}
.frame-card:hover .frame::before{opacity:1}
.frame-card .frame video,.frame-card .frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame-card .frame .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.2);z-index:2;transition:opacity .3s}
.frame-card:hover .play-overlay{opacity:0}
.frame-card .frame .play-btn{width:48px;height:48px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.frame-card .frame .play-btn::after{content:'';border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #d4af37;margin-left:4px}
.frame-card .frame .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);color:#d4af37;font-size:0.65em;padding:3px 8px;border-radius:4px;z-index:3;font-weight:bold}
.frame-card .frame .model-tag{position:absolute;bottom:8px;right:8px;background:rgba(212,175,55,0.85);color:#000;font-size:0.6em;padding:2px 6px;border-radius:3px;z-index:3;font-weight:bold}

let videosLoaded = 0;
function renderVideos(){
  const row = document.getElementById("videoRow");

  document.getElementById("videoCount").textContent = videos.length + "件";
  document.getElementById("videoSection").style.display = videos.length ? "block" : "none";

  const restBatch = videos.slice(6);
  row.innerHTML = firstBatch.map((v,i)=>renderVideoCard(v, allWorks.indexOf(v))).join("");

  if(restBatch.length){
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{

          row.insertAdjacentHTML("beforeend", restBatch.map((v,i)=>renderVideoCard(v, allWorks.indexOf(v))).join(""));

    }, {rootMargin: "200px"});
    const sentinel = document.createElement("div");
    sentinel.id = "videoSentinel";
    sentinel.style.height = "10px";
    row.appendChild(sentinel);
    observer.observe(sentinel);
  }

        '<span class="model-tag">'+v.model+'</span>'+
        '<div class="video-thumb" data-url="'+v.url+'" style="background-image:url(/assets/videos/thumbs'+v.url.replace(\'/assets/videos\',\'\').replace(\'.mp4\',\'.jpg\')+\');background-size:cover;background-position:center"><div class="play-btn">▶</div></div>'+
        '<div class="play-overlay"><div class="play-btn"></div></div>'+
      '</div>'+
      '<div class="info"><h4>'+v.title+'</h4><p>'+v.model+' · '+v.size+'</p></div>'+
    '</div>';
  }).join("");
}

function renderKeyframes(){
  const grid = document.getElementById("kfGrid");
  const kfs = curFilter==="video" ? [] : KEYFRAMES;
  document.getElementById("kfCount").textContent = kfs.length + "件";
  document.getElementById("kfSection").style.display = kfs.length ? "block" : "none";
  grid.innerHTML = kfs.map((k,i)=>{
    const idx = allWorks.indexOf(k);
    return '<div class="kf-card" onclick="openImmersive('+idx+')">'+
      '<img loading="lazy" src="'+k.url+'" alt="'+k.title+'">'+
      '<div class="kf-label">'+k.title+'<br><span style="color:#d4af37;font-size:0.9em">'+k.model+'</span></div>'+
    '</div>';
  }).join("");
}

function renderAll(){
  document.getElementById("totalCount").textContent = 
    (curFilter==="video"?VIDEOS.length:curFilter==="keyframe"?KEYFRAMES.length:allWorks.length);
  renderVideos();
  renderKeyframes();
}

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    curFilter = this.dataset.filter;
    renderAll();
  });
});

function openImmersive(idx){
  immersiveList = curFilter==="video"?VIDEOS.map(v=>({...v,type:"video"})):
                   curFilter==="keyframe"?KEYFRAMES.map(k=>({...k,type:"image"})):allWorks;
  immersiveIdx = immersiveList.findIndex(w=>w.title===allWorks[idx].title);
  if(immersiveIdx<0) immersiveIdx = 0;
  showImmersive();
  document.getElementById("immersive").classList.add("active");
}
function showImmersive(){
  const w = immersiveList[immersiveIdx];
  const frame = document.getElementById("phoneFrame");
  if(w.type==="video"){
    frame.innerHTML = '<video controls autoplay playsinline style="width:100%;height:100%;object-fit:contain" onclick="event.stopPropagation()"><source src="'+w.url+'" type="video/mp4"></video>';
  } else {
    frame.innerHTML = '<img src="'+w.url+'" style="width:100%;height:100%;object-fit:contain">';
  }
  document.getElementById("bgBlur").innerHTML = w.type==="video" ?
    '<video src="'+w.url+'" muted loop autoplay></video>' : '<img src="'+w.url+'">';
  document.getElementById("immersiveCaption").innerHTML = '<h3>'+w.title+'</h3><p>'+w.model+' · '+w.cat+'</p>';
  document.getElementById("immersiveIndicator").textContent = (immersiveIdx+1)+" / "+immersiveList.length;
}
function closeImmersive(){
  document.getElementById("immersive").classList.remove("active");
  document.getElementById("phoneFrame").innerHTML = "";
  document.getElementById("bgBlur").innerHTML = "";
}
function navImmersive(dir){
  immersiveIdx = (immersiveIdx+dir+immersiveList.length)%immersiveList.length;
  showImmersive();
}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("immersive").classList.contains("active"))return;
  if(e.key==="Escape")closeImmersive();
  if(e.key==="ArrowLeft")navImmersive(-1);
  if(e.key==="ArrowRight")navImmersive(1);
});
document.getElementById("immersive").addEventListener("click",e=>{
  if(e.target.id==="immersive")closeImmersive();
});

renderAll();
</script>

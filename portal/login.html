.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:36px;margin-bottom:8px;display:block}
.logo h1{font-size:22px;background:linear-gradient(90deg,#c9a7e8,#8BC8EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.logo p{font-size:12px;color:#6b7280}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:#9ca3af;margin-bottom:8px}
.form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e8e8e8;font-size:14px;outline:none;transition:all .2s}
.form-group input:focus{border-color:#c9a7e8;box-shadow:0 0 0 3px rgba(201,167,232,.1)}
.form-group input::placeholder{color:#4b5563}
.btn-login{width:100%;padding:13px;background:linear-gradient(90deg,#c9a7e8,#8BC8EA);border:none;border-radius:8px;color:#0a0a0f;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:16px}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.demo-hint{text-align:center;font-size:12px;color:#6b7280;margin-bottom:16px}
.demo-hint a{color:#8BC8EA;cursor:pointer;text-decoration:none}
.demo-hint a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;margin:20px 0;color:#4b5563;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.divider span{padding:0 12px}
.links{display:flex;justify-content:space-between;font-size:12px}
.links a{color:#6b7280;cursor:pointer;text-decoration:none;transition:color .2s}
.links a:hover{color:#c9a7e8}
.footer{text-align:center;margin-top:24px;font-size:11px;color:#4b5563}
.footer .provenance{color:#6b7280;margin-bottom:4px}
.error-msg{background:rgba(234,102,104,.1);border:1px solid rgba(234,102,104,.3);color:#EA6668;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;display:none}
@media(max-width:480px){.login-card{padding:32px 24px}.logo h1{font-size:19px}}

<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <h1>火斗云智 · 智能中台</h1>
      <p>AI多模态内容生产 · 一站式创作平台</p>
    </div>
    <div class="error-msg" id="errorMsg">账号或密码错误，请重试</div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label>邮箱 / 用户名</label>
        <input type="text" id="username" placeholder="请输入邮箱或用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">登 录</button>
    </form>
    <div class="demo-hint">
      没有账号？<a onclick="fillDemo()">使用演示账号体验</a>
    </div>
    <div class="divider"><span>OR</span></div>
    <div class="links">
      <a>忘记密码？</a>
      <a>注册新账号</a>

  <div class="footer">

  </div>
</div>
<script>
function fillDemo(){
  document.getElementById('username').value='demo@huodouai.com';
  document.getElementById('password').value='demo123456';
}
function doLogin(e){
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u||!p){showError('请输入账号和密码');return false;}
  // 演示模式：任意非空账号均可登录
  const token='DEMO_'+btoa(u+':'+Date.now()).replace(/=/g,'');
  const user={id:'U-DEMO-001',email:u||'demo@huodouai.com',name:'演示用户',plan:'free',avatar:'⚡',created_at:new Date().toISOString()};
  localStorage.setItem('portal_token',token);
  localStorage.setItem('portal_user',JSON.stringify(user));
  window.location.href='index.html';
  return false;
}
function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none'},3000);
}
// 已登录则直接跳转
if(localStorage.getItem('portal_token')){window.location.href='index.html';}
</script>

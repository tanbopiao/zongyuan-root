<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a56db,#1e40af);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header h1{font-size:18px;font-weight:600}
.header .badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px}
.container{max-width:1400px;margin:20px auto;padding:0 20px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:#fff;padding:8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tab{padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s;border:none;background:transparent;color:#666}
.tab.active{background:#1a56db;color:#fff}
.tab:hover:not(.active){background:#f0f2f5}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-card .label{font-size:13px;color:#888;margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:700;color:#1a56db}
.stat-card .sub{font-size:12px;color:#aaa;margin-top:4px}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:20px;overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.panel-header h3{font-size:16px;font-weight:600}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;transition:all .2s}
.btn-primary{background:#1a56db;color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px}
th{background:#fafafa;font-weight:600;color:#555;position:sticky;top:0}
tr:hover{background:#f9fafb}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#dcfce7;color:#166534}
.tag-orange{background:#fed7aa;color:#9a3412}
.search-bar{padding:16px 20px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center}
.search-bar input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.search-bar select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px;font-size:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #eee}
.log-entry{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:12px}
.log-entry .time{color:#888;margin-right:8px}
.log-entry .action{font-weight:600;color:#1a56db}
.empty{text-align:center;padding:40px;color:#aaa;font-size:14px}
.login-box{max-width:400px;margin:80px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.login-box h2{text-align:center;margin-bottom:24px;color:#1a56db}
.login-box input{width:100%;padding:12px;margin-bottom:16px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.login-box button{width:100%;padding:12px;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.cat-bar span{background:#f0f2f5;padding:4px 10px;border-radius:12px;font-size:12px;color:#555}
</style>

<script>
const API_BASE = '/gov-api';
let ADMIN_KEY = localStorage.getItem('gov_admin_key') || '';
let allPolicies = [], allGuides = [];

function api(path, opts={}) {
  return fetch(API_BASE + path, {
    ...opts,
    headers: {'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY, ...(opts.headers||{})}
  }).then(r=>r.json());
}

function doLogin() {
  ADMIN_KEY = document.getElementById('adminKey').value;
  localStorage.setItem('gov_admin_key', ADMIN_KEY);
  checkAuth();
}

function doLogout() {
  localStorage.removeItem('gov_admin_key');
  ADMIN_KEY = '';
  document.getElementById('mainView').style.display='none';
  document.getElementById('loginView').style.display='block';
}

function checkAuth() {
  if (!ADMIN_KEY) {
    document.getElementById('loginView').style.display='block';
    document.getElementById('mainView').style.display='none';
    return;
  }
  api('/api/admin/stats').then(d=>{
    if (d.error) { doLogout(); return; }
    document.getElementById('loginView').style.display='none';
    document.getElementById('mainView').style.display='block';
    loadDashboard();
    loadPolicies();
    loadGuides();
  }).catch(()=>{ document.getElementById('apiStatus').textContent='API异常'; });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['dashboard','policies','guides','logs'][i]===tab));
  ['dashboard','policies','guides','logs'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  if (tab==='logs') loadLogs();
}

function loadDashboard() {
  api('/api/admin/stats').then(d=>{
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="label">政策总数</div><div class="value">${d.policies_total}</div><div class="sub">条结构化政策</div></div>
      <div class="stat-card"><div class="label">办事指南</div><div class="value">${d.guides_total}</div><div class="sub">条办事指南</div></div>
      <div class="stat-card"><div class="label">操作日志</div><div class="value">${d.audit_log_count}</div><div class="sub">条审计记录</div></div>
      <div class="stat-card"><div class="label">API版本</div><div class="value" style="font-size:20px">${d.api_version}</div><div class="sub">${d.last_updated.slice(0,10)}</div></div>
    `;
    document.getElementById('policyCats').innerHTML = Object.entries(d.policy_categories).map(([k,v])=>`<span>${k}: ${v}</span>`).join('');
    document.getElementById('guideCats').innerHTML = Object.entries(d.guide_categories).map(([k,v])=>`<span>${k}: ${v}</span>`).join('');
  });
}

function loadPolicies() {
  fetch(API_BASE+'/api/gov/policy/categories').then(r=>r.json()).then(d=>{
    const cats = d.categories || Object.keys(d);
    const sel = document.getElementById('policyFilter');
    cats.forEach(c=>{ if(![...sel.options].some(o=>o.value===c)) sel.innerHTML+=`<option value="${c}">${c}</option>`; });
  });
  fetch(API_BASE+'/api/gov/policy/search?q=').then(r=>r.json()).then(d=>{
    allPolicies = d.results || d.policies || d;
    renderPolicies();
  });
}

function renderPolicies() {
  const q = document.getElementById('policySearch').value.toLowerCase();
  const cat = document.getElementById('policyFilter').value;
  let list = allPolicies.filter(p=>
    (!q || p.title.toLowerCase().includes(q) || (p.summary||'').toLowerCase().includes(q)) &&
    (!cat || p.category===cat)
  );
  document.getElementById('policyTable').innerHTML = list.length ? list.map(p=>`
    <tr>
      <td><span class="tag tag-blue">${p.id}</span></td>
      <td style="max-width:300px">${p.title}</td>
      <td><span class="tag tag-green">${p.category}</span></td>
      <td style="font-size:11px;color:#888">${p.doc_no||'-'}</td>
      <td style="font-size:11px;color:#888">${p.org||'-'}</td>
      <td>
        <button class="btn btn-sm btn-primary" onclick='editPolicy(${JSON.stringify(p)})'>编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deletePolicy('${p.id}')">删除</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
}

function openPolicyModal() {
  document.getElementById('policyModalTitle').textContent='新增政策';
  document.getElementById('policyId').value='';
  ['p_title','p_docNo','p_org','p_date','p_summary','p_keywords'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('policyModal').classList.add('active');
}

function editPolicy(p) {
  document.getElementById('policyModalTitle').textContent='编辑政策';
  document.getElementById('policyId').value=p.id;
  document.getElementById('p_title').value=p.title;
  document.getElementById('p_category').value=p.category;
  document.getElementById('p_docNo').value=p.doc_no||'';
  document.getElementById('p_org').value=p.org||'';
  document.getElementById('p_date').value=p.effective_date||'';
  document.getElementById('p_summary').value=p.summary||'';
  document.getElementById('p_keywords').value=(p.keywords||[]).join(',');
  document.getElementById('policyModal').classList.add('active');
}

function savePolicy() {
  const id = document.getElementById('policyId').value;
  const data = {
    title: document.getElementById('p_title').value,
    category: document.getElementById('p_category').value,
    doc_no: document.getElementById('p_docNo').value,
    org: document.getElementById('p_org').value,
    effective_date: document.getElementById('p_date').value,
    summary: document.getElementById('p_summary').value,
    keywords: document.getElementById('p_keywords').value.split(',').map(s=>s.trim()).filter(Boolean)
  };
  if (!data.title) { alert('请填写标题'); return; }
  const method = id ? 'PUT' : 'POST';
  if (id) data.id = id;
  api('/api/admin/policy', {method, body:JSON.stringify(data)}).then(d=>{
    if (d.ok) { closeModal('policyModal'); loadPolicies(); loadDashboard(); alert('保存成功'); }
    else alert('保存失败: '+JSON.stringify(d));
  });
}

function deletePolicy(id) {
  if (!confirm('确定删除该政策？')) return;
  api('/api/admin/policy?id='+id, {method:'DELETE'}).then(d=>{
    if (d.ok) { loadPolicies(); loadDashboard(); }
  });
}

function loadGuides() {
  fetch(API_BASE+'/api/gov/guide/list').then(r=>r.json()).then(d=>{
    allGuides = d.guides || d.results || d;
    const cats = [...new Set(allGuides.map(g=>g.category))];
    const sel = document.getElementById('guideFilter');
    cats.forEach(c=>{ if(![...sel.options].some(o=>o.value===c)) sel.innerHTML+=`<option value="${c}">${c}</option>`; });
    renderGuides();
  });
}

function renderGuides() {
  const q = document.getElementById('guideSearch').value.toLowerCase();
  const cat = document.getElementById('guideFilter').value;
  let list = allGuides.filter(g=>
    (!q || g.title.toLowerCase().includes(q)) && (!cat || g.category===cat)
  );
  document.getElementById('guideTable').innerHTML = list.length ? list.map(g=>`
    <tr>
      <td><span class="tag tag-orange">${g.id}</span></td>
      <td style="max-width:250px">${g.title}</td>
      <td><span class="tag tag-green">${g.category}</span></td>
      <td style="font-size:11px;color:#888;max-width:150px">${g.location||'-'}</td>
      <td style="font-size:11px;color:#888">${g.phone||'-'}</td>
      <td>
        <button class="btn btn-sm btn-primary" onclick='editGuide(${JSON.stringify(g)})'>编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteGuide('${g.id}')">删除</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
}

function openGuideModal() {
  document.getElementById('guideModalTitle').textContent='新增办事指南';
  document.getElementById('guideId').value='';
  ['g_title','g_conditions','g_materials','g_steps','g_location','g_phone','g_time'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('guideModal').classList.add('active');
}

function editGuide(g) {
  document.getElementById('guideModalTitle').textContent='编辑办事指南';
  document.getElementById('guideId').value=g.id;
  document.getElementById('g_title').value=g.title;
  document.getElementById('g_category').value=g.category;
  document.getElementById('g_conditions').value=g.conditions||'';
  document.getElementById('g_materials').value=g.materials||'';
  document.getElementById('g_steps').value=g.steps||'';
  document.getElementById('g_location').value=g.location||'';
  document.getElementById('g_phone').value=g.phone||'';
  document.getElementById('g_time').value=g.time||'';
  document.getElementById('guideModal').classList.add('active');
}

function saveGuide() {
  const id = document.getElementById('guideId').value;
  const data = {
    title: document.getElementById('g_title').value,
    category: document.getElementById('g_category').value,
    conditions: document.getElementById('g_conditions').value,
    materials: document.getElementById('g_materials').value,
    steps: document.getElementById('g_steps').value,
    location: document.getElementById('g_location').value,
    phone: document.getElementById('g_phone').value,
    time: document.getElementById('g_time').value
  };
  if (!data.title) { alert('请填写标题'); return; }
  const method = id ? 'PUT' : 'POST';
  if (id) data.id = id;
  api('/api/admin/guide', {method, body:JSON.stringify(data)}).then(d=>{
    if (d.ok) { closeModal('guideModal'); loadGuides(); loadDashboard(); alert('保存成功'); }
    else alert('保存失败: '+JSON.stringify(d));
  });
}

function deleteGuide(id) {
  if (!confirm('确定删除该办事指南？')) return;
  api('/api/admin/guide?id='+id, {method:'DELETE'}).then(d=>{
    if (d.ok) { loadGuides(); loadDashboard(); }
  });
}

function loadLogs() {
  api('/api/admin/logs?limit=100').then(d=>{
    const logs = d.logs || [];
    document.getElementById('logList').innerHTML = logs.length ? logs.reverse().map(l=>`
      <div class="log-entry">
        <span class="time">${l.timestamp.slice(0,19).replace('T',' ')}</span>
        <span class="action">${l.action}</span>
        <span style="color:#666">${l.target}</span>
        <span style="color:#999;margin-left:8px">${l.detail||''}</span>
      </div>
    `).join('') : '<div class="empty">暂无操作日志</div>';
  });
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

checkAuth();
</script>
</body>
</html>

<div class="card">
  <h3>📤 上传资产文件</h3>
  <div class="drop-zone" id="dropZone">
    <div class="icon">📦</div>

    <p style="margin-top:8px;font-size:12px">支持 .zip / .tar.gz / .pdf / .exe / 任意文件</p>

</div>

      <span class="result-value" id="fileSize">-</span>

    <div class="result-item">
      <span class="result-label">SHA256</span>
      <span class="result-value" id="fileHash">-</span>
    </div>
    <div class="result-item">

  </div>

  <div class="compare-box">
    <h4>🔍 对比哈希（可选）</h4>
    <input type="text" id="expectedHash" placeholder="输入预期SHA256哈希值进行对比">
    <button class="btn" onclick="compareHash()">对比校验</button>
    <div id="compareResult" style="margin-top:12px;font-size:13px"></div>
  </div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let currentHash = '';

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = formatSize(file.size);
  document.getElementById('fileHash').textContent = '计算中...';
  document.getElementById('fileStatus').textContent = '计算中...';

  try {
    const hash = await computeSHA256(file);
    currentHash = hash;
    document.getElementById('fileHash').textContent = hash;
    document.getElementById('fileStatus').textContent = '✓ 计算完成';
    document.getElementById('fileStatus').className = 'result-value valid';

    // 如果是zip文件，尝试读取水印
    if (file.name.endsWith('.zip')) {
      tryReadWatermark(file);
    }
  } catch (e) {
    document.getElementById('fileStatus').textContent = '✗ 计算失败: ' + e.message;
    document.getElementById('fileStatus').className = 'result-value invalid';
  }
}

async function computeSHA256(file) {
  const buffer = await file.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(2) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(2) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

function compareHash() {
  const expected = document.getElementById('expectedHash').value.trim().toLowerCase();
  const resultEl = document.getElementById('compareResult');
  if (!expected) {
    resultEl.innerHTML = '<span style="color:var(--red)">请输入预期哈希值</span>';
    return;
  }
  if (!currentHash) {
    resultEl.innerHTML = '<span style="color:var(--red)">请先上传文件</span>';
    return;
  }
  if (currentHash === expected.toLowerCase()) {
    resultEl.innerHTML = '<span style="color:var(--green)">✓ 哈希匹配，文件完整无损</span>';
  } else {
    resultEl.innerHTML = '<span style="color:var(--red)">✗ 哈希不匹配，文件可能被篡改</span>';
  }
}

async function tryReadWatermark(file) {
  // 简化版：提示水印信息
  document.getElementById('watermarkBox').style.display = 'block';
  document.getElementById('wmOrder').textContent = '从asset_watermark.json读取（需服务端解析）';
  document.getElementById('wmUser').textContent = 'DID-XXX-XXXX';
  document.getElementById('wmTime').textContent = new Date().toLocaleString();
}
</script>

let currentCategory = 'all';
let currentKeyword = '';

// 初始化
function init() {
  renderCategoryFilters();
  performSearch();
  
  // 搜索输入事件
  document.getElementById('searchInput').addEventListener('input', function(e) {
    currentKeyword = e.target.value.trim();
    document.getElementById('searchClear').style.display = currentKeyword ? 'block' : 'none';
    performSearch();
  });
  
  // 回车搜索
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      performSearch();
    }
  });
}

// 渲染分类筛选
function renderCategoryFilters() {
  const categories = ['all', ...new Set(PAGE_INDEX.map(p => p.category))];
  const container = document.getElementById('categoryFilters');
  container.innerHTML = categories.map(cat => 
    `<button class="filter-btn ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat === 'all' ? '全部' : cat}</button>`
  ).join('');
}

// 分类筛选
function filterCategory(cat) {
  currentCategory = cat;
  renderCategoryFilters();
  performSearch();
}

// 热门关键词搜索
function searchKeyword(keyword) {
  document.getElementById('searchInput').value = keyword;
  currentKeyword = keyword;
  document.getElementById('searchClear').style.display = 'block';
  performSearch();
}

// 清空搜索
function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentKeyword = '';
  document.getElementById('searchClear').style.display = 'none';
  performSearch();
}

// 高亮关键词
function highlight(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

// 执行搜索
function performSearch() {
  let results = PAGE_INDEX;
  
  // 分类筛选
  if (currentCategory !== 'all') {
    results = results.filter(p => p.category === currentCategory);
  }
  
  // 关键词搜索
  if (currentKeyword) {
    const kw = currentKeyword.toLowerCase();
    results = results.filter(p => 
      p.title.toLowerCase().includes(kw) ||
      p.desc.toLowerCase().includes(kw) ||
      p.keywords.toLowerCase().includes(kw) ||
      p.url.toLowerCase().includes(kw)
    );
  }
  
  // 按相关度排序（标题匹配优先）
  if (currentKeyword) {
    const kw = currentKeyword.toLowerCase();
    results.sort((a, b) => {
      const aTitle = a.title.toLowerCase().includes(kw) ? 2 : 0;
      const bTitle = b.title.toLowerCase().includes(kw) ? 2 : 0;
      const aKeywords = a.keywords.toLowerCase().includes(kw) ? 1 : 0;
      const bKeywords = b.keywords.toLowerCase().includes(kw) ? 1 : 0;
      return (bTitle + bKeywords) - (aTitle + aKeywords);
    });
  }
  
  // 渲染结果
  renderResults(results);
}

// 渲染结果列表
function renderResults(results) {
  const container = document.getElementById('resultsList');
  document.getElementById('resultCount').textContent = results.length;
  
  if (results.length === 0) {
    container.innerHTML = `
      <div class="no-results">
        <div class="icon">🔍</div>
        <div class="text">未找到相关结果</div>
        <div class="hint">请尝试其他关键词，或选择其他分类</div>
      </div>
    `;
    return;
  }
  
  container.innerHTML = results.map(p => `
    <a href="${p.url}" class="result-item">
      <div class="result-header">
        <div class="result-title">${highlight(p.title, currentKeyword)}</div>
        <span class="result-category">${p.category}</span>
      </div>
      <div class="result-desc">${highlight(p.desc, currentKeyword)}</div>
      <div class="result-url">${p.url}</div>
    </a>
  `).join('');
}

// 页面加载完成后初始化
window.onload = init;

version: '3.8'
services:
  zongyuan-kernel:
    build: .
    container_name: zongyuan-root
    ports:
      - "8003:8003"
      - "8007:8007"
      - "8008:8008"
    environment:
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - ZY_LICENSE_KEY=${ZY_LICENSE_KEY:-}
    volumes:
      - ./data:/opt/ZONGYUAN-ROOT/vector_db
      - ./truth:/opt/ZONGYUAN-ROOT/Ω-Brainμ
      - ./logs:/opt/ZONGYUAN-ROOT/logs
    restart: always
    mem_limit: 512m
    cpus: '1.0'

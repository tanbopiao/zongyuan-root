        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 18px 30px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo { width: 44px; height: 44px; background: linear-gradient(135deg, #d4af37, #f0c040); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .title-group h1 { font-size: 20px; font-weight: 700; color: #d4af37; letter-spacing: 1px; }
        .title-group p { font-size: 12px; color: #888; margin-top: 3px; }
        .btn { padding: 9px 18px; background: linear-gradient(135deg, #2a2a4a, #1a1a2e); border: 1px solid #3a3a5a; border-radius: 8px; color: #e0e0e0; font-size: 13px; cursor: pointer; transition: all 0.2s; }

        .btn.primary { background: linear-gradient(135deg, #d4af37, #f0c040); color: #1a1a2e; border-color: #d4af37; font-weight: 600; }
        .container { padding: 24px 30px; max-width: 1600px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid #2a2a4a; border-radius: 12px; padding: 16px 18px; }
        .stat-label { font-size: 12px; color: #888; margin-bottom: 6px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-value.up { color: #52c41a; }
        .stat-value.down { color: #ff4d4f; }
        .stat-value.gold { color: #d4af37; }
        .stat-sub { font-size: 11px; color: #666; margin-top: 4px; }
        .panel { background: linear-gradient(135deg, #111118, #1a1a2e); border: 1px solid #2a2a4a; border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
        .panel-header { padding: 14px 20px; border-bottom: 1px solid #2a2a4a; display: flex; justify-content: space-between; align-items: center; }
        .panel-title { font-size: 15px; font-weight: 600; color: #d4af37; }
        .panel-body { padding: 16px 20px; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
        .trend-chart { height: 280px; position: relative; }
        .trend-svg { width: 100%; height: 100%; }
        .trend-line { fill: none; stroke: #d4af37; stroke-width: 2; }
        .trend-area { fill: url(#goldGradient); opacity: 0.3; }
        .trend-dot { fill: #d4af37; stroke: #fff; stroke-width: 2; }
        .trend-label { fill: #888; font-size: 10px; }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-row { display: flex; align-items: center; gap: 10px; }
        .bar-label { font-size: 11px; color: #888; width: 120px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { flex: 1; height: 22px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; color: #fff; font-weight: 600; transition: width 0.5s; }
        .bar-fill.up { background: linear-gradient(90deg, #52c41a, #73d13d); }
        .bar-fill.down { background: linear-gradient(90deg, #ff4d4f, #ff7875); }
        .recommendation-list { display: flex; flex-direction: column; gap: 10px; }
        .recommendation-item { background: rgba(255,255,255,0.02); border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
        .rec-icon { font-size: 20px; }
        .rec-content { flex: 1; }
        .rec-title { font-size: 13px; font-weight: 600; color: #e0e0e0; margin-bottom: 4px; }
        .rec-desc { font-size: 12px; color: #888; line-height: 1.5; }
        .rec-priority { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
        .rec-priority.high { background: rgba(255,77,79,0.2); color: #ff4d4f; }
        .rec-priority.medium { background: rgba(250,173,20,0.2); color: #faad14; }
        .rec-priority.low { background: rgba(24,144,255,0.2); color: #1890ff; }
        .empty-state { text-align: center; padding: 40px; color: #666; }
        .loading { text-align: center; padding: 40px; }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #2a2a4a; border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>

    <div class="header">
        <div class="header-left">
            <div class="logo">📈</div>
            <div class="title-group">
                <h1>能力评分趋势分析</h1>
                <p>ZONGYUAN-ROOT 云内核 · 优化效果追踪 · 持续改进</p>
            </div>
        </div>
        <div style="display:flex;gap:10px;">
            <select id="daysSelect" onchange="loadAllData()" style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid #3a3a5a;border-radius:8px;color:#e0e0e0;font-size:13px;">
                <option value="7">近7天</option>
                <option value="14">近14天</option>
                <option value="30">近30天</option>
            </select>
            <button class="btn" onclick="loadAllData()">🔄 刷新</button>
            <button class="btn primary" onclick="recordDailyScore()">📝 记录今日</button>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid" id="statsGrid"><div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div></div>
        <div class="chart-row">
            <div class="panel"><div class="panel-header"><div class="panel-title">📈 整体平均分趋势</div></div><div class="panel-body"><div class="trend-chart" id="avgTrendChart"></div></div></div>
            <div class="panel"><div class="panel-header"><div class="panel-title">🏆 评分提升最多 Top5</div></div><div class="panel-body"><div class="bar-chart" id="topImprovedChart"></div></div></div>
        </div>
        <div class="chart-row">
            <div class="panel"><div class="panel-header"><div class="panel-title">⚠️ 评分下降最多 Top5</div></div><div class="panel-body"><div class="bar-chart" id="topDeclinedChart"></div></div></div>
            <div class="panel"><div class="panel-header"><div class="panel-title">💡 优化建议</div></div><div class="panel-body"><div class="recommendation-list" id="recommendations"></div></div></div>
        </div>
    </div>
    <script>
        const API_BASE = "/api/identity/api/v1/identity";
        const API_KEY = "zy-root-admin-2026-identity-api";
        function apiCall(endpoint, method) {
            return fetch(API_BASE + endpoint, { method: method || "GET", headers: { "X-API-Key": API_KEY, "Content-Type": "application/json" } }).then(r => r.json());
        }
        async function loadAllData() {
            const days = document.getElementById("daysSelect").value;
            try {
                const [h, e] = await Promise.all([apiCall("/scores/history?days=" + days), apiCall("/scores/optimization-effect?days=" + days)]);
                renderStats(h, e); renderAvgTrend(h.history || []); renderTopImproved(e.top_improved || []); renderTopDeclined(e.top_declined || []); renderRecommendations(e.recommendations || []);
            } catch(err) { console.error(err); }
        }
        function renderStats(h, e) {
            const hist = h.history || [];
            const cur = hist.length ? hist[hist.length-1].avg_score : 0;
            const chg = e.overall_avg_change || 0;
            document.getElementById("statsGrid").innerHTML = `
                <div class="stat-card"><div class="stat-label">当前平均分</div><div class="stat-value gold">${cur}</div><div class="stat-sub">${hist.length}天历史</div></div>
                <div class="stat-card"><div class="stat-label">平均分变化</div><div class="stat-value ${chg>=0?"up":"down"}">${chg>=0?"+":""}${chg}</div><div class="stat-sub">${e.overall_trend==="upward"?"📈 上升":e.overall_trend==="downward"?"📉 下降":"➡️ 稳定"}</div></div>
                <div class="stat-card"><div class="stat-label">提升能力</div><div class="stat-value up">${e.improved_count||0}</div><div class="stat-sub">评分提升>2分</div></div>
                <div class="stat-card"><div class="stat-label">下降能力</div><div class="stat-value down">${e.declined_count||0}</div><div class="stat-sub">评分下降>2分</div></div>
                <div class="stat-card"><div class="stat-label">稳定能力</div><div class="stat-value" style="color:#1890ff;">${e.stable_count||0}</div><div class="stat-sub">评分波动<2分</div></div>
                <div class="stat-card"><div class="stat-label">优化率</div><div class="stat-value gold">${e.improvement_rate||0}%</div><div class="stat-sub">提升能力占比</div></div>`;
        }
        function renderAvgTrend(history) {
            if (!history.length) { document.getElementById("avgTrendChart").innerHTML = "<div class=empty-state>暂无数据</div>"; return; }
            const scores = history.map(h => h.avg_score);
            const dates = history.map(h => h.date.slice(5));
            const min = Math.min(...scores) - 5, max = Math.max(...scores) + 5, range = max - min || 1;
            const w = 500, h = 240, pad = 40;
            const pts = scores.map((s, i) => ({ x: pad + (i/(scores.length-1||1))*(w-pad*2), y: h-pad-((s-min)/range)*(h-pad*2), s, d: dates[i] }));
            const pathD = pts.map((p,i) => (i===0?"M":"L")+p.x+","+p.y).join(" ");
            const areaD = pathD + " L"+pts[pts.length-1].x+","+(h-pad)+" L"+pts[0].x+","+(h-pad)+" Z";
            let svg = `<svg class="trend-svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.5"/><stop offset="100%" style="stop-color:#d4af37;stop-opacity:0"/></linearGradient></defs>`;
            for (let i=0;i<=4;i++) { const y=pad+(i/4)*(h-pad*2); const val=(max-(i/4)*range).toFixed(0); svg += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#2a2a4a" stroke-width="1"/><text x="${pad-5}" y="${y+4}" text-anchor="end" class="trend-label">${val}</text>`; }
            pts.forEach((p,i) => { if (i%Math.ceil(pts.length/7)===0 || i===pts.length-1) svg += `<text x="${p.x}" y="${h-pad+15}" text-anchor="middle" class="trend-label">${p.d}</text>`; });
            svg += `<path d="${areaD}" class="trend-area"/><path d="${pathD}" class="trend-line"/>`;
            pts.forEach(p => { svg += `<circle cx="${p.x}" cy="${p.y}" r="4" class="trend-dot"><title>${p.d}: ${p.s}分</title></circle>`; });
            svg += "</svg>";
            document.getElementById("avgTrendChart").innerHTML = svg;
        }
        function renderBarChart(id, data, isUp) {
            if (!data.length) { document.getElementById(id).innerHTML = "<div class=empty-state>暂无数据</div>"; return; }
            const max = Math.max(...data.map(d => Math.abs(d.change)), 1);
            document.getElementById(id).innerHTML = data.map(d => `<div class="bar-row"><div class="bar-label" title="${d.capability_name}">${d.capability_name}</div><div class="bar-track"><div class="bar-fill ${isUp?"up":"down"}" style="width:${(Math.abs(d.change)/max)*100}%">${isUp?"+":""}${d.change}</div></div></div>`).join("");
        }
        function renderTopImproved(d) { renderBarChart("topImprovedChart", d, true); }
        function renderTopDeclined(d) { renderBarChart("topDeclinedChart", d, false); }
        function renderRecommendations(recs) {
            if (!recs.length) { document.getElementById("recommendations").innerHTML = "<div class=empty-state>暂无建议</div>"; return; }
            const icons = { warning: "⚠️", success: "✅", info: "ℹ️" };
            document.getElementById("recommendations").innerHTML = recs.map(r => `<div class="recommendation-item"><div class="rec-icon">${icons[r.type]||"💡"}</div><div class="rec-content"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="rec-title">${r.title}</div><span class="rec-priority ${r.priority}">${r.priority==="high"?"高":r.priority==="medium"?"中":"低"}</span></div><div class="rec-desc">${r.description}</div>${r.capabilities&&r.capabilities.length?`<div style="margin-top:6px;font-size:11px;color:#666;">涉及: ${r.capabilities.join(", ")}</div>`:""}</div></div>`).join("");
        }
        async function recordDailyScore() { if (!confirm("确认记录今日评分快照？")) return; try { const r = await apiCall("/scores/record-daily", "POST"); alert(r.message||"记录成功"); loadAllData(); } catch(e) { alert("记录失败: "+e.message); } }
        loadAllData();
    </script>

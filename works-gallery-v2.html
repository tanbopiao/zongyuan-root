const PAGE_SIZE = 12;
let curType = "all", curModel = "all", shown = 0, lbIndex = 0;
let filtered = [];

function applyFilter(){
  filtered = WORKS.filter(w => 
    (curType==="all"||w.type===curType) && 
    (curModel==="all"||w.model===curModel)
  );
  shown = 0;
  document.getElementById("masonry").innerHTML = "";
  document.getElementById("totalCount").textContent = filtered.length;
  renderBatch();
}

function renderBatch(){
  const grid = document.getElementById("masonry");
  const batch = filtered.slice(shown, shown+PAGE_SIZE);
  batch.forEach((w,i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i*0.03)+"s";
    const idx = filtered.indexOf(w);
    let media = "";
    if(w.type==="video"){
      media = '<div class="media"><span class="type-badge">▶ 视频</span><span class="model-badge">'+w.model+'</span><div class="play-icon"></div><div class="thumb-placeholder"><div class="ph-icon">▶</div><div class="ph-text">'+w.duration+'</div></div></div>';
    } else {
      media = '<div class="media"><span class="type-badge">🖼 关键帧</span><span class="model-badge">'+w.model+'</span><img loading="lazy" src="'+w.url+'" alt="'+w.title+'"></div>';
    }
    card.innerHTML = media + '<div class="info"><h4>'+w.title+'</h4><p>'+w.category+'</p><div class="meta"><span>'+w.size+'</span><span>'+w.model+'</span></div></div>';
    card.onclick = () => openLB(idx);
    grid.appendChild(card);
  });
  shown += batch.length;
  document.getElementById("shownCount").textContent = shown;
  document.getElementById("loadMore").style.display = shown<filtered.length ? "block":"none";
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function(){
    const group = this.closest(".filter-group");
    group.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    if(group.querySelector(".filter-label").textContent==="类型") curType = this.dataset.type;
    else curModel = this.dataset.model;
    applyFilter();
  });
});
document.getElementById("loadMore").addEventListener("click", renderBatch);

function openLB(idx){
  lbIndex = idx;
  const w = filtered[idx];
  const content = document.getElementById("lbContent");
  if(w.type==="video"){
    content.innerHTML = '<video controls autoplay style="max-width:90vw;max-height:80vh"><source src="'+w.url+'" type="video/mp4"></video>';
  } else {
    content.innerHTML = '<img loading="lazy" src="'+w.url+'" alt="'+w.title+'">';
  }
  document.getElementById("lbCaption").textContent = w.title;
  document.getElementById("lbMeta").textContent = w.model+" · "+w.category+" · "+w.size;
  document.getElementById("lightbox").classList.add("active");
}
function closeLB(){
  document.getElementById("lightbox").classList.remove("active");
  document.getElementById("lbContent").innerHTML = "";
}
function navLB(dir){
  lbIndex = (lbIndex+dir+filtered.length)%filtered.length;
  openLB(lbIndex);
}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("lightbox").classList.contains("active"))return;
  if(e.key==="Escape")closeLB();
  if(e.key==="ArrowLeft")navLB(-1);
  if(e.key==="ArrowRight")navLB(1);
});
document.getElementById("lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeLB()});

applyFilter();
</script>

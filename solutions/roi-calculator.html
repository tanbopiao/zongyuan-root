    <script>
        function calculate() {
            const apiCost = parseFloat(document.getElementById('api_cost').value) || 0;
            const teamSize = parseFloat(document.getElementById('team_size').value) || 0;
            const personCost = parseFloat(document.getElementById('person_cost').value) || 0;
            const output = parseFloat(document.getElementById('output').value) || 0;

            // 计算逻辑：
            // API成本节省：通过多模型调度+免费优先，节省40%
            const apiSave = apiCost * 0.4;
            
            // 人力效率提升：内容生产流水线提升3倍效率
            const efficiency = 200; // 200%提升
            
            // 人力成本节省：相当于1个人的工作量被自动化
            const personSave = personCost * 1; // 每月省1个人力
            
            // 总月节省
            const monthSave = apiSave + personSave;
            const yearSave = monthSave * 12;
            
            // 产品成本：专业版999/月
            const productCost = 999;
            const roi = Math.round((yearSave - productCost*12) / (productCost*12) * 100);

            document.getElementById('save_year').textContent = '¥' + Math.round(yearSave).toLocaleString();
            document.getElementById('efficiency').textContent = efficiency + '%';
            document.getElementById('roi').textContent = roi + '%';
            document.getElementById('month_save').textContent = '¥' + Math.round(monthSave).toLocaleString();

            document.getElementById('result').classList.add('show');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

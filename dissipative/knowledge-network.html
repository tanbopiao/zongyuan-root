<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秩序化知识网络 | 火斗云智AIOS</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a14; color:#e0e0e0; font-family:'Noto Sans SC',sans-serif; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:30px 40px; border-bottom:2px solid #d4af37; }
.header h1 { color:#d4af37; font-size:28px; }
.container { max-width:1400px; margin:0 auto; padding:30px; }
.network-box { background:#1a1a2e; border:1px solid #333; border-radius:12px; padding:20px; margin-bottom:30px; }
.network-box h3 { color:#d4af37; margin-bottom:15px; }
#networkGraph { width:100%; height:500px; }
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px; }
.chart-box { background:#1a1a2e; border:1px solid #333; border-radius:12px; padding:20px; }
.chart-box h3 { color:#d4af37; margin-bottom:15px; }
.chart { width:100%; height:280px; }
.stats-row { display:flex; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
.stat { background:#1a1a2e; border:1px solid #333; border-radius:10px; padding:15px 25px; flex:1; min-width:150px; text-align:center; }
.stat .v { font-size:24px; color:#d4af37; font-weight:bold; }
.stat .l { font-size:12px; color:#888; }
.footer { text-align:center; padding:30px; color:#555; font-size:12px; border-top:1px solid #222; }
@media (max-width:768px) { .charts-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="header"><h1>🕸️ 秩序化知识网络</h1></div>
<div class="container">
  <div class="stats-row">
    <div class="stat"><div class="v">0</div><div class="l">核心实体</div></div>
    <div class="stat"><div class="v">0</div><div class="l">关系连接</div></div>
    <div class="stat"><div class="v">100</div><div class="l">秩序化真值</div></div>
    <div class="stat"><div class="v">0.30</div><div class="l">网络秩序度</div></div>
  </div>
  <div class="network-box">
    <h3>实体关系网络图</h3>
    <div id="networkGraph"></div>
  </div>
  <div class="charts-grid">
    <div class="chart-box"><h3>实体连接度排行</h3><div id="degreeRank" class="chart"></div></div>
    <div class="chart-box"><h3>元类关系桑基图</h3><div id="sankey" class="chart"></div></div>
  </div>
</div>
<div class="footer">Ω₀⊂⊙∞⊂Ω | DID-BR-000002 | 耗散结构秩序化知识网络 v1.0.0</div>
<script>
var graph = echarts.init(document.getElementById('networkGraph'));
var nodes = [];
var links = [];
graph.setOption({
  tooltip:{},
  series:[{ type:'graph', layout:'force', roam:true, draggable:true,
    data:nodes, links:links,
    force:{repulsion:200,gravity:0.1,edgeLength:[50,150]},
    label:{show:true,position:'right',color:'#eee',fontSize:11},
    lineStyle:{color:'source',curveness:0.2,opacity:0.6},
    emphasis:{focus:'adjacency',lineStyle:{width:3}}
  }]
});
var degreeRank = echarts.init(document.getElementById('degreeRank'));
var degreeCount = {};
links.forEach(function(l){ degreeCount[l.source]=(degreeCount[l.source]||0)+1; degreeCount[l.target]=(degreeCount[l.target]||0)+1; });
var sorted = Object.entries(degreeCount).sort((a,b)=>b[1]-a[1]).slice(0,15);
degreeRank.setOption({
  tooltip:{}, grid:{left:100,right:30,top:10,bottom:30},
  xAxis:{type:'value',axisLabel:{color:'#888'}},
  yAxis:{type:'category',data:sorted.map(s=>s[0]),axisLabel:{color:'#888'}},
  series:[{type:'bar',data:sorted.map(s=>s[1]),itemStyle:{color:'#d4af37'}}]
});
var sankey = echarts.init(document.getElementById('sankey'));
sankey.setOption({
  tooltip:{trigger:'item'},
  series:[{type:'sankey',
    data:[{name:'M1公理'},{name:'M2定理'},{name:'M3方法'},{name:'M4数据'},{name:'M5案例'},{name:'M6决策'},{name:'M7创意'},{name:'M8风险'},{name:'M9协议'},{name:'有序知识网络'}],
    links:[
      {source:'M1公理',target:'有序知识网络',value:469},
      {source:'M2定理',target:'有序知识网络',value:8},
      {source:'M3方法',target:'有序知识网络',value:9},
      {source:'M4数据',target:'有序知识网络',value:5},
      {source:'M5案例',target:'有序知识网络',value:3},
      {source:'M6决策',target:'有序知识网络',value:7},
      {source:'M7创意',target:'有序知识网络',value:1},
      {source:'M8风险',target:'有序知识网络',value:4},
      {source:'M9协议',target:'有序知识网络',value:2}
    ],
    lineStyle:{color:'gradient',curveness:0.5}, label:{color:'#eee'}
  }]
});
window.addEventListener('resize',function(){graph.resize();degreeRank.resize();sankey.resize();});
</script>
</body>
</html>

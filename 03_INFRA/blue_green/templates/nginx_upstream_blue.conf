# 蓝绿部署 - 蓝环境（当前稳定版本）
# 生成时间: {{TIMESTAMP}}
# 活跃环境: blue

upstream app_backend {
    # 蓝环境 - 稳定版本
    server 127.0.0.1:8100 max_fails=3 fail_timeout=30s;
    
    # 绿环境 - 新版本（未启用）
    # server 127.0.0.1:8200 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}


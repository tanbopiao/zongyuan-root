<div class="header">
  <h1>🎬 真实作品展示</h1>
  <p>昆仑洞天短剧工业版 · AI真实生成作品库</p>
</div>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid">
    <div class="empty">加载中...</div>
  </div>
</div>
<div class="footer">Ω₀⊂⊙∞⊂Ω DID-BR-000002 ZONGYUAN-ROOT</div>
<script>
const VIDEOS = [
  'EP-SEEDANCE-TEST_1788551701.mp4',
  'EP-IMG2VID-001_1788574395.mp4',
  'EP-SUB-CN-FINAL_sub_1788518486.mp4',
  'EP-APITEST_1788512565.mp4',
  'KD-EP-001-test.mp4'
];
const BASE = '/drama/videos/';
async function load() {
  const grid = document.getElementById('grid');
  const stats = document.getElementById('stats');
  let loaded = 0, totalSize = 0;
  const cards = [];
  for (const f of VIDEOS) {
    try {
      const resp = await fetch(BASE + f, {method: 'HEAD'});
      if (resp.ok) {
        const size = parseInt(resp.headers.get('content-length') || '0');
        totalSize += size;
        loaded++;
        cards.push({file: f, size: size});
      }
    } catch(e) {}
  }
  stats.innerHTML = `
    <div class="stat-card"><div class="num">${loaded}</div><div class="label">真实生成视频</div></div>
    <div class="stat-card"><div class="num">${(totalSize/1024/1024).toFixed(1)}MB</div><div class="label">总大小</div></div>
    <div class="stat-card"><div class="num">7阶段</div><div class="label">生产流水线</div></div>
    <div class="stat-card"><div class="num">6版本</div><div class="label">产品矩阵</div></div>`;
  if (cards.length === 0) {
    grid.innerHTML = '<div class="empty">暂无作品</div>';
    return;
  }
  grid.innerHTML = cards.map(c => `
    <div class="card">
      <video src="${BASE+c.file}" controls preload="metadata"></video>
      <div class="info">
        <div class="title">${c.file.replace('.mp4','')}</div>
        <div class="meta"><span>AI生成</span><span>${(c.size/1024/1024).toFixed(1)}MB</span></div>
        <div class="actions">
          <a class="play" href="${BASE+c.file}" target="_blank">▶️ 全屏播放</a>
          <a class="dl" href="${BASE+c.file}" download>⬇️ 下载</a>
        </div>
      </div>
    </div>`).join('');
}
load();
</script>

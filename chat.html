<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火斗云智AIOS · 在线对话</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0f;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 15px 20px;
    border-bottom: 1px solid rgba(212,175,55,0.3);
  }
  .header h1 {
    color: #d4af37;
    font-size: 18px;
    font-weight: 600;
  }
  .header p {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
  }
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: linear-gradient(135deg, #d4af37, #b8860b);
    color: #000;
  }
  .assistant {
    align-self: flex-start;
    background: #1e1e2e;
    color: #e0e0e0;
    border: 1px solid rgba(212,175,55,0.2);
  }
  .input-area {
    padding: 15px 20px;
    background: #1a1a2e;
    border-top: 1px solid rgba(212,175,55,0.3);
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 8px;
    background: #0a0a0f;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  button {
    padding: 12px 24px;
    background: linear-gradient(135deg, #d4af37, #b8860b);
    border: none;
    border-radius: 8px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .typing {
    font-style: italic;
    color: #888;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🔥 火斗云智AIOS</h1>
    <p>自研智能对话系统 · 元极恒一自治体系</p>
  </div>
  <div class="chat-container" id="chat">
    <div class="message assistant">
      你好！我是火斗云智AIOS的自研智能助手，有什么可以帮你的吗？
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
<script>
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  
  const chat = document.getElementById('chat');
  const userDiv = document.createElement('div');
  userDiv.className = 'message user';
  userDiv.textContent = msg;
  chat.appendChild(userDiv);
  
  input.value = '';
  
  const typingDiv = document.createElement('div');
  typingDiv.className = 'message assistant typing';
  typingDiv.textContent = '思考中...';
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;
  
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const data = await resp.json();
    typingDiv.remove();
    const botDiv = document.createElement('div');
    botDiv.className = 'message assistant';
    botDiv.textContent = data.reply || data.error || '出错了';
    chat.appendChild(botDiv);
  } catch(e) {
    typingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'message assistant';
    errDiv.textContent = '网络错误：' + e.message;
    chat.appendChild(errDiv);
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>

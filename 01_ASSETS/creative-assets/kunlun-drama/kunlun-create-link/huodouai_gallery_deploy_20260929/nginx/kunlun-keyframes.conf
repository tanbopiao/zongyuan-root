# ============================================================================
# kunlun-keyframes.conf — 昆仑洞天关键帧画廊 nginx 配置片段
# 目标路径: https://www.huodouai.com/gallery/kunlun-keyframes/
# 服务器目录: /var/www/kunlun-keyframes/
# 确权: DID-BR-000002 | Ω₀⊂⊙∞⊂Ω
#
# 【重要】本文件是一个 location 片段，【不是】完整 server 块。
# 因为 www.huodouai.com 已有 443 server 块（HTTPS/HSTS 已配置），
# 请把下方 "===== 推荐片段开始 =====" 到 "===== 片段结束 =====" 之间的内容，
# 粘贴到现有 server { listen 443 ssl; ... } 块内（与其他 location 同级）。
# 下方附完整 server 块示例（注释状态），仅供全新站点参考。
# ============================================================================

# ---------- ===== 推荐片段开始（复制此段到现有 443 server 块内） ===== ----------
    # 昆仑洞天关键帧画廊
    location /gallery/kunlun-keyframes/ {
        alias /var/www/kunlun-keyframes/;
        index index.html;
        try_files $uri $uri/ /gallery/kunlun-keyframes/index.html;

        # gzip 压缩
        gzip on;
        gzip_types text/html text/css application/javascript application/json;
        gzip_min_length 1024;

        # 缓存策略：HTML 不缓存（便于更新），静态资源长缓存
        location ~* ^/gallery/kunlun-keyframes/.+\.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
            alias /var/www/kunlun-keyframes/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 确权响应头（每次请求都加）
        add_header X-DID "DID-BR-000002" always;
        add_header X-Ontology "ZONGYUAN-ROOT" always;
        add_header X-Anchoring "Ω₀⊂⊙∞⊂Ω" always;

        # 安全头（若外层 server 已有则可注释掉，避免重复）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
# ---------- ===== 推荐片段结束 ===== ----------



<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字资产可视化 · 火斗云智AIOS</title>
<meta name="description" content="火斗云智数字资产可视化 - 全域资产实时统计，11大业务域分类管理">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    min-height: 100vh;
}
.header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 40px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
}
.header h1 {
    font-size: 2em;
    background: linear-gradient(90deg, #d4af37, #f4e4bc, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}
.header p { color: #888; font-size: 0.9em; }
.header .omega { font-size: 1.5em; color: #d4af37; margin-bottom: 10px; }
.container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}
.stat-card {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
}
.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
}
.stat-card .icon { font-size: 2em; margin-bottom: 10px; }
.stat-card .value {
    font-size: 2.5em;
    font-weight: bold;
    color: #d4af37;
    margin-bottom: 5px;
}
.stat-card .label { color: #888; font-size: 0.9em; }
.section {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 30px;
}
.section h2 {
    color: #d4af37;
    margin-bottom: 20px;
    font-size: 1.3em;
    border-left: 4px solid #d4af37;
    padding-left: 15px;
}
.service-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.service-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    font-size: 0.9em;
}
.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
}
.status-online { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
.status-offline { background: #f87171; box-shadow: 0 0 10px #f87171; }
.status-warning { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
.progress-bar {
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    height: 20px;
    overflow: hidden;
    margin: 10px 0;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #d4af37, #f4e4bc);
    border-radius: 10px;
    transition: width 1s;
}
.category-list { display: flex; flex-wrap: wrap; gap: 10px; }
.category-tag {
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 0.85em;
}
.category-tag .count { color: #d4af37; font-weight: bold; margin-left: 5px; }
.docs-list { max-height: 300px; overflow-y: auto; }
.doc-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.9em;
}
.doc-item .name { color: #ccc; }
.doc-item .date { color: #666; }
.chart-container { margin-top: 15px; }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 20px; }
.bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
.bar {
    width: 100%;
    background: linear-gradient(180deg, #d4af37, #8b7355);
    border-radius: 4px 4px 0 0;
    min-height: 5px;
    transition: height 1s;
}
.bar-label { font-size: 0.7em; color: #666; margin-top: 5px; }
.bar-value { font-size: 0.75em; color: #d4af37; margin-bottom: 3px; }
.footer {
    text-align: center;
    padding: 30px;
    color: #555;
    font-size: 0.85em;
    border-top: 1px solid rgba(212, 175, 55, 0.1);
}
.loading { text-align: center; padding: 50px; color: #888; }
.update-time { text-align: right; color: #666; font-size: 0.8em; margin-bottom: 20px; }
.back-link {
    display: inline-block;
    margin: 20px;
    color: #d4af37;
    text-decoration: none;
    font-size: 0.9em;
}
.back-link:hover { text-decoration: underline; }

/* ===== 移动端适配 ===== */
@media (max-width: 768px) {
  body { padding: 10px !important; }
  .container, .sm-container { max-width: 100% !important; padding: 0 12px !important; }
  h1 { font-size: 1.5em !important; }
  h2 { font-size: 1.2em !important; }
  .sm-grid { grid-template-columns: 1fr !important; }
  table { font-size: 0.85em; }
  img { max-width: 100% !important; height: auto !important; }
}
</style>
</head>
<body>
<a href="/" class="back-link">← 返回首页</a>
<div class="header">
    <div class="omega">Ω₀⊂⊙∞⊂Ω</div>
    <h1>数字资产可视化中心</h1>
    <p>全域资产实时统计 · 自动拉取 · 动态展示</p>
</div>
<div class="container">
    <div class="update-time" id="updateTime">加载中...</div>
    <div id="content">
        <div class="loading">正在加载资产数据...</div>
    </div>
</div>
<div class="footer">
    火斗云智AIOS · 元极恒一超认知永恒自治体系 · DID-BR-000002<br>
    数据每15分钟自动更新
</div>

<script>
async function loadData() {
    try {
        const resp = await fetch('/digital_assets.json');
        const data = await resp.json();
        render(data);
    } catch (e) {
        document.getElementById('content').innerHTML = '<div class="loading">数据加载失败: ' + e.message + '</div>';
    }
}

function render(d) {
    document.getElementById('updateTime').textContent = '数据更新时间: ' + new Date(d.generated_at).toLocaleString('zh-CN');

    const onlineCount = d.services.filter(s => s.status === 'online').length;

    let html = '';

    // 总览卡片
    html += '<div class="stats-grid">';
    html += statCard('📚', d.truths.total, '真值条目');
    html += statCard('🖼️', d.media.images, '图片资产');
    html += statCard('🎬', d.media.videos, '视频资产');
    html += statCard('📄', d.documents.total, '技术文档');
    html += statCard('📜', d.meta_rules.total, '元法则');
    html += statCard('🔗', d.truths.nodes, '同源节点');
    html += statCard('✅', onlineCount + '/' + d.services.length, '在线服务');
    html += statCard('💾', d.media.total_size_mb + 'MB', '媒体存储');
    if (d.web_assets) {
        html += statCard('🌐', d.web_assets.total_html, '网页页面');
        html += statCard('🖥️', d.web_assets.total_subdomains, '子域名');
    }
    html += '</div>';

    // 系统资源
    html += '<div class="section">';
    html += '<h2>系统资源</h2>';
    html += '<div style="margin-bottom:15px"><span>内存使用: ' + d.system.memory.usage_percent + '%</span>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + d.system.memory.usage_percent + '%"></div></div></div>';
    html += '<div><span>磁盘使用: ' + d.system.disk.usage_percent + '%</span>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + d.system.disk.usage_percent + '%"></div></div></div>';
    html += '</div>';

    // 真值增长趋势
    if (d.truths.daily_growth && d.truths.daily_growth.length > 0) {
        html += '<div class="section">';
        html += '<h2>近7天真值增长</h2>';
        html += '<div class="bar-chart">';
        const max = Math.max(...d.truths.daily_growth.map(x => x.count), 1);
        d.truths.daily_growth.forEach(day => {
            const h = (day.count / max) * 100;
            html += '<div class="bar-item"><div class="bar-value">' + day.count + '</div>';
            html += '<div class="bar" style="height:' + Math.max(h, 5) + '%"></div>';
            html += '<div class="bar-label">' + day.day.slice(5) + '</div></div>';
        });
        html += '</div></div>';
    }

    // 真值分类
    if (d.truths.by_category) {
        html += '<div class="section">';
        html += '<h2>真值分类</h2><div class="category-list">';
        Object.entries(d.truths.by_category).sort((a,b) => b[1]-a[1]).forEach(([cat, count]) => {
            html += '<span class="category-tag">' + cat + '<span class="count">' + count + '</span></span>';
        });
        html += '</div></div>';
    }

    // 服务状态
    html += '<div class="section">';
    html += '<h2>核心服务状态</h2><div class="service-list">';
    d.services.forEach(s => {
        html += '<div class="service-item"><div class="status-dot status-' + s.status + '"></div>';
        html += '<span>' + s.name + ' (' + s.port + ')</span></div>';
    });
    html += '</div></div>';

    // 网页资产矩阵
    if (d.web_assets) {
        html += '<div class="section">';
        html += '<h2>网页资产矩阵 (' + d.web_assets.total_html + '页面)</h2>';

        // 子域名
        if (d.web_assets.subdomains && d.web_assets.subdomains.length > 0) {
            html += '<h3 style="color:#aaa;margin:15px 0 10px;font-size:1em">子域名 (' + d.web_assets.total_subdomains + ')</h3>';
            html += '<div class="service-list">';
            d.web_assets.subdomains.forEach(sd => {
                html += '<div class="service-item"><div class="status-dot status-' + sd.status + '"></div>';
                html += '<a href="https://' + sd.domain + '" target="_blank" style="color:#ccc;text-decoration:none">' + sd.domain + '</a>';
                html += '<span style="margin-left:auto;color:#666;font-size:0.8em">' + sd.pages + '页 · ' + sd.size_mb + 'MB</span></div>';
            });
            html += '</div>';
        }

        // 子目录
        if (d.web_assets.subdirectories) {
            html += '<h3 style="color:#aaa;margin:20px 0 10px;font-size:1em">主站子目录</h3>';
            html += '<div class="category-list">';
            Object.entries(d.web_assets.subdirectories).sort((a,b) => b[1]-a[1]).forEach(([dir, count]) => {
                html += '<a href="/' + dir + '/" style="text-decoration:none"><span class="category-tag">/' + dir + '/<span class="count">' + count + '</span></span></a>';
            });
            html += '</div>';
        }
        html += '</div>';
    }

    // 业务域自动分类
    if (d.classification && d.classification.length > 0) {
        html += '<div class="section">';
        html += '<h2>业务域自动分类 (' + d.classification.length + '大领域)</h2>';
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px">';
        d.classification.forEach(dom => {
            const total = dom.pages + dom.docs + dom.media;
            html += '<div style="background:rgba(0,0,0,0.3);border:1px solid rgba(212,175,55,0.15);border-radius:10px;padding:20px">';
            html += '<div style="display:flex;align-items:center;margin-bottom:12px">';
            html += '<span style="font-size:1.8em;margin-right:10px">' + dom.icon + '</span>';
            html += '<div><div style="color:#d4af37;font-weight:bold;font-size:1.05em">' + dom.name + '</div>';
            html += '<div style="color:#666;font-size:0.8em">' + total + '项资产</div></div></div>';
            html += '<div style="display:flex;gap:15px;font-size:0.85em;color:#aaa">';
            html += '<span>📄 ' + dom.pages + '页面</span>';
            html += '<span>📚 ' + dom.docs + '文档</span>';
            html += '<span>🖼️ ' + dom.media + '媒体</span>';
            html += '</div>';
            if (dom.subdomains && dom.subdomains.length > 0) {
                html += '<div style="margin-top:10px;font-size:0.8em">';
                dom.subdomains.forEach(sd => {
                    html += '<a href="https://' + sd + '" target="_blank" style="color:#8BC8EA;text-decoration:none;margin-right:8px">↗ ' + sd + '</a>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        html += '</div></div>';
    }

    // 最近文档
    if (d.documents.recent && d.documents.recent.length > 0) {
        html += '<div class="section">';
        html += '<h2>最近文档 (' + d.documents.total + '篇)</h2><div class="docs-list">';
        d.documents.recent.forEach(doc => {
            html += '<div class="doc-item"><span class="name">' + doc.name + '</span>';
            html += '<span class="date">' + doc.updated + ' · ' + doc.size_kb + 'KB</span></div>';
        });
        html += '</div></div>';
    }

    document.getElementById('content').innerHTML = html;
}

function statCard(icon, value, label) {
    return '<div class="stat-card"><div class="icon">' + icon + '</div>' +
           '<div class="value">' + value + '</div>' +
           '<div class="label">' + label + '</div></div>';
}

loadData();
setInterval(loadData, 300000);
</script>
</body>
</html>

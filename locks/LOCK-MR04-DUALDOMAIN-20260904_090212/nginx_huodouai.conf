server {
    listen 80;
    server_name huodouai.com www.huodouai.com;
    return 301 https://$host$request_uri;
}

# ========== huodouai.com = 品牌门户 ==========
server {
    listen 443 ssl;
	http2 on;
    server_name huodouai.com;

    ssl_certificate /www/server/panel/vhost/cert/huodouai.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/huodouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(env|git|htaccess|htpasswd|svn|DS_Store) { deny all; return 404; }
    location ~* \.(env|sql|bak|old|orig|save|swp|key|pem)$ { deny all; return 404; }
    location ^~ /backup/ { deny all; return 404; }

    # 控制台重定向到www
    location ^~ /console/ { return 301 https://www.huodouai.com/console/; }

    # API保留（品牌页也可调用）
    location /health { proxy_pass http://127.0.0.1:8000/health; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # 品牌落地页
    location / { root /www/wwwroot/huodouai.com; index index.html; try_files $uri $uri/ /index.html; }
}

# ========== www.huodouai.com = 技术交付+客户控制台 ==========
server {
    listen 443 ssl;
	http2 on;
    server_name www.huodouai.com;

    ssl_certificate /www/server/panel/vhost/cert/www.huodouai.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.huodouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~* \.(env|sql|bak|old|orig|save|swp|key|pem)$ { deny all; return 404; }

    # 全部系统功能集中在www
    location /health { proxy_pass http://127.0.0.1:8000/health; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /docs/ { proxy_pass http://127.0.0.1:8001/docs/; proxy_set_header Host $host; }
    location /ance/ { proxy_pass http://127.0.0.1:8002/; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location /vector/ { proxy_pass http://127.0.0.1:8003/; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location /monitor/ { proxy_pass http://127.0.0.1:8004/; proxy_set_header Host $host; }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4)$ { root /www/wwwroot/huodouai.com; expires 30d; add_header Cache-Control "public, immutable"; }
    location /gov/ { alias /www/wwwroot/huodouai.com/gov/; index index.html; try_files $uri $uri/ /gov/index.html; }
    location /gov-canvas/ { alias /www/wwwroot/huodouai.com/gov-canvas/; index index.html; try_files $uri $uri/ /gov-canvas/index.html; }
    location /gov-api/ { proxy_pass http://127.0.0.1:8005/; proxy_read_timeout 120s; proxy_send_timeout 120s; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }


    location /license/ {
        proxy_pass http://127.0.0.1:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /anchor/api/v1/sync/ {
        if ($http_x_api_key != "36f55bdd86407a1fc12f27240ed9736ac0c5cfb33e7b89ee9c9f7d8594e0c242") { return 401; }
        proxy_pass http://127.0.0.1:8006/api/v1/sync/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /anchor/ { proxy_pass http://127.0.0.1:8006/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; }


    # ========== frp内网穿透服务(带Basic Auth) ==========
    location ^~ /aios/ {
        auth_basic "ZONGYUAN AIOS - Restricted";
        auth_basic_user_file /www/server/nginx/conf/frp_access;
        proxy_pass http://127.0.0.1:8017/;
        proxy_set_header Host 127.0.0.1:8017;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /local-dashboard/ {
        auth_basic "ZONGYUAN Local Dashboard - Restricted Access";
        auth_basic_user_file /www/server/nginx/conf/frp_access;
        proxy_pass http://127.0.0.1:8899/;
        proxy_set_header Host 127.0.0.1:8899;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    # frps仪表盘(仅本地, 带认证)
    location ^~ /frp-admin/ {
        auth_basic "FRPS Admin - Restricted";
        auth_basic_user_file /www/server/nginx/conf/frp_access;
        proxy_pass http://127.0.0.1:7600/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 控制台作为www根路径的核心内容
    location /console/ { alias /www/wwwroot/huodouai.com/console/; index index.html; try_files $uri $uri/ /console/index.html; }

    # www根路径 = 控制台首页（技术交付入口）
    location / { root /www/wwwroot/huodouai.com; index index.html; try_files $uri $uri/ /index.html; }

    location /meta/ {
        proxy_pass http://127.0.0.1:8009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 稳态通用全能中台
    location /platform/ {
        alias /www/wwwroot/huodouai.com/platform/;
        index index.html;
        try_files $uri $uri/ /platform/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key "36f55bdd86407a1fc12f27240ed9736ac0c5cfb33e7b89ee9c9f7d8594e0c242";
        proxy_read_timeout 120s;
    }


    # 智能交互AI
    location /ai/ {
        alias /www/wwwroot/huodouai.com/ai/;
        index index.html;
        try_files $uri $uri/ /ai/index.html;
    }
    location /smartai/ {
        proxy_pass http://127.0.0.1:8011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key "36f55bdd86407a1fc12f27240ed9736ac0c5cfb33e7b89ee9c9f7d8594e0c242";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }


    # DevOps运维控制台
    location /ops/ {
        alias /www/wwwroot/huodouai.com/ops/;
        index index.html;
        try_files $uri $uri/ /ops/index.html;
    }

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONGYUAN-ROOT API异常告警中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 18px 30px;
            border-bottom: 2px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #d4af37, #f0c040);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: #1a1a2e;
        }
        .title-group h1 { font-size: 20px; font-weight: 700; color: #d4af37; letter-spacing: 1px; }
        .title-group p { font-size: 12px; color: #888; margin-top: 3px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 9px 18px;
            background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { border-color: #d4af37; color: #d4af37; }
        .btn.primary {
            background: linear-gradient(135deg, #d4af37, #f0c040);
            color: #1a1a2e; border-color: #d4af37; font-weight: 600;
        }
        .btn.danger { border-color: #ff4d4f; color: #ff4d4f; }
        .btn.success { border-color: #52c41a; color: #52c41a; }
        .btn.small { padding: 5px 10px; font-size: 11px; }

        .container { padding: 24px 30px; max-width: 1600px; margin: 0 auto; }

        .tabs {
            display: flex; gap: 4px; margin-bottom: 20px;
            border-bottom: 1px solid #2a2a4a;
        }
        .tab {
            padding: 12px 22px; cursor: pointer; font-size: 14px;
            color: #888; border-bottom: 2px solid transparent;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .tab:hover { color: #d4af37; }
        .tab.active { color: #d4af37; border-bottom-color: #d4af37; font-weight: 600; }
        .tab .badge {
            background: #ff4d4f; color: #fff; font-size: 10px;
            padding: 2px 7px; border-radius: 10px; font-weight: 600;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a4a; border-radius: 12px;
            padding: 18px 20px; transition: all 0.2s;
        }
        .stat-card:hover { border-color: #d4af37; transform: translateY(-2px); }
        .stat-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-value.critical { color: #ff4d4f; }
        .stat-value.warning { color: #faad14; }
        .stat-value.info { color: #1890ff; }
        .stat-value.success { color: #52c41a; }
        .stat-value.gold { color: #d4af37; }
        .stat-sub { font-size: 11px; color: #666; margin-top: 6px; }

        .panel {
            background: linear-gradient(135deg, #111118, #1a1a2e);
            border: 1px solid #2a2a4a; border-radius: 12px;
            margin-bottom: 20px; overflow: hidden;
        }
        .panel-header {
            padding: 14px 20px; border-bottom: 1px solid #2a2a4a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-title { font-size: 15px; font-weight: 600; color: #d4af37; }
        .panel-body { padding: 16px 20px; }

        .alert-list { display: flex; flex-direction: column; gap: 10px; }
        .alert-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a4a; border-radius: 10px;
            padding: 14px 16px; transition: all 0.2s;
        }
        .alert-item:hover { border-color: #d4af37; background: rgba(212,175,55,0.05); }
        .alert-item.critical { border-left: 4px solid #ff4d4f; }
        .alert-item.warning { border-left: 4px solid #faad14; }
        .alert-item.info { border-left: 4px solid #1890ff; }
        .alert-item.resolved { opacity: 0.6; }
        .alert-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 8px;
        }
        .alert-title { font-size: 14px; font-weight: 600; color: #e0e0e0; }
        .alert-severity {
            font-size: 10px; font-weight: 700; padding: 3px 10px;
            border-radius: 12px; text-transform: uppercase;
        }
        .alert-severity.critical { background: rgba(255,77,79,0.2); color: #ff4d4f; }
        .alert-severity.warning { background: rgba(250,173,20,0.2); color: #faad14; }
        .alert-severity.info { background: rgba(24,144,255,0.2); color: #1890ff; }
        .alert-desc { font-size: 12px; color: #aaa; margin-bottom: 10px; line-height: 1.5; }
        .alert-meta {
            display: flex; gap: 16px; font-size: 11px; color: #666;
            flex-wrap: wrap; margin-bottom: 10px;
        }
        .alert-meta span { display: flex; align-items: center; gap: 4px; }
        .alert-actions { display: flex; gap: 8px; }
        .metric-bar {
            display: flex; align-items: center; gap: 8px; margin: 6px 0;
        }
        .metric-bar-label { font-size: 11px; color: #888; width: 80px; }
        .metric-bar-track {
            flex: 1; height: 6px; background: #2a2a4a; border-radius: 3px; overflow: hidden;
        }
        .metric-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .metric-bar-value { font-size: 11px; color: #aaa; width: 60px; text-align: right; }

        .rules-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 14px;
        }
        .rule-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a4a; border-radius: 10px;
            padding: 14px 16px;
        }
        .rule-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .rule-name { font-size: 13px; font-weight: 600; color: #e0e0e0; }
        .rule-desc { font-size: 11px; color: #888; margin-bottom: 12px; line-height: 1.4; }
        .rule-config { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .rule-config label { font-size: 11px; color: #888; }
        .rule-config input[type="number"] {
            width: 80px; padding: 5px 8px; background: rgba(255,255,255,0.05);
            border: 1px solid #3a3a5a; border-radius: 6px; color: #e0e0e0;
            font-size: 12px; outline: none;
        }
        .switch {
            position: relative; width: 40px; height: 20px;
            background: #3a3a5a; border-radius: 10px; cursor: pointer;
            transition: background 0.2s;
        }
        .switch.active { background: #52c41a; }
        .switch::after {
            content: ""; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; background: #fff; border-radius: 50%;
            transition: transform 0.2s;
        }
        .switch.active::after { transform: translateX(20px); }

        .charts-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            margin-bottom: 20px;
        }
        .chart-container {
            background: linear-gradient(135deg, #111118, #1a1a2e);
            border: 1px solid #2a2a4a; border-radius: 12px; padding: 16px 20px;
        }
        .chart-title { font-size: 14px; font-weight: 600; color: #d4af37; margin-bottom: 12px; }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-row { display: flex; align-items: center; gap: 10px; }
        .bar-label { font-size: 11px; color: #888; width: 100px; text-align: right; }
        .bar-track { flex: 1; height: 20px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; color: #fff; font-weight: 600; transition: width 0.5s; }
        .empty-state {
            text-align: center; padding: 40px 20px; color: #666;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .toast {
            position: fixed; top: 80px; right: 20px; z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #d4af37; color: #d4af37;
            padding: 12px 20px; border-radius: 8px; font-size: 13px;
            box-shadow: 0 4px 20px rgba(212,175,55,0.3);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid #2a2a4a; border-top-color: #d4af37;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .charts-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 16px; }
        }
    </style>

    <div class="header">
        <div class="header-left">
            <div class="logo">⚠</div>
            <div class="title-group">
                <h1>API异常告警中心</h1>
                <p>ZONGYUAN-ROOT 云内核 · 主动监控 · 异常预警 · 稳定性保障</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="loadAllData()">🔄 刷新</button>
            <button class="btn primary" onclick="runDetection()">🔍 运行检测</button>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab("overview")">📊 告警概览</div>
            <div class="tab" onclick="switchTab("active")">🚨 活跃告警 <span class="badge" id="activeBadge">0</span></div>
            <div class="tab" onclick="switchTab("history")">📜 历史告警</div>
            <div class="tab" onclick="switchTab("rules")">⚙️ 告警规则</div>
        </div>

        <!-- 告警概览 -->
        <div id="tab-overview">
            <div class="stats-grid" id="statsGrid">
                <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div>
            </div>
            <div class="charts-row">
                <div class="chart-container">
                    <div class="chart-title">📈 按告警级别分布</div>
                    <div class="bar-chart" id="severityChart"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">🔝 告警最多的端点 Top5</div>
                    <div class="bar-chart" id="endpointChart"></div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">⚡ 最新活跃告警</div>
                    <button class="btn small" onclick="switchTab("active")">查看全部 →</button>
                </div>
                <div class="panel-body">
                    <div class="alert-list" id="latestAlerts"></div>
                </div>
            </div>
        </div>

        <!-- 活跃告警 -->
        <div id="tab-active" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">🚨 活跃告警列表</div>
                    <div style="display:flex;gap:8px;">
                        <select id="activeFilter" onchange="renderActiveAlerts()" style="padding:6px 10px;background:rgba(255,255,255,0.05);border:1px solid #3a3a5a;border-radius:6px;color:#e0e0e0;font-size:12px;">
                            <option value="all">全部级别</option>
                            <option value="critical">严重</option>
                            <option value="warning">警告</option>
                            <option value="info">提示</option>
                        </select>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="alert-list" id="activeAlertsList"></div>
                </div>
            </div>
        </div>

        <!-- 历史告警 -->
        <div id="tab-history" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">📜 历史告警记录</div>
                    <select id="historyFilter" onchange="renderHistoryAlerts()" style="padding:6px 10px;background:rgba(255,255,255,0.05);border:1px solid #3a3a5a;border-radius:6px;color:#e0e0e0;font-size:12px;">
                        <option value="all">全部级别</option>
                        <option value="critical">严重</option>
                        <option value="warning">警告</option>
                        <option value="info">提示</option>
                    </select>
                </div>
                <div class="panel-body">
                    <div class="alert-list" id="historyAlertsList"></div>
                </div>
            </div>
        </div>

        <!-- 告警规则 -->
        <div id="tab-rules" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">⚙️ 告警规则配置</div>
                    <button class="btn small success" onclick="saveAllRules()">💾 保存全部</button>
                </div>
                <div class="panel-body">
                    <div class="rules-grid" id="rulesGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "/api/identity/api/v1/identity";
        const API_KEY = "zy-root-admin-2026-identity-api";
        let allAlerts = { active: [], history: [] };
        let alertStats = {};
        let alertRules = {};

        function apiCall(endpoint, method = "GET", body = null) {
            const options = {
                method: method,
                headers: {
                    "X-API-Key": API_KEY,
                    "Content-Type": "application/json"
                }
            };
            if (body) options.body = JSON.stringify(body);
            return fetch(API_BASE + endpoint, options).then(r => r.json());
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function formatTime(iso) {
            if (!iso) return "-";
            try {
                const d = new Date(iso);
                return d.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
            } catch { return iso; }
        }

        function switchTab(tab) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            event.target.classList.add("active");
            ["overview", "active", "history", "rules"].forEach(t => {
                document.getElementById("tab-" + t).style.display = t === tab ? "block" : "none";
            });
        }

        async function loadAllData() {
            try {
                const [alertsRes, statsRes, rulesRes] = await Promise.all([
                    apiCall("/alerts?limit=100"),
                    apiCall("/alerts/stats"),
                    apiCall("/alerts/rules")
                ]);
                allAlerts.active = alertsRes.alerts.filter(a => a.status === "active");
                allAlerts.history = alertsRes.alerts.filter(a => a.status === "resolved");
                alertStats = statsRes;
                alertRules = rulesRes;
                document.getElementById("activeBadge").textContent = allAlerts.active.length;
                renderStats();
                renderCharts();
                renderLatestAlerts();
                renderActiveAlerts();
                renderHistoryAlerts();
                renderRules();
            } catch (e) {
                showToast("加载失败: " + e.message);
            }
        }

        function renderStats() {
            const s = alertStats.stats || {};
            const bySev = alertStats.by_severity || {};
            const html = `
                <div class="stat-card">
                    <div class="stat-label">总告警数</div>
                    <div class="stat-value gold">${s.total_alerts || 0}</div>
                    <div class="stat-sub">累计所有告警</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">活跃告警</div>
                    <div class="stat-value ${(s.active_alerts || 0) > 0 ? "warning" : "success"}">${s.active_alerts || 0}</div>
                    <div class="stat-sub">待处理告警</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已解决</div>
                    <div class="stat-value success">${s.resolved_alerts || 0}</div>
                    <div class="stat-sub">已处理完成</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">严重告警</div>
                    <div class="stat-value critical">${bySev.critical || 0}</div>
                    <div class="stat-sub">Critical级别</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">警告告警</div>
                    <div class="stat-value warning">${bySev.warning || 0}</div>
                    <div class="stat-sub">Warning级别</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">今日告警</div>
                    <div class="stat-value info">${s.today_alerts || 0}</div>
                    <div class="stat-sub">今日新增</div>
                </div>
            `;
            document.getElementById("statsGrid").innerHTML = html;
        }

        function renderCharts() {
            const bySev = alertStats.by_severity || {};
            const sevData = [
                { label: "严重 Critical", value: bySev.critical || 0, color: "#ff4d4f" },
                { label: "警告 Warning", value: bySev.warning || 0, color: "#faad14" },
                { label: "提示 Info", value: bySev.info || 0, color: "#1890ff" }
            ];
            const maxSev = Math.max(...sevData.map(d => d.value), 1);
            document.getElementById("severityChart").innerHTML = sevData.map(d => `
                <div class="bar-row">
                    <div class="bar-label">${d.label}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${(d.value/maxSev)*100}%;background:${d.color};">${d.value}</div></div>
                </div>
            `).join("");

            const endpoints = alertStats.top_endpoints || [];
            const maxEp = Math.max(...endpoints.map(e => e.count), 1);
            const colors = ["#d4af37", "#e94560", "#0f3460", "#533483", "#e94560"];
            document.getElementById("endpointChart").innerHTML = endpoints.length ? endpoints.map((e, i) => `
                <div class="bar-row">
                    <div class="bar-label" style="font-size:10px;">${e.endpoint.length > 20 ? e.endpoint.slice(0,20)+"..." : e.endpoint}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${(e.count/maxEp)*100}%;background:${colors[i%colors.length]};">${e.count}</div></div>
                </div>
            `).join("") : '<div class="empty-state"><p>暂无数据</p></div>';
        }

        function renderAlertItem(alert, isHistory = false) {
            const sev = alert.severity || "info";
            const details = alert.details || {};
            return `
                <div class="alert-item ${sev} ${isHistory ? "resolved" : ""}">
                    <div class="alert-header">
                        <div class="alert-title">${alert.rule_name || alert.rule_id || "未知规则"}</div>
                        <span class="alert-severity ${sev}">${sev}</span>
                    </div>
                    <div class="alert-desc">${alert.description || ""}</div>
                    <div class="alert-meta">
                        <span>📍 ${alert.endpoint || "-"}</span>
                        <span>📊 ${alert.metric_value}${alert.unit || ""} / 阈值${alert.threshold}${alert.unit || ""}</span>
                        <span>🕐 ${formatTime(alert.created_at)}</span>
                        ${alert.acknowledged ? '<span style="color:#52c41a;">✅ 已确认</span>' : '<span style="color:#faad14;">⏳ 待确认</span>'}
                        ${isHistory && alert.resolved_at ? `<span style="color:#52c41a;">✅ ${formatTime(alert.resolved_at)} 解决</span>` : ""}
                    </div>
                    ${!isHistory ? `
                    <div class="alert-actions">
                        ${!alert.acknowledged ? `<button class="btn small" onclick="acknowledgeAlert("${alert.id}")">✓ 确认</button>` : ""}
                        <button class="btn small success" onclick="resolveAlert("${alert.id}")">✓ 标记已解决</button>
                        <button class="btn small" onclick="viewAlertDetails("${alert.id}")">详情</button>
                    </div>
                    ` : `
                    <div class="alert-meta"><span>💬 ${alert.resolution || "已解决"}</span></div>
                    `}
                </div>
            `;
        }

        function renderLatestAlerts() {
            const latest = allAlerts.active.slice(0, 3);
            document.getElementById("latestAlerts").innerHTML = latest.length ?
                latest.map(a => renderAlertItem(a)).join("") :
                '<div class="empty-state"><div class="icon">✅</div><p>暂无活跃告警，系统运行正常</p></div>';
        }

        function renderActiveAlerts() {
            const filter = document.getElementById("activeFilter").value;
            let alerts = allAlerts.active;
            if (filter !== "all") alerts = alerts.filter(a => a.severity === filter);
            document.getElementById("activeAlertsList").innerHTML = alerts.length ?
                alerts.map(a => renderAlertItem(a)).join("") :
                '<div class="empty-state"><div class="icon">✅</div><p>暂无活跃告警</p></div>';
        }

        function renderHistoryAlerts() {
            const filter = document.getElementById("historyFilter").value;
            let alerts = allAlerts.history;
            if (filter !== "all") alerts = alerts.filter(a => a.severity === filter);
            document.getElementById("historyAlertsList").innerHTML = alerts.length ?
                alerts.map(a => renderAlertItem(a, true)).join("") :
                '<div class="empty-state"><div class="icon">📭</div><p>暂无历史告警</p></div>';
        }

        function renderRules() {
            const rules = alertRules.rules || {};
            const html = Object.entries(rules).map(([id, rule]) => `
                <div class="rule-card">
                    <div class="rule-header">
                        <div class="rule-name">${rule.name || id}</div>
                        <div class="switch ${rule.enabled ? "active" : ""}" onclick="toggleRule("${id}")" data-rule="${id}"></div>
                    </div>
                    <div class="rule-desc">${rule.description || ""}</div>
                    <div class="rule-config">
                        <label>阈值:</label>
                        <input type="number" value="${rule.threshold}" data-rule="${id}" data-field="threshold" step="0.1">
                        <span style="font-size:11px;color:#888;">${rule.unit || ""}</span>
                        <label style="margin-left:10px;">级别:</label>
                        <span class="alert-severity ${rule.severity}" style="font-size:10px;">${rule.severity}</span>
                    </div>
                </div>
            `).join("");
            document.getElementById("rulesGrid").innerHTML = html;
        }

        async function acknowledgeAlert(id) {
            try {
                await apiCall("/alerts/" + id + "/acknowledge", "POST");
                showToast("✅ 告警已确认");
                loadAllData();
            } catch (e) {
                showToast("确认失败: " + e.message);
            }
        }

        async function resolveAlert(id) {
            const resolution = prompt("请输入解决说明（可选）:", "已排查并解决");
            if (resolution === null) return;
            try {
                await apiCall("/alerts/" + id + "/resolve", "POST", { resolution });
                showToast("✅ 告警已标记为已解决");
                loadAllData();
            } catch (e) {
                showToast("解决失败: " + e.message);
            }
        }

        function viewAlertDetails(id) {
            const alert = [...allAlerts.active, ...allAlerts.history].find(a => a.id === id);
            if (alert) {
                alert(JSON.stringify(alert, null, 2));
            }
        }

        async function toggleRule(id) {
            const rule = alertRules.rules[id];
            const newEnabled = !rule.enabled;
            try {
                await apiCall("/alerts/rules/" + id, "PUT", { enabled: newEnabled });
                showToast("✅ 规则已" + (newEnabled ? "启用" : "禁用"));
                loadAllData();
            } catch (e) {
                showToast("更新失败: " + e.message);
            }
        }

        async function saveAllRules() {
            const inputs = document.querySelectorAll("#rulesGrid input[data-rule]");
            let updated = 0;
            for (const input of inputs) {
                const id = input.dataset.rule;
                const field = input.dataset.field;
                const value = parseFloat(input.value);
                try {
                    await apiCall("/alerts/rules/" + id, "PUT", { [field]: value });
                    updated++;
                } catch (e) {
                    console.error("更新规则失败", id, e);
                }
            }
            showToast("✅ 已保存 " + updated + " 条规则配置");
            loadAllData();
        }

        async function runDetection() {
            showToast("🔍 正在运行异常检测...");
            try {
                const result = await apiCall("/alerts/detect", "POST");
                showToast("✅ 检测完成，发现 " + result.detected_count + " 个异常");
                loadAllData();
            } catch (e) {
                showToast("检测失败: " + e.message);
            }
        }

        // 初始化
        loadAllData();
        // 每5分钟自动刷新
        setInterval(loadAllData, 300000);
    </script>
</body>
</html>

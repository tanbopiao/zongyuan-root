    <label style="font-size:11px;color:#888">批量主题（每行一个短剧创意）</label>
    <textarea id="batch-input" rows="5" placeholder="每行一个短剧主题，例如：&#10;纯乌黑长发东方神女下凡渡劫&#10;九天玄女战妖魔&#10;太阴月神蚀月之夜">纯乌黑长发东方神女下凡渡劫&#10;九天玄女战妖魔&#10;太阴月神蚀月之夜</textarea>

      <select id="batch-parallel" style="flex:1"><option value="1">并行1个（稳定）</option><option value="2" selected>并行2个（推荐）</option><option value="3">并行3个（快速）</option></select>
    </div>
    <button class="btn" onclick="submitBatch()">⚡ 提交批量任务</button>

  </div>

<script>
let batches = {};
async function submitBatch(){
  const lines = document.getElementById('batch-input').value.split('\n').filter(l=>l.trim());
  if(lines.length===0){addLog('error','请输入至少一个主题');return;}
  addLog('info',`提交批量任务：${lines.length}集`);
  const result = await submitBatch(lines, document.getElementById('batch-template').value);
  if(result.batch_id){
    batches[result.batch_id] = {id:result.batch_id,total:result.total,completed:0,items:lines.map((p,i)=>({index:i,prompt:p,status:'pending'}))};
    addLog('success',`批量任务已提交：${result.batch_id}`);
    renderBatches();
    pollBatch(result.batch_id);
  }else{addLog('error','提交失败：'+JSON.stringify(result));}
}
async function pollBatch(bid){
  const interval = setInterval(async()=>{
    const result = await apiCall(`/batch/status?batch_id=${bid}`,{},'GET');
    if(result.error||result.status==='completed'){
      clearInterval(interval);
      if(result.status==='completed') addLog('success',`批量任务${bid}完成！`);
    }
    if(result.items){batches[bid]=result;renderBatches();}
  },5000);
}
function renderBatches(){
  const list = document.getElementById('batch-list');
  const ids = Object.keys(batches);
  if(ids.length===0){list.innerHTML='<div style="color:#666;grid-column:1/-1;text-align:center;padding:20px">暂无批量任务</div>';return;}
  list.innerHTML = ids.map(id=>{
    const b=batches[id];
    const pct = b.total?Math.round(b.completed/b.total*100):0;
    return `<div class="batch-card"><h4>${id}</h4>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:#888;margin-bottom:8px">进度：${b.completed}/${b.total} (${pct}%)</div>
      ${(b.items||[]).map((item,i)=>`<div class="episode-item"><span>第${i+1}集</span><span class="${item.status==='completed'?'status-ok':item.status==='running'?'status-warn':item.status==='failed'?'status-err':''}">${item.status||'pending'}</span></div>`).join('')}
    </div>`;
  }).join('');
}
function loadBatches(){renderBatches();addLog('info','状态已刷新');}
function addLog(type,msg){const box=document.getElementById('log-box');const t=new Date().toLocaleTimeString();const d=document.createElement('div');d.className='log-line '+type;d.textContent=`[${t}] ${msg}`;box.appendChild(d);box.scrollTop=box.scrollHeight;}
</script>

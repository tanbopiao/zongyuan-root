<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昆仑洞天 · 短剧生产后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0d5b8;
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        .header h1 { color: #d4af37; font-size: 28px; margin-bottom: 8px; }
        .header .sub { color: #888; font-size: 14px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .num { font-size: 32px; color: #d4af37; font-weight: bold; }
        .stat-card .label { color: #888; font-size: 12px; margin-top: 5px; }
        .section {
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }
        .btn-secondary { background: #333; color: #e0d5b8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input {
            background: #0a0a0f;
            border: 1px solid #444;
            color: #e0d5b8;
            padding: 10px 15px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 10px;
        }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .row > div { flex: 1; }
        .task-item {
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .task-item .status-completed { color: #4caf50; }
        .task-item .status-failed { color: #f44336; }
        .task-item .status-processing { color: #ff9800; }
        .task-item .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #ffd700);
            transition: width 0.3s;
        }
        .refresh-btn {
            float: right;
            font-size: 12px;
            padding: 5px 12px;
        }
        .log-box {
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #5a4a3a;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⛰️ 昆仑洞天短剧生产后台</h1>
        <div class="sub">ZONGYUAN-ROOT · DID-BR-000002 · Ω₀⊂⊙∞⊂Ω</div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="num" id="total-episodes">--</div><div class="label">篇章总数</div></div>
        <div class="stat-card"><div class="num" id="total-tasks">--</div><div class="label">任务总数</div></div>
        <div class="stat-card"><div class="num" id="completed-tasks">--</div><div class="label">已完成</div></div>
        <div class="stat-card"><div class="num" id="failed-tasks">--</div><div class="label">失败</div></div>
    </div>

    <div class="section">
        <h2>🚀 一键量产 <button class="btn btn-secondary refresh-btn" onclick="refreshStats()">刷新</button></h2>
        <p style="color:#888;margin-bottom:15px;">输入主题，自动生成剧本分镜+关键帧，然后逐个生成视频</p>
        <div class="row">
            <div><input class="input" id="topic-input" placeholder="输入剧情主题，如：太阴月神觉醒"></div>
            <div><input class="input" id="title-input" placeholder="输入篇章标题，如：第一章·墟门开启"></div>
        </div>
        <button class="btn" onclick="startProduction()">开始量产</button>
        <div class="log-box" id="production-log">等待开始生产...</div>
    </div>

    <div class="section">
        <h2>📋 任务队列 <button class="btn btn-secondary refresh-btn" onclick="loadTasks()">手动刷新</button></h2>
        <div id="task-list">
            <p style="color:#888;">加载中...</p>
        </div>
    </div>

    <div class="section">
        <h2>⚙️ 系统状态</h2>
        <div class="row">
            <div><strong>后端API：</strong><span id="api-status" style="color:#4caf50;">在线</span></div>
            <div><strong>记忆网关：</strong><span style="color:#4caf50;">在线</span></div>
            <div><strong>本地存储：</strong><span style="color:#4caf50;">已挂载</span></div>
        </div>
    </div>

    <div class="footer">
        Ω₀⊂⊙∞⊂Ω ｜ DID-BR-000002 ｜ ZONGYUAN-ROOT
    </div>
</div>

<script>
const API_BASE = '/api';

function addLog(msg) {
    const log = document.getElementById('production-log');
    const time = new Date().toLocaleTimeString();
    log.innerHTML = '[' + time + '] ' + msg + '\n' + log.innerHTML;
}

async function refreshStats() {
    try {
        const resp = await fetch(API_BASE + '/stats/overview');
        const data = await resp.json();
        document.getElementById('total-episodes').textContent = data.total_episodes || data.episodes || '--';
        document.getElementById('total-tasks').textContent = data.total_tasks || data.task_count || '--';
        document.getElementById('completed-tasks').textContent = data.completed_tasks || data.completed || '--';
        document.getElementById('failed-tasks').textContent = data.failed_tasks || data.failed || '--';
    } catch (e) {
        console.error('刷新统计失败', e);
    }
}

async function loadTasks() {
    try {
        const resp = await fetch(API_BASE + '/task/list');
        const data = await resp.json();
        const tasks = data.tasks || (Array.isArray(data) ? data : []);
        const list = document.getElementById('task-list');
        if (!tasks || tasks.length === 0) {
            list.innerHTML = '<p style="color:#888;">暂无任务</p>';
            return;
        }
        list.innerHTML = tasks.map(t => `
            <div class="task-item">
                <div class="task-header">
                    <span>${t.episode_id || t.task_id || t.id}</span>
                    <span class="status-${t.status}">${t.status || 'unknown'}</span>
                </div>
                <div style="color:#888;font-size:12px;">${t.created_at || ''}</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${t.progress || 0}%"></div>
                </div>
                ${t.status === 'failed' ? `<button class="btn btn-secondary" style="margin-top:10px;padding:6px 15px;font-size:12px" onclick="retryTask('${t.task_id || t.id}')">↻ 重试此任务</button>` : ''}
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('task-list').innerHTML = '<p style="color:#f44336;">加载失败</p>';
    }
}

async function retryTask(taskId) {
    if (!confirm('确认重试任务 ' + taskId + ' ？')) return;
    addLog('重试任务: ' + taskId);
    try {
        await fetch(API_BASE + '/task/retry', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({task_id: taskId})
        });
        addLog('重试任务已提交: ' + taskId);
        setTimeout(loadTasks, 2000);
    } catch (e) {
        addLog('重试失败: ' + e.message);
    }
}

async function startProduction() {
    const topic = document.getElementById('topic-input').value;
    const title = document.getElementById('title-input').value;
    if (!topic || !title) {
        alert('请输入主题和标题');
        return;
    }
    
    addLog('开始生产：' + title);
    addLog('主题：' + topic);
    
    try {
        const resp = await fetch(API_BASE + '/task/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({topic, title})
        });
        const data = await resp.json();
        addLog('任务创建成功：' + data.task_id);
        addLog('等待生成完成...');
    } catch (e) {
        addLog('错误：' + e.message);
    }
    
    setTimeout(loadTasks, 2000);
}

// 自动刷新
setInterval(() => {
    refreshStats();
    loadTasks();
}, 10000);

// 初始加载
refreshStats();
loadTasks();
</script>
<button onclick="openSettings()" style="position:fixed;top:20px;right:20px;z-index:999;padding:10px 20px;background:#d4af37;color:#1a1a2e;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">⚙️ API设置</button>

<div id="settingsModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;padding:20px;box-sizing:border-box;">
  <div style="max-width:500px;margin:50px auto;background:#1a1a2e;padding:30px;border-radius:10px;border:1px solid #d4af37;">
    <h2 style="color:#d4af37;margin-top:0;">API Key设置</h2>
    
    <div style="margin-bottom:20px;">
      <label style="color:#e0d5b8;">模式：</label>
      <select id="apiMode" style="margin-left:10px;padding:5px;background:#2d1f3d;color:#e0d5b8;border:1px solid #d4af37;">
        <option value="public">公共测试（限流）</option>
        <option value="user">自带API Key</option>
      </select>
    </div>
    
    <div id="userKeysSection" style="display:none;">
      <div style="margin-bottom:15px;">
        <label style="color:#e0d5b8;display:block;margin-bottom:5px;">智谱GLM Key：</label>
        <input type="text" id="zhipuKey" style="width:100%;padding:8px;background:#2d1f3d;color:#e0d5b8;border:1px solid #666;box-sizing:border-box;">
      </div>
      <div style="margin-bottom:15px;">
        <label style="color:#e0d5b8;display:block;margin-bottom:5px;">Agnes图片Key：</label>
        <input type="text" id="agnesKey" style="width:100%;padding:8px;background:#2d1f3d;color:#e0d5b8;border:1px solid #666;box-sizing:border-box;">
      </div>
      <div style="margin-bottom:15px;">
        <label style="color:#e0d5b8;display:block;margin-bottom:5px;">通义万相视频Key：</label>
        <input type="text" id="tongyiKey" style="width:100%;padding:8px;background:#2d1f3d;color:#e0d5b8;border:1px solid #666;box-sizing:border-box;">
      </div>
    </div>
    
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button onclick="saveSettings()" style="flex:1;padding:10px;background:#d4af37;color:#1a1a2e;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">保存</button>
      <button onclick="closeSettings()" style="flex:1;padding:10px;background:#333;color:#e0d5b8;border:none;border-radius:5px;cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<script>
function openSettings() {
  document.getElementById('settingsModal').style.display = 'block';
  fetch('/api/user/keys').then(r=>r.json()).then(d=>{
    document.getElementById('apiMode').value = d.mode || 'public';
    document.getElementById('userKeysSection').style.display = d.mode === 'user' ? 'block' : 'none';
    if(d.keys) {
      document.getElementById('zhipuKey').value = d.keys.zhipu || '';
      document.getElementById('agnesKey').value = d.keys.agnes || '';
      document.getElementById('tongyiKey').value = d.keys.tongyi || '';
    }
  });
}
function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}
document.getElementById('apiMode').addEventListener('change', function() {
  document.getElementById('userKeysSection').style.display = this.value === 'user' ? 'block' : 'none';
});
function saveSettings() {
  const mode = document.getElementById('apiMode').value;
  const keys = {
    zhipu: document.getElementById('zhipuKey').value,
    agnes: document.getElementById('agnesKey').value,
    tongyi: document.getElementById('tongyiKey').value
  };
  fetch('/api/user/keys', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode, keys})
  }).then(r=>r.json()).then(d=>{
    alert('设置已保存！');
    closeSettings();
  });
}
</script>


<script>
/* ============================================================================
 * ZONGYUAN-ROOT 真值根握手模块 v1.0
 * DID-BR-000002 | Ω₀⊂⊙∞⊂Ω | 昆仑洞天自治体系
 *
 * 功能：
 *  1. 全握手 rootHandshake()  —— 客户端与根API握手，获取内核真值快照
 *  2. 轻握手 lightHandshake() —— 收到变更事件后校验根哈希，增量对齐
 *  3. 多窗口广播 BroadcastChannel + storage 兜底（同源多标签实时同步）
 *  4. 版本锁冲突处理         —— 本地摘要比对，真值变更自动广播通知
 *  5. 自动保活               —— 每60秒轻握手一次，变更即广播
 *
 * 设计原则：
 *  - 窗口之间只传递"变更通知"，不传递完整真值；
 *  - 完整真值一律从根API读取，根是唯一权威信源；
 *  - 断线自动重连，重连后自动全握手补齐。
 * ==========================================================================*/
(function () {
  'use strict';

  var ROOT = {
    apiBase: '/admin/api',        // nginx 代理到 8100 产线内核
    did: 'DID-BR-000002',
    kernel: 'ZONGYUAN-ROOT',
    node: '',
    truthVersion: 0,
    merkleRoot: '',
    localDigest: '',
    lastDigest: '',
    lastSync: 0
  };

  /* ---------- 轻量哈希（djb2）· 本地快照摘要 ---------- */
  function hashStr(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) {
      h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  }

  /* ---------- 计算本地真值摘要（works + tasks 状态） ---------- */
  function computeLocalDigest() {
    return Promise.all([
      fetch(ROOT.apiBase + '/works').then(function (r) { return r.json(); }).catch(function () { return null; }),
      fetch(ROOT.apiBase + '/task/list').then(function (r) { return r.json(); }).catch(function () { return null; })
    ]).then(function (res) {
      var w = res[0] ? JSON.stringify(res[0].stats || res[0]) : 'null';
      var t = res[1] ? JSON.stringify(res[1].count || res[1]) : 'null';
      return hashStr(w + t);
    }).catch(function () {
      return hashStr('local');
    });
  }

  /* ---------- 全握手 ---------- */
  function rootHandshake() {
    return fetch(ROOT.apiBase + '/system/status')
      .then(function (r) { return r.json(); })
      .then(function (sys) {
        return computeLocalDigest().then(function (digest) {
          ROOT.kernel = sys.kernel || ROOT.kernel;
          ROOT.node = sys.node || 'ZR-ROOT';
          ROOT.truthVersion = (sys.timestamp ? Date.parse(sys.timestamp) : Date.now());
          ROOT.merkleRoot = hashStr(ROOT.kernel + ':' + ROOT.node + ':' + ROOT.truthVersion);
          ROOT.localDigest = digest;
          ROOT.lastSync = Date.now();
          console.log('[ROOT-HS] 全握手成功 | 内核:', ROOT.kernel, '| 节点:', ROOT.node, '| 摘要:', digest);
          return true;
        });
      })
      .catch(function (e) {
        console.warn('[ROOT-HS] 全握手失败，降级本地模式', e);
        return false;
      });
  }

  /* ---------- 轻握手：比对根哈希 + 本地摘要，变化即广播 ---------- */
  function lightHandshake() {
    return rootHandshake().then(function (ok) {
      if (!ok) return false;
      // 本地真值变化检测：上一轮摘要 != 当前摘要 → 广播变更通知
      if (ROOT.lastDigest !== '' && ROOT.lastDigest !== ROOT.localDigest) {
        broadcast('truth-changed', { merkle: ROOT.merkleRoot, from: ROOT.localDigest, to: ROOT.lastDigest });
      }
      ROOT.lastDigest = ROOT.localDigest;
      return true;
    });
  }

  /* ---------- 多窗口广播通道 ---------- */
  var bc = null;
  try { bc = new BroadcastChannel('zongyuan-root'); } catch (e) { bc = null; }

  function broadcast(type, payload) {
    var msg = { type: type, payload: payload, ts: Date.now(), did: ROOT.did };
    if (bc) { try { bc.postMessage(msg); } catch (e) {} }
    // storage 事件兜底（BroadcastChannel 失效时）
    try { localStorage.setItem('zr-sync', JSON.stringify(msg)); } catch (e) {}
  }

  if (bc) {
    bc.onmessage = function (ev) {
      var d = ev.data;
      if (d && d.did === ROOT.did && d.type === 'truth-changed') {
        console.log('[ROOT-HS] 收到其他窗口真值变更通知，轻握手对齐');
        lightHandshake();
      }
    };
  }

  // storage 兜底监听（同源其他标签页写入时触发）
  window.addEventListener('storage', function (ev) {
    if (ev.key === 'zr-sync') {
      lightHandshake();
    }
  });

  /* ---------- 对外接口 ---------- */
  window.RootTruth = {
    handshake: rootHandshake,
    light: lightHandshake,
    notifyChange: function () { broadcast('truth-changed', { merkle: ROOT.merkleRoot }); },
    status: function () {
      return {
        did: ROOT.did,
        kernel: ROOT.kernel,
        node: ROOT.node,
        merkle: ROOT.merkleRoot,
        digest: ROOT.localDigest,
        lastSync: ROOT.lastSync
      };
    }
  };

  /* ---------- 启动自动握手 + 60秒保活 ---------- */
  rootHandshake();
  setInterval(lightHandshake, 60000);
})();

</script>
</body>

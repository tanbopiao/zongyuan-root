<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情 · 昆仑洞天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0d5b8;
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(90deg, #1a1a2e 0%, #2d1f3d 100%);
            padding: 20px;
            border-bottom: 2px solid #d4af37;
        }
        .header a { color: #d4af37; text-decoration: none; font-size: 14px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        .work-title { color: #d4af37; font-size: 28px; margin-bottom: 10px; }
        .work-desc { color: #8a7a5a; font-size: 15px; line-height: 1.8; margin-bottom: 30px; }
        .video-section {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #3a3a5a;
        }
        .video-section video { width: 100%; aspect-ratio: 9/16; display: block; object-fit: cover; }
        .video-placeholder {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 16px;
        }
        .section-title {
            color: #d4af37;
            font-size: 20px;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .keyframes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .kf-card {
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .kf-card:hover { border-color: #d4af37; }
        .kf-card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; }
        .kf-card .kf-name { padding: 10px; font-size: 13px; color: #8a7a5a; }
        .meta-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #8a7a5a;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #5a4a3a;
            font-size: 12px;
            margin-top: 50px;
        }
    
        /* 手机端自适应 */
        @media (max-width: 768px) {
            body { overflow-x: hidden; }
            .container { padding: 15px 10px; }
            .video-section { max-width: 100%; }
            .kf-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px;
            }
            .kf-card img { aspect-ratio: 9/16; }
        }

    </style>
</head>
<body>

<nav style="background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;">

        <span style="font-size: 18px; font-weight: 600; color: #1a202c;">火斗云智</span>
    </div>
    <div style="display: flex; gap: 24px; align-items: center;">
        <a href="/" style="color: #4a5568; text-decoration: none; font-size: 14px;">首页</a>
        <a href="/products/" style="color: #4a5568; text-decoration: none; font-size: 14px;">产品</a>
        <a href="/solutions/" style="color: #4a5568; text-decoration: none; font-size: 14px;">解决方案</a>
        <a href="/docs/" style="color: #4a5568; text-decoration: none; font-size: 14px;">文档</a>
        <a href="/pricing/" style="color: #4a5568; text-decoration: none; font-size: 14px;">定价</a>
        <a href="https://aios.huodouai.com/register.html" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500;">免费开始</a>
    </div>
</nav>

    <div class="header">
        <a href="/">← 返回作品库</a>
    </div>

    <div class="container">
        <div id="workDetail">
            <div style="text-align:center;color:#888;padding:50px;">加载中...</div>
        </div>
    </div>

    <div class="footer">
        Ω₀⊂⊙∞⊂Ω ｜ DID-BR-000002
    </div>

    <script>
        function fixUrl(url) {
            if (!url) return '';
            return url.replace('https://zongyuan-1341127773.cos.ap-guangzhou.myqcloud.com/kunlun-drama', '');
        }

        async function loadDetail() {
            const params = new URLSearchParams(location.search);
            const epId = params.get('id');
            const container = document.getElementById('workDetail');

            if (!epId) {
                container.innerHTML = '<div style="text-align:center;color:#888;padding:50px;">缺少作品ID</div>';
                return;
            }

            try {
                const resp = await fetch('/api/works');
                const data = await resp.json();
                const work = (data.episodes || []).find(e => e.id === epId);

                if (!work) {
                    container.innerHTML = '<div style="text-align:center;color:#f44336;padding:50px;">作品不存在</div>';
                    return;
                }

                document.title = work.name + ' · 昆仑洞天';

                const videoUrl = work.video ? fixUrl(work.video) : '';
                const keyframes = work.keyframes || [];

                container.innerHTML = `
                    <h1 class="work-title">${work.name || work.id}</h1>
                    <div class="work-desc">${work.description || ''}</div>
                    <div class="meta-row">
                        <span>篇章: ${work.id}</span>
                        <span>状态: ${work.status || '未知'}</span>
                        <span>分镜: ${keyframes.length}</span>
                    </div>

                    <div class="video-section">
                        ${videoUrl
                            ? `<video src="${videoUrl}" controls poster="${keyframes[0] ? fixUrl(keyframes[0].url) : ''}"></video>`
                            : `<div class="video-placeholder">🎬 视频制作中，敬请期待</div>`
                        }
                    </div>

                    <div class="section-title">关键帧分镜 (${keyframes.length})</div>
                    <div class="keyframes-grid">
                        ${keyframes.map(kf => `
                            <div class="kf-card">
                                <img src="${fixUrl(kf.url)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22140%22><rect fill=%22%231a1a2e%22 width=%22200%22 height=%22140%22/></svg>'">
                                <div class="kf-name">${kf.name || ''}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                container.innerHTML = '<div style="text-align:center;color:#f44336;padding:50px;">加载失败：' + e.message + '</div>';
            }
        }

        loadDetail();
    <!-- 互动按钮 -->
    <div style="display:flex; gap:12px; justify-content:center; margin:24px 0;">
        <button onclick="likeWork()" style="background:#1a1a2e; border:1px solid #d4af37; color:#d4af37; padding:10px 24px; border-radius:24px; cursor:pointer; font-size:14px;">❤ 点赞 <span id="likeCount">0</span></button>
        <button onclick="collectWork()" style="background:#1a1a2e; border:1px solid #3a3a5a; color:#e8dcc0; padding:10px 24px; border-radius:24px; cursor:pointer; font-size:14px;">⭐ 收藏</button>
        <button onclick="shareWork()" style="background:#1a1a2e; border:1px solid #3a3a5a; color:#e8dcc0; padding:10px 24px; border-radius:24px; cursor:pointer; font-size:14px;">📤 分享</button>
    </div>
    <script>
        function likeWork() {
            let c = parseInt(localStorage.getItem("liked_" + epId) || "0");
            if (c > 0) { alert("已经点过赞啦"); return; }
            localStorage.setItem("liked_" + epId, "1");
            document.getElementById("likeCount").innerText = c + 1;
        }
        function collectWork() {
            let saved = JSON.parse(localStorage.getItem("collections") || "[]");
            if (saved.includes(epId)) { alert("已经收藏啦"); return; }
            saved.push(epId);
            localStorage.setItem("collections", JSON.stringify(saved));
            alert("已收藏");
        }
        function shareWork() {
            navigator.clipboard.writeText(location.href);
            alert("链接已复制，快去分享吧~");
        }
    </script>
    </script>

<footer style="background: #1a202c; color: #a0aec0; padding: 40px 24px; text-align: center; margin-top: 60px;">

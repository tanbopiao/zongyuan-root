<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆仑洞天 · 东方神话AI创世宇宙 | 作品库</title>
<meta name="description" content="昆仑洞天 - 以AI之力重塑东方神话史诗。九天玄女、太阴月神、女娲等上古神祇的AI创世宇宙作品库。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a24;
  --gold-primary: #d4af37;
  --gold-light: #f4d03f;
  --gold-dark: #b8860b;
  --text-primary: #f0f0f0;
  --text-secondary: #a0a0b0;
  --text-muted: #606070;
  --border-color: #2a2a3a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans SC", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
}
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  padding: 0 40px; height: 70px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.navbar-logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 20px; color: var(--bg-primary);
}
.navbar-logo-text {
  font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.navbar-links { display: flex; gap: 32px; list-style: none; }
.navbar-link {
  color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
  transition: color 0.3s; position: relative;
}
.navbar-link:hover, .navbar-link.active { color: var(--gold-primary); }
.navbar-link.active::after {
  content: ""; position: absolute; bottom: -24px; left: 0; right: 0; height: 2px; background: var(--gold-primary);
}
.hero {
  margin-top: 70px; padding: 80px 40px 60px; text-align: center; position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 800px; height: 400px;
  background: radial-gradient(ellipse, rgba(212,175,55,0.1) 0%, transparent 70%);
  pointer-events: none;
}
.hero-subtitle {
  font-size: 13px; letter-spacing: 6px; color: var(--gold-primary);
  text-transform: uppercase; margin-bottom: 16px; font-weight: 500;
}
.hero-title {
  font-family: "Noto Serif SC", serif; font-size: 56px; font-weight: 900; margin-bottom: 16px;
  background: linear-gradient(135deg, #fff 0%, var(--gold-light) 50%, var(--gold-primary) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-description { font-size: 16px; color: var(--text-secondary); max-width: 600px; margin: 0 auto 40px; }
.stats-bar { display: flex; justify-content: center; gap: 60px; margin-bottom: 40px; }
.stat-item { text-align: center; }
.stat-number { font-family: "Noto Serif SC", serif; font-size: 36px; font-weight: 700; color: var(--gold-primary); }
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.filter-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
.filter-tag {
  padding: 8px 20px; border: 1px solid var(--border-color); border-radius: 20px;
  background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all 0.3s;
}
.filter-tag:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.filter-tag.active {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
  color: var(--bg-primary); border-color: var(--gold-primary); font-weight: 600;
}
.gallery-section { padding: 0 40px 80px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.section-title {
  font-family: "Noto Serif SC", serif; font-size: 24px; font-weight: 700; color: var(--text-primary);
}
.section-title::before {
  content: ""; display: inline-block; width: 4px; height: 24px; background: var(--gold-primary);
  margin-right: 12px; vertical-align: middle; border-radius: 2px;
}
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
.work-card {
  position: relative; border-radius: 12px; overflow: hidden; background: var(--bg-card);
  border: 1px solid var(--border-color); transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer; aspect-ratio: 9 / 16;
}
.work-card:hover {
  transform: translateY(-8px); border-color: var(--gold-primary);
  box-shadow: 0 20px 40px rgba(212,175,55,0.15);
}
.work-card-thumbnail { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
.work-card:hover .work-card-thumbnail { transform: scale(1.05); }
.work-card-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
  opacity: 0; transition: opacity 0.3s;
}
.work-card:hover .work-card-overlay { opacity: 1; }
.work-card-badge {
  position: absolute; top: 12px; left: 12px; padding: 4px 10px;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 4px;
  font-size: 11px; font-weight: 600; color: var(--gold-primary);
  border: 1px solid rgba(212,175,55,0.3);
}
.work-card-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 56px; height: 56px; background: rgba(212,175,55,0.9); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.3s;
}
.work-card:hover .work-card-play { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
.work-card-play::before {
  content: ""; width: 0; height: 0; border-left: 16px solid var(--bg-primary);
  border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px;
}
.work-card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.work-card-meta { font-size: 11px; color: var(--text-muted); }
.modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95);
  z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px);
}
.modal.active { display: flex; }
.modal-content { position: relative; max-width: 90vw; max-height: 90vh; }
.modal-video { max-width: 100%; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 60px rgba(212,175,55,0.2); }
.modal-close {
  position: absolute; top: -40px; right: 0; width: 36px; height: 36px;
  background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: white;
  font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }
.footer { padding: 40px; text-align: center; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 13px; }
.footer-identity { margin-top: 8px; color: var(--gold-dark); font-size: 12px; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.work-card { animation: fadeInUp 0.6s ease forwards; opacity: 0; }
@media (max-width: 768px) {
  .navbar { padding: 0 20px; }
  .navbar-links { display: none; }
  .hero { padding: 60px 20px 40px; }
  .hero-title { font-size: 36px; }
  .stats-bar { gap: 30px; }
  .stat-number { font-size: 28px; }
  .gallery-section { padding: 0 20px 60px; }
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
}
@media (max-width: 480px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .hero-title { font-size: 28px; }
}
.work-qc-badge { position: absolute; top: 8px; right: 8px; z-index: 2; }
.qc-badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; backdrop-filter: blur(4px); }
.qc-passed { background: rgba(39,174,96,0.8); color: #fff; }
.qc-failed { background: rgba(231,76,60,0.8); color: #fff; }
.qc-pending { background: rgba(149,165,166,0.8); color: #fff; }
.favorite-btn {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
  background: rgba(0,0,0,0.5);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}
.favorite-btn:hover { background: rgba(212,175,55,0.3); transform: scale(1.1); }
.favorite-btn.active { color: #f1c40f; background: rgba(241,196,15,0.2); }
.compare-mode-btn {
  padding: 8px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.compare-mode-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.compare-mode-btn.active { background: var(--gold-primary); color: #050508; border-color: var(--gold-primary); font-weight: 600; }
.work-card.selected { border-color: var(--gold-primary); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
.work-card.selected .select-badge { display: flex; }
.select-badge {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  background: rgba(212,175,55,0.9);
  border-radius: 50%;
  color: #050508;
  font-size: 24px;
  font-weight: 900;
  align-items: center;
  justify-content: center;
  z-index: 3;
}
.hover-preload-tip {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 10px;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 2;
  white-space: nowrap;
}
.work-card:hover .hover-preload-tip {
  opacity: 1;
}
.compare-modal { max-width: 1200px !important; width: 95vw !important; }
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
.compare-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
.compare-item-media { width: 100%; height: 300px; background: #000; display: flex; align-items: center; justify-content: center; }
.compare-item-media img, .compare-item-media video { max-width: 100%; max-height: 300px; object-fit: contain; }
.compare-item-info { padding: 16px; }
.compare-item-title { font-size: 16px; font-weight: 700; color: var(--gold-primary); margin-bottom: 12px; word-break: break-all; }
.compare-item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(212,175,55,0.1); font-size: 13px; }
.compare-item-label { color: var(--text-secondary); }
.compare-item-value { color: var(--text-primary); font-weight: 600; }
.compare-score-high { color: #27ae60; }
.compare-score-mid { color: #f39c12; }
.compare-score-low { color: #e74c3c; }
.detail-qc-info { margin-top: 16px; padding: 16px; background: var(--bg-secondary); border-radius: 8px; font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
.detail-actions { margin-top: 16px; display: flex; gap: 10px; }
.detail-action-btn { padding: 10px 20px; background: var(--gold-primary); border: none; border-radius: 20px; color: #050508; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.detail-action-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
.share-modal { max-width: 480px !important; width: 90vw !important; }
.share-content { padding: 30px; text-align: center; }
.share-title { font-size: 22px; font-weight: 700; color: var(--gold-primary); margin-bottom: 20px; }
.share-qr { width: 180px; height: 180px; margin: 0 auto 20px; background: #fff; padding: 10px; border-radius: 8px; }
.share-qr img { width: 100%; height: 100%; }
.share-link-container { display: flex; gap: 8px; margin-bottom: 16px; }
.share-link-input { flex: 1; padding: 10px 14px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 12px; outline: none; }
.share-copy-btn { padding: 10px 16px; background: var(--gold-primary); border: none; border-radius: 8px; color: #050508; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.share-copy-btn:hover { background: var(--gold-light); }
.share-copy-btn.copied { background: #27ae60; color: #fff; }
.share-tip { font-size: 12px; color: var(--text-muted); margin-top: 12px; }

/* 主题切换按钮 */
.theme-toggle-btn {
  background: none;
  border: none;
  color: var(--gold-primary);
  font-size: 18px;
  cursor: pointer;
  padding: 8px;
  margin-right: 8px;
  transition: transform 0.3s;
}
.theme-toggle-btn:hover { transform: scale(1.1); }

/* 亮色主题 */
body.light-theme {
  --bg-primary: #f5f5f0;
  --bg-secondary: #e8e8e0;
  --bg-card: rgba(255, 255, 255, 0.9);
  --border-color: rgba(184, 148, 31, 0.3);
  --text-primary: #1a1a1a;
  --text-secondary: #5a5a5a;
  --text-muted: #8a8a8a;
}
body.light-theme .zy-unified-nav {
  background: rgba(245, 245, 240, 0.95);
}
body.light-theme .work-card-overlay {
  background: linear-gradient(to top, rgba(245,245,240,0.95) 0%, transparent 100%);
}
body.light-theme .modal-content {
  background: #f5f5f0;
}

/* 标签筛选 */
.tag-filter-select {
  padding: 8px 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  outline: none;
}
.tag-filter-select:focus { border-color: var(--gold-primary); }

/* 作品标签 */
.work-card-tags {
  display: flex;
  gap: 4px;
  padding: 0 10px 8px;
  flex-wrap: wrap;
}
.work-tag {
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(212,175,55,0.15);
  color: var(--gold-primary);
  border-radius: 8px;
}

/* 详情页标签 */
.detail-tags {
  display: flex;
  gap: 6px;
  margin: 12px 0;
  flex-wrap: wrap;
}
.detail-tag {
  font-size: 12px;
  padding: 4px 10px;
  background: rgba(212,175,55,0.15);
  color: var(--gold-primary);
  border-radius: 12px;
}

/* 评分功能 */
.detail-rating-section {
  margin-top: 16px;
  padding: 16px;
  background: var(--bg-secondary);
  border-radius: 8px;
}
.rating-stars {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
}
.rating-star {
  font-size: 24px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.rating-star:hover { transform: scale(1.2); }
.rating-star.active { color: #f1c40f; }
.rating-text { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
.rating-clear-btn {
  margin-left: 12px;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
}
.rating-clear-btn:hover { border-color: #e74c3c; color: #e74c3c; }

/* 评论功能 */
.detail-comments-section {
  margin-top: 16px;
  padding: 16px;
  background: var(--bg-secondary);
  border-radius: 8px;
}
.comment-input-container {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.comment-input {
  flex: 1;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 13px;
  resize: none;
  outline: none;
  font-family: inherit;
}
.comment-input:focus { border-color: var(--gold-primary); }
.comment-submit-btn {
  padding: 10px 20px;
  background: var(--gold-primary);
  border: none;
  border-radius: 8px;
  color: #050508;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.comment-submit-btn:hover { background: var(--gold-light); }
.comments-list { display: flex; flex-direction: column; gap: 12px; }
.comment-item {
  padding: 12px;
  background: var(--bg-primary);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.comment-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}
.comment-author { font-size: 12px; font-weight: 600; color: var(--gold-primary); }
.comment-time { font-size: 11px; color: var(--text-muted); }
.comment-content { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
.comment-empty {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 13px;
}

/* 推荐作品 */
.modal-recommendations {
  padding: 20px;
  border-top: 1px solid var(--border-color);
}
.recommendations-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-primary);
  margin-bottom: 16px;
}

/* 视频播放器 */
.video-player-container {
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}
.video-controls {
  background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.7));
  padding: 8px 12px;
}
.video-progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
  margin-bottom: 8px;
  position: relative;
}
.video-progress-fill {
  height: 100%;
  background: var(--gold-primary);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s;
}
.video-progress-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  background: var(--gold-primary);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
}
.video-progress-bar:hover .video-progress-thumb {
  opacity: 1;
}
.video-controls-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.video-ctrl-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background 0.2s;
}
.video-ctrl-btn:hover {
  background: rgba(255,255,255,0.1);
}
.video-time {
  color: rgba(255,255,255,0.8);
  font-size: 12px;
  font-family: monospace;
  flex: 1;
}
.video-speed-control {
  position: relative;
}
.speed-menu {
  display: none;
  position: absolute;
  bottom: 100%;
  right: 0;
  background: rgba(0,0,0,0.95);
  border-radius: 6px;
  padding: 4px;
  margin-bottom: 4px;
  min-width: 60px;
}
.speed-menu.show {
  display: block;
}
.speed-menu button {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #fff;
  font-size: 12px;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 4px;
  text-align: center;
}
.speed-menu button:hover {
  background: rgba(212,175,55,0.3);
}
.video-volume {
  width: 60px;
  height: 4px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  outline: none;
}
.video-volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  background: var(--gold-primary);
  border-radius: 50%;
  cursor: pointer;
}
.recommendations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

/* 用户中心 */
.user-center-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 10001;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.user-center-modal.active { display: flex; }
.user-center-content {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;

function startCompare() {
  if (selectedWorks.length < 2) {
    alert("请至少选择2个作品进行对比");
    return;
  }
  
  const modal = document.getElementById("video-modal");
  const media = document.getElementById("detail-media");
  const info = document.getElementById("detail-info");
  
  // 修改模态框样式为对比模式
  modal.querySelector(".modal-content").classList.add("compare-modal");
  
  // 生成对比内容
  let compareHTML = '<div class="compare-grid">';
  selectedWorks.forEach(work => {
    const qcResult = qcResults[work.title + ".mp4"] || qcResults[work.title + ".jpg"] || qcResults[work.title + ".png"] || {};
    const qualityScore = qcResult.quality_score || work.quality_score || 0;
    const scoreClass = qualityScore >= 90 ? "compare-score-high" : qualityScore >= 70 ? "compare-score-mid" : "compare-score-low";
    const multiHand = qcResult.has_multi_hand ? "❌" : "✅";
    const deformity = qcResult.has_deformity ? "❌" : "✅";
    const passed = qcResult.passed ? "✅ 通过" : "❌ 未通过";
    
    compareHTML += '<div class="compare-item">';
    compareHTML += '<div class="compare-item-media">';
    if (work.type === "video" && work.video_url) {
      compareHTML += '<video src="' + work.video_url + '" controls></video>';
    } else {
      compareHTML += '<img src="' + work.thumbnail + '" alt="' + work.title + '">';
    }
    compareHTML += '</div>';
    compareHTML += '<div class="compare-item-info">';
    compareHTML += '<div class="compare-item-title">' + work.title + '</div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">类型</span><span class="compare-item-value">' + (work.type === "video" ? "视频" : "图片") + '</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">角色</span><span class="compare-item-value">' + (work.character || "-") + '</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">分类</span><span class="compare-item-value">' + (work.category || "-") + '</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">质量评分</span><span class="compare-item-value ' + scoreClass + '">' + qualityScore + '分</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">质检状态</span><span class="compare-item-value">' + passed + '</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">多手问题</span><span class="compare-item-value">' + multiHand + '</span></div>';
    compareHTML += '<div class="compare-item-row"><span class="compare-item-label">肢体畸形</span><span class="compare-item-value">' + deformity + '</span></div>';
    if (work.size_mb) {
      compareHTML += '<div class="compare-item-row"><span class="compare-item-label">文件大小</span><span class="compare-item-value">' + work.size_mb + 'MB</span></div>';
    }
    compareHTML += '</div></div>';
  });
  compareHTML += '</div>';
  
  media.innerHTML = compareHTML;
  info.innerHTML = "";
  modal.classList.add("active");
}

function batchDownload() {
  if (selectedWorks.length === 0) {
    alert("请先选择作品");
    return;
  }
  
  if (selectedWorks.length > 5) {
    if (!confirm("您选择了 " + selectedWorks.length + " 个作品，批量下载可能需要较长时间，是否继续？")) {
      return;
    }
  }
  
  let success = 0;
  let failed = 0;
  
  selectedWorks.forEach((work, index) => {
    setTimeout(() => {
      const url = work.video_url || work.thumbnail;
      const filename = work.title + (work.type === "video" ? ".mp4" : ".jpg");
      
      // 使用fetch下载
      fetch(url)
        .then(response => response.blob())
        .then(blob => {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
          success++;
        })
        .catch(() => {
          // 如果fetch失败，尝试直接打开链接
          window.open(url, "_blank");
          failed++;
        });
    }, index * 500); // 每个下载间隔500ms，避免同时下载太多
  });
  
  setTimeout(() => {
    alert("批量下载完成：成功 " + success + " 个，失败 " + failed + " 个");
  }, selectedWorks.length * 500 + 1000);
}

function rateWork(workId, rating) {
  ratings[workId] = rating;
  localStorage.setItem("kunlun_ratings", JSON.stringify(ratings));
  
  // 更新评分显示
  const stars = document.querySelectorAll(".rating-star");
  stars.forEach((star, index) => {
    if (index < rating) {
      star.classList.add("active");
    } else {
      star.classList.remove("active");
    }
  });
  
  document.getElementById("rating-text").textContent = "已评分: " + rating + "星";
  
  // 添加清除按钮
  const ratingSection = document.querySelector(".detail-rating-section");
  if (ratingSection && !ratingSection.querySelector(".rating-clear-btn")) {
    const clearBtn = document.createElement("button");
    clearBtn.className = "rating-clear-btn";
    clearBtn.textContent = "清除评分";
    clearBtn.onclick = () => clearRating(workId);
    ratingSection.appendChild(clearBtn);
  }
}

function clearRating(workId) {
  delete ratings[workId];
  localStorage.setItem("kunlun_ratings", JSON.stringify(ratings));
  
  const stars = document.querySelectorAll(".rating-star");
  stars.forEach(star => star.classList.remove("active"));
  
  document.getElementById("rating-text").textContent = "点击星星评分";
  
  const clearBtn = document.querySelector(".rating-clear-btn");
  if (clearBtn) clearBtn.remove();
}

function addComment(workId) {
  const input = document.getElementById("comment-input");
  const content = input.value.trim();
  
  if (!content) {
    alert("请输入评论内容");
    return;
  }
  
  if (!comments[workId]) {
    comments[workId] = [];
  }
  
  const now = new Date();
  const timeStr = now.getFullYear() + "-" + 
    String(now.getMonth() + 1).padStart(2, "0") + "-" + 
    String(now.getDate()).padStart(2, "0") + " " + 
    String(now.getHours()).padStart(2, "0") + ":" + 
    String(now.getMinutes()).padStart(2, "0");
  
  comments[workId].unshift({
    content: content,
    time: timeStr
  });
  
  localStorage.setItem("kunlun_comments", JSON.stringify(comments));
  
  // 更新评论列表
  const commentsList = document.getElementById("comments-list");
  commentsList.innerHTML = comments[workId].map(c => 
    "<div class=\"comment-item\"><div class=\"comment-header\"><span class=\"comment-author\">用户</span><span class=\"comment-time\">" + c.time + "</span></div><div class=\"comment-content\">" + c.content + "</div></div>"
  ).join("");
  
  input.value = "";
  
  // 更新评论计数
  const commentsSection = document.querySelector(".detail-comments-section h4");
  if (commentsSection) {
    commentsSection.textContent = "评论 (" + comments[workId].length + ")";
  }
}

  // 根据相同角色或相同标签推荐
  let recommendations = worksData.filter(w => 
    w.id !== currentWork.id && 
    (w.character === currentWork.character || 
     (w.tags && currentWork.tags && w.tags.some(t => currentWork.tags.includes(t))))
  );
  
  // 如果推荐太少，添加随机作品
  if (recommendations.length < 4) {
    const randomWorks = worksData
      .filter(w => w.id !== currentWork.id && !recommendations.includes(w))
      .sort(() => Math.random() - 0.5)
      .slice(0, 4 - recommendations.length);
    recommendations = recommendations.concat(randomWorks);
  }
  
  // 最多显示6个
  recommendations = recommendations.slice(0, 6);
  
  if (recommendations.length === 0) {
    recommendationsSection.style.display = "none";
    return;
  }
  
  recommendationsGrid.innerHTML = recommendations.map(work => {
    const isVideo = work.type === "video";
    return "<div class=\"recommendation-item\" onclick=\"closeModal();setTimeout(() => handleWorkClick(worksData.find(w => w.id === '" + work.id + "')), 100)\">" +
      "<div class=\"recommendation-thumb\"><img src=\"" + work.thumbnail + "\" alt=\"" + work.title + "\">" +
      (isVideo ? "<div class=\"recommendation-play\">▶</div>" : "") +
      "</div>" +
      "<div class=\"recommendation-title\">" + work.title + "</div>" +
      "</div>";
  }).join("");
  
  recommendationsSection.style.display = "block";
}

// ========== 视频播放器功能 ==========
let currentVideoIndex = -1;

function initVideoPlayer() {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  // 找到当前视频在作品列表中的索引
  const allWorks = getFilteredWorks();
  const videoWorks = allWorks.filter(w => w.type === "video");
  currentVideoIndex = videoWorks.findIndex(w => w.title === document.querySelector(".detail-title")?.textContent);
  
  // 播放进度更新
  video.addEventListener("timeupdate", updateProgress);
  
  // 播放/暂停状态更新
  video.addEventListener("play", () => {
    document.getElementById("play-pause-btn").textContent = "⏸";
  });
  video.addEventListener("pause", () => {
    document.getElementById("play-pause-btn").textContent = "▶";
  });
  
  // 点击进度条跳转
  document.getElementById("video-progress-bar").addEventListener("click", seekVideo);
  
  // 视频结束自动播放下一个
  video.addEventListener("ended", nextVideo);
  
  // 初始化音量
  video.volume = 1;
}

function updateProgress() {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  const percent = (video.currentTime / video.duration) * 100;
  document.getElementById("video-progress-fill").style.width = percent + "%";
  document.getElementById("video-progress-thumb").style.left = percent + "%";
  
  const currentTime = formatTime(video.currentTime);
  const duration = formatTime(video.duration);
  document.getElementById("video-time").textContent = currentTime + " / " + duration;
}

function formatTime(seconds) {
  if (isNaN(seconds)) return "00:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}

function seekVideo(e) {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  video.currentTime = percent * video.duration;
}

function togglePlayPause() {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
}

function toggleSpeedMenu() {
  document.getElementById("speed-menu").classList.toggle("show");
}

function setSpeed(speed) {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  video.playbackRate = speed;
  document.getElementById("speed-btn").textContent = speed + "x";
  document.getElementById("speed-menu").classList.remove("show");
}

function toggleMute() {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  video.muted = !video.muted;
  document.getElementById("mute-btn").textContent = video.muted ? "🔇" : "🔊";
}

function setVolume(value) {
  const video = document.getElementById("modal-video");
  if (!video) return;
  
  video.volume = value;
  if (value == 0) {
    video.muted = true;
    document.getElementById("mute-btn").textContent = "🔇";
  } else {
    video.muted = false;
    document.getElementById("mute-btn").textContent = "🔊";
  }
}

function toggleFullscreen() {
  const container = document.querySelector(".video-player-container");
  if (!container) return;
  
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    container.requestFullscreen();
  }
}

function prevVideo() {
  const videoWorks = getFilteredWorks().filter(w => w.type === "video");
  if (videoWorks.length === 0) return;
  
  currentVideoIndex = (currentVideoIndex - 1 + videoWorks.length) % videoWorks.length;
  const work = videoWorks[currentVideoIndex];
  closeModal();
  setTimeout(() => handleWorkClick(work), 200);
}

function nextVideo() {
  const videoWorks = getFilteredWorks().filter(w => w.type === "video");
  if (videoWorks.length === 0) return;
  
  currentVideoIndex = (currentVideoIndex + 1) % videoWorks.length;
  const work = videoWorks[currentVideoIndex];
  closeModal();
  setTimeout(() => handleWorkClick(work), 200);
}

// 点击其他地方关闭倍速菜单
document.addEventListener("click", (e) => {
  if (!e.target.closest(".video-speed-control")) {
    const menu = document.getElementById("speed-menu");
    if (menu) menu.classList.remove("show");
  }
});

function toggleAdvancedFilters() {
  const panel = document.getElementById("advanced-filters");
  panel.style.display = panel.style.display === "none" ? "flex" : "none";
}

function clearFilters() {
  document.getElementById("search-input").value = "";
  document.getElementById("filter-type").value = "";
  document.getElementById("filter-character").value = "";
  const tagEl = document.getElementById("filter-tag");
  if (tagEl) tagEl.value = "";
  const sortEl = document.getElementById("sort-select");
  if (sortEl) sortEl.value = "default";
  const qualityEl = document.getElementById("filter-quality");
  if (qualityEl) qualityEl.value = "";
  const advTagEl = document.getElementById("filter-tag");
  if (advTagEl) advTagEl.value = "";
  const sortAdvEl = document.getElementById("filter-sort");
  if (sortAdvEl) sortAdvEl.value = "default";
  filterWorks();
}

function shareWork(title, url) {
  const modal = document.getElementById("video-modal");
  const media = document.getElementById("detail-media");
  const info = document.getElementById("detail-info");
  
  modal.querySelector(".modal-content").classList.add("share-modal");
  
  const fullUrl = "https://www.huodouai.com/drama/gallery/?work=" + encodeURIComponent(title);
  const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(fullUrl);
  
  media.innerHTML = '<div class="share-content">' +
    '<div class="share-title">分享作品</div>' +
    '<div class="share-qr"><img src="' + qrUrl + '" alt="分享二维码"></div>' +
    '<div class="share-link-container">' +
    '<input type="text" class="share-link-input" id="share-link-input" value="' + fullUrl + '" readonly>' +
    '<button class="share-copy-btn" id="share-copy-btn" onclick="copyShareLink()">复制链接</button>' +
    '</div>' +
    '<div class="share-tip">扫描二维码或复制链接分享给朋友</div>' +
    '</div>';

function copyShareLink() {
  const input = document.getElementById("share-link-input");
  const btn = document.getElementById("share-copy-btn");
  
  input.select();
  input.setSelectionRange(0, 99999);
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(input.value).then(() => {
      btn.textContent = "已复制 ✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "复制链接";
        btn.classList.remove("copied");
      }, 2000);
    }).catch(() => {
      document.execCommand("copy");
      btn.textContent = "已复制 ✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "复制链接";
        btn.classList.remove("copied");
      }, 2000);
    });
  } else {
    document.execCommand("copy");
    btn.textContent = "已复制 ✓";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "复制链接";
      btn.classList.remove("copied");
    }, 2000);
  }
}

// 视频预加载缓存
const preloadedVideos = new Set();

function preloadVideo(url) {
  if (preloadedVideos.has(url)) return;
  preloadedVideos.add(url);
  
  // 创建隐藏的video元素来预加载
  const video = document.createElement("video");
  video.preload = "auto";
  video.src = url;
  video.muted = true;
  video.playsInline = true;
  
  // 只加载前几秒的数据
  video.addEventListener("loadedmetadata", () => {
    try {
      video.currentTime = 0.1;
    } catch (e) {}
  });
  
  // 加载完成后移除元素（保留缓存）
  video.addEventListener("canplaythrough", () => {
    setTimeout(() => {
      if (video.parentNode) {
        video.parentNode.removeChild(video);
      }
    }, 1000);
  });
  
  // 添加到页面（隐藏）
  video.style.display = "none";
  video.style.position = "absolute";
  video.style.width = "0";
  video.style.height = "0";
  document.body.appendChild(video);
  
  // 30秒后如果还没播放，移除元素
  setTimeout(() => {
    if (video.parentNode) {
      video.parentNode.removeChild(video);
    }
  }, 30000);
}

// 页面加载时检查是否有work参数，如果有则自动打开该作品
window.addEventListener("load", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const workName = urlParams.get("work");
  if (workName) {
    setTimeout(() => {
      const work = worksData.find(w => w.title === decodeURIComponent(workName));
      if (work) {
        handleWorkClick(work);
      }
    }, 500);
  }
});

function applyFilters() {
  const filtered = getFilteredWorks();
  renderFilteredWorks(filtered);
}

function renderFilteredWorks(works) {
  const grid = document.getElementById("gallery-grid");
  grid.innerHTML = "";
  displayedCount = 0;
  
  if (works.length === 0) {
    grid.innerHTML = "<div style=\"grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);\">未找到匹配的作品</div>";
    return;
  }
  
  // 显示第一页
  loadMoreWorks(works);
  
  // 显示加载更多按钮
  const loadMoreContainer = document.getElementById("load-more-container");
  if (loadMoreContainer) {
    if (works.length > PAGE_SIZE) {
      loadMoreContainer.style.display = "block";
      document.getElementById("load-more-btn").textContent = "加载更多 (" + (works.length - PAGE_SIZE) + "个作品)";
    } else {
      loadMoreContainer.style.display = "none";
    }
  }
}

function createWorkCard(work) {
  const card = document.createElement("div");
  card.className = "work-card";
  card.onclick = () => handleWorkClick(work);
  
  let html = '<img class="work-card-thumbnail" src="' + (work.thumbnail || "") + '" alt="' + (work.title || "") + '" loading="lazy">';
  html += '<div class="work-card-badge">' + (work.category || work.type || "") + '</div>';
  if (work.type === "video") html += '<div class="work-card-play"></div>';
  html += '<div class="work-card-overlay"><div class="work-card-title">' + (work.title || "") + '</div>';
  html += '<div class="work-card-meta">' + (work.character || "") + ' · ' + (work.type === "video" ? "视频" : "图片") + '</div></div>';
  card.innerHTML = html;
  
  return card;
}

function loadMoreWorks(works) {
  if (isLoading) return;
  isLoading = true;
  
  const grid = document.getElementById("gallery-grid");
  const nextCount = Math.min(displayedCount + PAGE_SIZE, works.length);
  
  for (let i = displayedCount; i < nextCount; i++) {
    const work = works[i];
    const card = createWorkCard(work);
    card.style.animationDelay = ((i % PAGE_SIZE) * 0.03) + "s";
    grid.appendChild(card);
  }
  
  displayedCount = nextCount;
  isLoading = false;
  
  // 更新加载更多按钮
  const loadMoreContainer = document.getElementById("load-more-container");
  if (loadMoreContainer) {
    const remaining = works.length - displayedCount;
    if (remaining > 0) {
      loadMoreContainer.style.display = "block";
      document.getElementById("load-more-btn").textContent = "加载更多 (" + remaining + "个作品)";
    } else {
      loadMoreContainer.style.display = "none";
    }
  }
}

// 无限滚动
window.addEventListener("scroll", () => {
  if (isLoading) return;
  
  const scrollPosition = window.innerHeight + window.scrollY;
  const pageHeight = document.documentElement.scrollHeight;
  
  // 当滚动到距离底部200px时自动加载更多
  if (scrollPosition >= pageHeight - 200) {
    const filtered = getFilteredWorks();
    if (displayedCount < filtered.length) {
      loadMoreWorks(filtered);
    }
  }
});

function getFilteredWorks() {
  let filtered = [...worksData];
  
  if (currentFilter !== "all") {
    if (currentFilter === "video") {
      filtered = filtered.filter(w => w.type === "video");
    } else if (currentFilter === "image") {
      filtered = filtered.filter(w => w.type === "image");
    } else if (currentFilter === "favorites") {
      filtered = filtered.filter(w => favorites.includes(w.id));
    } else {
      filtered = filtered.filter(w => w.character === currentFilter);
    }
  }
  
  // 标签筛选
  if (currentTagFilter !== "all") {
    filtered = filtered.filter(w => w.tags && w.tags.includes(currentTagFilter));
  }
  
  if (currentSearch) {
    filtered = filtered.filter(w => 
      w.title.toLowerCase().includes(currentSearch) ||
      (w.character && w.character.toLowerCase().includes(currentSearch)) ||
      (w.category && w.category.toLowerCase().includes(currentSearch))
    );
  }
  
  switch (currentSort) {
    case "quality-desc":
      filtered.sort((a, b) => (b.quality_score || 0) - (a.quality_score || 0));
      break;
    case "quality-asc":
      filtered.sort((a, b) => (a.quality_score || 0) - (b.quality_score || 0));
      break;
    case "name-asc":
      filtered.sort((a, b) => a.title.localeCompare(b.title, "zh-CN"));
      break;
    case "name-desc":
      filtered.sort((a, b) => b.title.localeCompare(a.title, "zh-CN"));
      break;
    case "video-first":
      filtered.sort((a, b) => (b.type === "video" ? 1 : 0) - (a.type === "video" ? 1 : 0));
      break;
    case "image-first":
      filtered.sort((a, b) => (b.type === "image" ? 1 : 0) - (a.type === "image" ? 1 : 0));
      break;
  }
  
  return filtered;
}

function renderGallery(filter) {
  currentFilter = filter;
  applyFilters();
}
function handleWorkClick(work) {
  openModal(work);
}
function openModal(src) {
  const modal = document.getElementById("video-modal");
  const video = document.getElementById("modal-video");
  if (src.match(/\.(mp4|webm|mov)$/i)) {
    video.src = src; video.style.display = "block";
  } else {
    video.style.display = "none";
    const img = document.createElement("img");
    img.src = src; img.style.maxWidth = "90vw"; img.style.maxHeight = "85vh"; img.style.borderRadius = "8px";
    const content = modal.querySelector(".modal-content");
    content.innerHTML = '<button class="modal-close" onclick="closeModal()">&times;</button>';
    content.appendChild(img);
  }
  modal.classList.add("active");
}
function closeModal() {
  const modal = document.getElementById("video-modal");
  const video = document.getElementById("modal-video");
  video.pause(); video.src = ""; modal.classList.remove("active");
}
document.querySelectorAll(".filter-tag").forEach(tag => {
  tag.addEventListener("click", () => {
    document.querySelectorAll(".filter-tag").forEach(t => t.classList.remove("active"));
    tag.classList.add("active");
    renderGallery(tag.dataset.filter);
  });
});
document.getElementById("video-modal").addEventListener("click", (e) => { if (e.target.id === "video-modal") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
initGallery();
</script>

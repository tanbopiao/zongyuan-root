<script>
const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (url.includes('/ai-proxy/')) {
    opts.headers['Authorization'] = 'Basic ' + btoa('zongyuan:8v4iGrYBK2Fz9UC');
  }
  return _origFetch(url, opts);
};
const API = "/ai-proxy/drama";
let currentEp = "EP01";
let polling = false;
let pollTimer = null;

const STAGE_MAP = {
  "idle": -1, "init_project": 0, "storyboard_generating": 1, "storyboard_verify": 1,
  "storyboard_ready": 1, "keyframe_generating": 2, "keyframe_drift_scan": 2,
  "keyframes_pending": 2, "keyframes_partial": 2, "keyframes_ready": 2,
  "video_clip_generating": 3, "videos_pending": 3, "videos_partial": 3, "videos_ready": 3,
  "subtitle_render_prep": 4, "ffmpeg_composing": 5,
  "four_truth_global_check": 6, "snap_archive_lock": 6, "complete": 7,
  "drift_abort": -1, "error_abort": -1
};
const STATUS_TEXT = {
  "storyboard_ready": "分镜完成，待生成媒体",
  "keyframes_pending": "待配置图片API",
  "keyframes_partial": "关键帧部分完成",
  "keyframes_ready": "关键帧完成",
  "videos_pending": "待配置视频API",
  "videos_partial": "视频部分完成",
  "videos_ready": "视频完成，待合成"
};

// 初始化
document.addEventListener("DOMContentLoaded", function() {
  loadApi();
  document.querySelectorAll(".ep-tab").forEach(tab => {
    tab.addEventListener("click", function() {
      document.querySelectorAll(".ep-tab").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      currentEp = this.dataset.ep;
      refreshStatus();
    });
  });
  refreshStatus();
});

function loadApi() {
  const img = localStorage.getItem("drama_img_api") || "";
  const vid = localStorage.getItem("drama_vid_api") || "";
  document.getElementById("imgApiKey").value = img;
  document.getElementById("vidApiKey").value = vid;
  updateApiStatus(img, vid);
}

function saveApi() {
  const img = document.getElementById("imgApiKey").value.trim();
  const vid = document.getElementById("vidApiKey").value.trim();
  localStorage.setItem("drama_img_api", img);
  localStorage.setItem("drama_vid_api", vid);
  updateApiStatus(img, vid);
  showToast("API配置已保存");
}

function updateApiStatus(img, vid) {
  const el = document.getElementById("apiStatus");
  if (img && vid) {
    el.className = "api-status api-configured";
    el.textContent = "API 已配置 ✓";
  } else {
    el.className = "api-status api-not-configured";
    el.textContent = "未配置 API（分镜可生成，媒体需配置）";
  }
}

function showToast(msg) {
  const t = document.createElement("div");
  t.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 24px;background:rgba(0,0,0,0.85);color:#fff;border-radius:10px;font-size:14px;z-index:9999";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function addLog(msg) {
  const area = document.getElementById("logArea");
  area.classList.add("show");
  const line = document.createElement("div");
  line.className = "log-line";
  line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  area.appendChild(line);
  area.scrollTop = area.scrollHeight;
}

async function startProduction() {
  const btn = document.getElementById("startBtn");
  btn.disabled = true;
  btn.textContent = "生产中...";

  const imgApi = document.getElementById("imgApiKey").value.trim();
  const vidApi = document.getElementById("vidApiKey").value.trim();
  const topic = document.getElementById("topic").value.trim() || "昆仑洞天·太阴月神觉醒";

  addLog("开始生产 " + currentEp + " - " + topic);

  try {
    const resp = await fetch("/ai-proxy/drama/oneclick", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        episode: currentEp,
        topic: topic,
        stage: "full",
        image_api: imgApi ? {api_key: imgApi, provider: "seedream", endpoint: "https://ark.cn-beijing.volces.com/api/v3", model: "seedream-4-0-250828"} : null,
        video_api: vidApi ? {api_key: vidApi, provider: "seedance", endpoint: "https://ark.cn-beijing.volces.com/api/v3", model: "seedance-2-5"} : null
      })
    });
    const data = await resp.json();
    addLog("编排已启动: " + JSON.stringify(data));
    startPolling();
  } catch (e) {
    addLog("启动失败: " + e.message);
    btn.disabled = false;
    btn.textContent = "▶ 开始生产";
  }
}

function startPolling() {
  if (polling) return;
  polling = true;
  pollTimer = setInterval(refreshStatus, 3000);
  refreshStatus();
}

function stopPolling() {
  polling = false;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

async function refreshStatus() {
  try {
    const resp = await fetch("/ai-proxy/drama/oneclick/status");
    const data = await resp.json();
    const ep = data.episodes && data.episodes[currentEp];
    if (!ep) {
      updateStages(-1);
      return;
    }
    const status = ep.status || "idle";
    const stageIdx = STAGE_MAP[status] !== undefined ? STAGE_MAP[status] : -1;
    updateStages(stageIdx);

    // 显示日志
    if (ep.logs && ep.logs.length) {
      const area = document.getElementById("logArea");
      area.classList.add("show");
      area.innerHTML = ep.logs.slice(-20).map(l => '<div class="log-line">' + l + '</div>').join("");
      area.scrollTop = area.scrollHeight;
    }

    // 按钮文字智能切换
    const btn = document.getElementById("startBtn");
    if (status === "storyboard_ready") {
      btn.disabled = false;
      btn.textContent = "▶ 继续生成媒体";
    } else if (status === "keyframes_pending" || status === "keyframes_partial") {
      btn.disabled = false;
      btn.textContent = "▶ 继续生成关键帧";
    } else if (status === "videos_pending" || status === "videos_partial") {
      btn.disabled = false;
      btn.textContent = "▶ 继续生成视频";
    } else if (status === "videos_ready") {
      btn.disabled = false;
      btn.textContent = "▶ 开始合成";
    }
    // 完成
    if (status === "complete" || stageIdx === 7) {
      stopPolling();
      btn.disabled = false;
      btn.textContent = "▶ 重新生产";
      showResult(ep);
    }
    // 错误
    if (status === "error_abort" || status === "drift_abort") {
      stopPolling();
      document.getElementById("startBtn").disabled = false;
      document.getElementById("startBtn").textContent = "▶ 重试";
      showToast("生产异常: " + status);
    }

    // 加载分镜预览
    if (stageIdx >= 1 && stageIdx < 7) {
      loadStoryboard();
    }
  } catch (e) {
    console.error("状态刷新失败", e);
  }
}

function updateStages(currentIdx) {
  const items = document.querySelectorAll(".stage-item");
  let doneCount = 0;
  items.forEach((item, idx) => {
    const icon = item.querySelector(".stage-icon");
    item.classList.remove("done", "doing");
    if (idx < currentIdx) {
      icon.className = "stage-icon stage-done";
      icon.textContent = "✓";
      item.classList.add("done");
      doneCount++;
    } else if (idx === currentIdx) {
      icon.className = "stage-icon stage-doing";
      icon.textContent = "●";
      item.classList.add("doing");
    } else {
      icon.className = "stage-icon stage-wait";
      icon.textContent = "○";
    }
  });
  const pct = Math.round((doneCount / 7) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = currentIdx >= 0 ?
    "进度 " + pct + "% · " + (currentIdx < 7 ? items[currentIdx].querySelector(".stage-name").textContent + "中" : "已完成") :
    "等待开始";
}

async function loadStoryboard() {
  try {
    const resp = await fetch(API + "/storyboard/" + currentEp);
    if (resp.status !== 200) return;
    const sb = await resp.json();
    const preview = document.getElementById("storyboardPreview");
    if (sb.shots && sb.shots.length) {
      preview.classList.add("show");
      preview.innerHTML = "<div style='color:#c9a7e8;font-weight:600;margin-bottom:6px'>" + (sb.title || currentEp) + " · " + sb.shots.length + "镜</div>" +
        sb.shots.map(s => '<div class="shot-item">镜' + s.shot + ': ' + (s.scene || s.visual || '') + '</div>').join("");
    }
  } catch (e) {}
}

function showResult(ep) {
  const card = document.getElementById("resultCard");
  card.classList.add("show");
  const video = document.getElementById("finalVideo");
  if (ep.output) {
    video.src = "/drama/videos/" + ep.output;
  }
  card.scrollIntoView({behavior: "smooth"});
}

function downloadVideo() {
  const video = document.getElementById("finalVideo");
  if (video.src) {
    const a = document.createElement("a");
    a.href = video.src;
    a.download = currentEp + "_final.mp4";
    a.click();
  }
}

function shareVideo() {
  const video = document.getElementById("finalVideo");
  if (navigator.share && video.src) {
    navigator.share({title: "昆仑洞天短剧", url: video.src});
  } else {
    navigator.clipboard.writeText(window.location.origin + video.getAttribute("src"));
    showToast("链接已复制");
  }
}
</script>

<script>

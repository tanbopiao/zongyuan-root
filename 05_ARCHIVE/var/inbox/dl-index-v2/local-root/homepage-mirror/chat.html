<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>元极恒一 · 智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f5f0e6;font-family:serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px 16px;border-bottom:1px solid #c9a96122;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,.9);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;border:1.5px solid #c9a961;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#c9a961;font-size:12px}
.logo-text{font-size:16px;color:#c9a961;letter-spacing:2px}
.nav a{color:#888;text-decoration:none;margin-left:12px;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:16px}
.msg{margin:10px 0;padding:12px 14px;border-radius:12px;line-height:1.7;max-width:88%;animation:fadeIn .3s;word-break:break-word;font-size:14px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.user{background:linear-gradient(135deg,#c9a96133,#c9a96111);border-left:2px solid #c9a961;margin-left:auto}
.bot{background:#1a1a24;border-left:2px solid #666}
.typing{color:#888}
.quick{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;flex-shrink:0}
.quick button{padding:5px 12px;border-radius:14px;border:1px solid #c9a96133;background:transparent;color:#888;font-size:11px;cursor:pointer;white-space:nowrap}
.input-area{padding:12px 16px;border-top:1px solid #c9a96122;background:rgba(10,10,15,.95);display:flex;gap:8px;align-items:center;flex-shrink:0}
.input-area input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid #c9a96133;background:#1a1a24;color:#f5f0e6;font-size:14px;outline:none}
.input-area button{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#c9a961,#a88840);border:none;color:#0a0a0f;cursor:pointer;font-size:16px}
.status{font-size:10px;color:#666;text-align:center;padding:4px}
</style>
</head>
<body>
<div class="header"><div class="logo"><div class="logo-icon">Ω</div><div class="logo-text">元极恒一</div></div><div class="nav"><a href="/">主站</a><a href="/kunlun.html">昆仑</a><a href="/gallery">作品</a></div></div>
<div class="messages" id="msgs"><div class="msg bot">你好，我是元极恒一智能体。</div></div>
<div class="quick"><button onclick="quick(\"昆仑洞天\")">昆仑洞天</button><button onclick="quick(\"作品库\")">作品库</button><button onclick="quick(\"短剧产线\")">短剧产线</button></div>
<div class="input-area"><input id="inp" placeholder="输入指令..." autocomplete="off"><button onclick="send()">➤</button></div>
<div class="status">Ω₀⊂⊙∞⊂Ω</div>
<script>
async function send(){const q=document.getElementById("inp").value.trim();if(!q)return;document.getElementById("inp").value="";const m=document.getElementById("msgs");m.innerHTML+=`<div class="msg user">${q}</div>`;m.innerHTML+=`<div class="msg bot typing">思考中...</div>`;m.scrollTop=m.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({msg:q})});const d=await r.json();m.lastChild.className="msg bot";m.lastChild.textContent=d.reply||"无响应"}catch(e){m.lastChild.textContent="服务暂不可用"}m.scrollTop=m.scrollHeight}
function quick(q){document.getElementById("inp").value=q;send()}
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script>
</body>
</html>

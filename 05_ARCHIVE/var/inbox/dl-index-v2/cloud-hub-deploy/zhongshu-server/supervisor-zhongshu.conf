# 云端中枢元内核 · supervisor 配置
# 放 /etc/supervisor/conf.d/zhongshu.conf，然后 supervisorctl reread && update

[program:zhongshu-gateway]
command=python3 /www/wwwroot/huodouai.com/zhongshu/zhongshu-server/gateway_server.py --port 9001
directory=/www/wwwroot/huodouai.com/zhongshu/zhongshu-server
autostart=true
autorestart=true
stdout_logfile=/www/wwwroot/huodouai.com/zhongshu/data/gateway.log
stderr_logfile=/www/wwwroot/huodouai.com/zhongshu/data/gateway.err
environment=ZR_TRUTH_DIR="/www/wwwroot/huodouai.com/zhongshu/data/truth"

[program:zhongshu-scheduler]
command=python3 /www/wwwroot/huodouai.com/zhongshu/zhongshu-server/scheduler.py --interval 300
directory=/www/wwwroot/huodouai.com/zhongshu/zhongshu-server
autostart=true
autorestart=true
stdout_logfile=/www/wwwroot/huodouai.com/zhongshu/data/scheduler.log
stderr_logfile=/www/wwwroot/huodouai.com/zhongshu/data/scheduler.err
environment=ZR_TRUTH_DIR="/www/wwwroot/huodouai.com/zhongshu/data/truth"

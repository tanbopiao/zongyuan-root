name: ZONGYUAN-ROOT CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # 每日凌晨2点

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn aiohttp pydantic requests numpy pandas pillow
      
      - name: Run test suite
        run: |
          python3 tests/test_suite.py
      
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: logs/test_report_*.json

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          echo "扫描敏感信息..."
          grep -r "api_key\|secret_key\|password" --include="*.json" config/ || echo "无明文密钥"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate API docs
        run: |
          echo "生成API文档..."
          python3 scripts/generate_docs.py || echo "文档生成脚本待完善"

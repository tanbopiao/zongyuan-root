name: CI - 灵境系统自动测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome
      
      - name: 运行灵境系统测试
        run: |
          cd lingjing-system
          python test_v4.py
      
      - name: 导出资产清单
        run: |
          cd perpetual-archive/scripts
          python export_asset_manifest.py ../../lingjing-system --output /tmp/manifest.json
      
      - name: 完整性校验
        run: |
          cd perpetual-archive/scripts
          python verify_integrity.py ../../lingjing-system --manifest /tmp/manifest.json
      
      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/manifest.*

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a14; color:#e0e0e0; font-family:'Noto Sans SC',sans-serif; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:25px 40px; border-bottom:2px solid #d4af37; }

.header .meta { color:#888; font-size:12px; }
.container { max-width:1400px; margin:0 auto; padding:25px; }
.health-score { text-align:center; margin-bottom:25px; }
.health-score .score { font-size:72px; font-weight:bold; color:#4ade80; }
.health-score .label { font-size:16px; color:#888; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:25px; }
.stat-card { background:#1a1a2e; border:1px solid #333; border-radius:10px; padding:15px; text-align:center; }
.stat-card .value { font-size:22px; color:#d4af37; font-weight:bold; }
.stat-card .label { font-size:11px; color:#888; margin-top:3px; }
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:25px; }
.chart-box { background:#1a1a2e; border:1px solid #333; border-radius:12px; padding:18px; }
.chart-box h3 { color:#d4af37; margin-bottom:12px; font-size:14px; }
.chart { width:100%; height:250px; }
.anomaly-box { background:#1a1a2e; border:1px solid #333; border-radius:12px; padding:18px; margin-bottom:20px; }
.anomaly-box h3 { color:#ef4444; margin-bottom:12px; }
.anomaly-item { padding:10px; border-left:3px solid #ef4444; margin-bottom:8px; background:#1a0a0a; }
.anomaly-item .severity { color:#ef4444; font-weight:bold; font-size:12px; }
.anomaly-item .message { color:#ccc; font-size:13px; margin-top:3px; }
.rec-box { background:#1a1a2e; border:1px solid #333; border-radius:12px; padding:18px; margin-bottom:20px; }
.rec-box h3 { color:#4ade80; margin-bottom:12px; }
.rec-item { padding:10px; border-left:3px solid #4ade80; margin-bottom:8px; background:#0a1a0a; }
.rec-item .title { color:#4ade80; font-weight:bold; font-size:13px; }
.rec-item .suggestion { color:#ccc; font-size:12px; margin-top:3px; }
.footer { text-align:center; padding:25px; color:#555; font-size:11px; border-top:1px solid #222; }
@media (max-width:768px) { .charts-grid { grid-template-columns:1fr; } }
</style>
</head>
